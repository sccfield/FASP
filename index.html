<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="author" content="Mohamed BARR">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#FE5000">
<title>Everpure Certified FlashArray Storage Professional (FASP) – QCM</title>
<!-- Seule ressource externe (facultative) : police Google Fonts. Sans connexion, la pile de secours système est utilisée. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ Jetons de design (modifiez ici les couleurs de la marque) ============ */
:root{
  --creme:#FEF6E3;           /* fond crème de l'en-tête (couleur du logo) */
  --noir:#1C1C1C;            /* sombre / mode nuit officiel */
  --orange:#FE5000;          /* orange Pure Storage / Everpure */
  --orange-fonce:#D94400;
  --orange-pale:#FFEDE3;
  --encre:#2A2A2A;           /* texte principal */
  --gris:#6B6B6B;            /* texte secondaire */
  --bg:#F4F4F2;              /* arrière-plan du portail */
  --carte:#FFFFFF;
  --trait:#E2E2DE;
  --ok:#1A8F4C; --ok-bg:#E6F6EC;
  --ko:#D32F2F; --ko-bg:#FDECEC;
  --hdr:#FEF6E3; --hdr-trait:#EADFC6; --champ-trait:#9a9a9a;
  --rayon:12px;
  --police:'Figtree','Inter','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
:root[data-theme=dark]{--bg:#121212;--carte:#1C1C1C;--encre:#EDEDED;--gris:#A3A3A3;--trait:#333;--orange-fonce:#FF8A4C;--orange-pale:#3A2113;
  --ok:#3DBE74;--ok-bg:#12301F;--ko:#FF6B6B;--ko-bg:#3A1717;--hdr:#1C1C1C;--hdr-trait:#333;--champ-trait:#777;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--police);background:var(--bg);color:var(--encre);line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* ============ Arrière-plans officiels Pure Storage (fournis) ============ */
/* Arrière-plan Orange Pure Storage */
.bg-pure-orange { background-color: #FE5000; }
/* Arrière-plan Sombre / Mode Nuit officiel */
.bg-pure-dark { background-color: #1C1C1C; }

/* ============ En-tête ============ */
header{background:var(--hdr);color:var(--encre);border-bottom:1px solid var(--hdr-trait);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.entete{max-width:960px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lien-accueil{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--encre);font-weight:800;font-size:1rem;padding:6px 4px}
.lien-accueil:hover{color:var(--orange)}
.score-live{margin-left:auto;color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem;white-space:nowrap}
.barre-globale{height:6px;background:var(--orange)}
.barre-globale div{height:100%;width:0;background:var(--orange);transition:width .4s ease}

.banniere-in{max-width:960px;margin:0 auto;padding:28px 20px 34px;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center}
.banniere h1{color:#fff;font-size:clamp(1.7rem,4.4vw,2.6rem);line-height:1.15;margin:0 0 14px}
.banniere p{color:#cfcfcf;margin:0;max-width:44ch;font-size:1.02rem}
.banniere img{width:100%;height:auto;display:block}
.liseré{height:6px}
body.hors-sommaire .banniere,body.hors-sommaire .liseré{display:none}
main{max-width:960px;margin:0 auto;padding:28px 20px 60px}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:var(--rayon);padding:28px}
h1{font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.2;margin:0 0 8px;letter-spacing:-.02em}
h2{font-size:1.2rem;margin:0 0 12px}
.sous-titre{color:var(--gris);margin:0 0 22px;max-width:62ch}

/* ============ Boutons ============ */
.btn{border:1.5px solid var(--encre);background:var(--carte);color:var(--encre);border-radius:8px;padding:11px 20px;font-weight:700;transition:background .15s,color .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){background:var(--encre);color:var(--carte)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primaire{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primaire:hover:not(:disabled){background:var(--orange-fonce);border-color:var(--orange-fonce)}
.rangee{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ============ Sommaire ============ */
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 24px}
.stat b{display:block;font-size:1.7rem;line-height:1.1}
.stat span{color:var(--gris);font-size:.85rem}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:20px 0 26px}
.pastille{aspect-ratio:1;border:1.5px solid var(--trait);background:var(--carte);border-radius:10px;font-weight:700;color:var(--encre);transition:transform .1s,border-color .15s}
.pastille:hover{border-color:var(--orange);transform:translateY(-2px)}
.pastille.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pastille.ko{background:var(--ko-bg);border-color:var(--ko);color:var(--ko)}
.pastille.sel{background:var(--orange-pale);border-color:var(--orange);color:var(--orange-fonce)}
.pastille.courante{box-shadow:0 0 0 3px var(--orange)}
.legende{display:flex;gap:18px;flex-wrap:wrap;color:var(--gris);font-size:.85rem;margin-bottom:6px}
.legende i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--trait);background:var(--carte)}
.legende i.ok{background:var(--ok-bg);border-color:var(--ok)} .legende i.ko{background:var(--ko-bg);border-color:var(--ko)}

/* ============ Page question ============ */
.haut-q{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.num-q{font-weight:800;color:var(--orange-fonce);font-size:.95rem}
.lien{background:none;border:0;color:var(--gris);font-weight:600;text-decoration:underline;padding:4px}
.lien:hover{color:var(--orange-fonce)}
.mini-barre{height:6px;background:var(--trait);border-radius:99px;overflow:hidden;margin-bottom:22px}
.mini-barre div{height:100%;background:var(--orange);transition:width .3s}
.enonce{font-size:1.2rem;font-weight:600;line-height:1.45;margin:0 0 22px;max-width:70ch}
.options{display:grid;gap:10px;margin:0 0 22px;padding:0;border:0}
.option{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--trait);background:var(--carte);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.option:hover{border-color:var(--orange)}
.option input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:1px 0 0;border:2px solid var(--champ-trait);border-radius:6px;background:var(--carte);display:grid;place-items:center;cursor:inherit;transition:all .15s}
.option input::after{content:"";width:11px;height:6px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform .15s}
.option input:checked{background:var(--orange);border-color:var(--orange)}
.option input:checked::after{transform:rotate(-45deg) scale(1)}
.option.choisie{border-color:var(--orange);background:var(--orange-pale)}
.lettre{font-weight:800;color:var(--gris);min-width:1.1em}
.texte-opt{flex:1;word-break:break-word}
.option.bonne{border-color:var(--ok);background:var(--ok-bg)}
.option.bonne input{background:var(--ok);border-color:var(--ok)}
.option.bonne input::after{transform:rotate(-45deg) scale(1)}
.option.mauvaise{border-color:var(--ko);background:var(--ko-bg)}
.option.mauvaise input{background:var(--ko);border-color:var(--ko)}
.option.verrou{cursor:default}
.badge{font-size:.78rem;font-weight:700;border-radius:99px;padding:2px 10px;white-space:nowrap;align-self:center}
.option.bonne .badge{background:var(--ok);color:#fff}
.option.mauvaise .badge{background:var(--ko);color:#fff}

/* Feedback animé (technique grid-template-rows 0fr → 1fr) */
.feedback{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s ease,opacity .35s ease,margin .35s}
.feedback.ouvert{grid-template-rows:1fr;opacity:1;margin-bottom:22px}
.feedback>div{overflow:hidden}
.fb-corps{border-radius:10px;padding:18px 20px;border-left:6px solid}
.fb-corps.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb-corps.ko{background:var(--ko-bg);border-color:var(--ko)}
.fb-titre{font-weight:800;font-size:1.1rem;margin:0 0 6px}
.fb-corps.ok .fb-titre{color:var(--ok)} .fb-corps.ko .fb-titre{color:var(--ko)}
.fb-corps p{margin:0 0 6px;max-width:72ch}
.fb-corps .expl-label{font-weight:700;margin-top:8px}

.nav-q{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--trait);padding-top:20px}
.fleche{width:46px;height:46px;padding:0;font-size:1.2rem;display:grid;place-items:center}
.nav-centre{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}

/* ============ Résumé ============ */
.bilan{text-align:center;padding:12px 0 8px}
.pourcent{font-size:clamp(3rem,12vw,5rem);font-weight:800;line-height:1;color:var(--orange);letter-spacing:-.03em}
.bilan .detail{font-size:1.15rem;font-weight:600;margin:6px 0 18px}
.grande-barre{height:16px;border-radius:99px;background:var(--trait);overflow:hidden;display:flex;max-width:560px;margin:0 auto 10px}
.grande-barre .v{background:var(--ok);height:100%;transition:width .7s ease}
.grande-barre .r{background:var(--ko);height:100%;transition:width .7s ease}
.repartition{color:var(--gris);font-size:.9rem;margin-bottom:22px}
.revue{margin-top:30px;display:grid;gap:14px}
.revue-item{border:1px solid var(--trait);border-radius:10px;padding:18px;background:var(--carte)}
.revue-item.ok{border-left:6px solid var(--ok)} .revue-item.ko{border-left:6px solid var(--ko)} .revue-item.nr{border-left:6px solid #b5b5b0}
.revue-item h3{font-size:1rem;margin:0 0 12px;line-height:1.4}
.revue-item .options{margin-bottom:10px}
.revue-item .option{cursor:default;padding:10px 14px}
details summary{cursor:pointer;font-weight:700;color:var(--orange-fonce);padding:4px 0}
details p{margin:6px 0 0}

/* ---- Pied de page / copyright ---- */
footer{max-width:960px;margin:0 auto;padding:0 20px 36px;text-align:center;font-size:.82rem;color:var(--gris)}
footer p{margin:0 0 4px}
.copyright{font-weight:600;color:var(--encre)}
/* ---- Boutons d'en-tête ---- */
.icone{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--hdr-trait);background:transparent;color:var(--encre);font-size:1.05rem;display:grid;place-items:center;padding:0}
.icone:hover{border-color:var(--orange);color:var(--orange)}
[hidden]{display:none!important}   /* l'attribut hidden doit l'emporter sur display:grid des boutons ronds */
.score-live{margin-left:auto}
/* ---- Filtres (statut / thème) ---- */
.filtres{display:grid;gap:8px;margin:18px 0 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips small{color:var(--gris);font-weight:700;min-width:56px}
.chip{border:1.5px solid var(--trait);background:var(--carte);color:var(--encre);border-radius:99px;padding:5px 12px;font-size:.84rem;font-weight:600}
.chip:hover{border-color:var(--orange)}
.chip.actif{background:var(--orange);border-color:var(--orange);color:#fff}
.chip.vide{opacity:.45}
.apropos h3{font-size:1.1rem;margin:24px 0 8px}
.modale{position:fixed;inset:0;z-index:2500;background:rgba(10,10,10,.6);display:grid;place-items:center;padding:20px}
.modale-corps{background:var(--carte);color:var(--encre);border-radius:12px;padding:24px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.modale-corps p{margin:0 0 18px;white-space:pre-line;font-weight:600}
.apropos p,.apropos li{max-width:72ch}
/* ---- Texte enrichi et exhibits ---- */
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--orange-pale);padding:1px 6px;border-radius:5px;font-size:.9em;word-break:break-word}
.exhibit{margin:0 0 22px;border:1.5px solid var(--trait);border-radius:10px;overflow:hidden;background:var(--carte)}
.exhibit-img{position:relative;display:block;width:100%;border:0;padding:0;background:var(--bg);cursor:zoom-in}
.exhibit-img img{display:block;width:100%;max-height:420px;object-fit:contain}
.loupe{position:absolute;right:10px;bottom:10px;background:rgba(28,28,28,.88);color:#fff;border-radius:99px;padding:5px 12px;font-size:.82rem;font-weight:700}
.exhibit details,.exhibit figcaption{padding:10px 16px;margin:0}
.exhibit figcaption{border-left:6px solid var(--orange);background:var(--orange-pale);font-size:.95rem}
/* ---- Zoom plein écran ---- */
.zoom{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:2000;background:rgba(10,10,10,.94);display:flex;flex-direction:column}
.zoom-barre{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;color:#fff;flex-wrap:wrap}
.zoom-barre button{background:#2b2b2b;color:#fff;border:1px solid #555;border-radius:8px;min-width:42px;height:40px;font-weight:700;padding:0 12px}
.zoom-barre button:hover{border-color:var(--orange)}
.zoom-barre span{min-width:60px;text-align:center;font-weight:700}
.zoom-scene{flex:1;overflow:hidden;display:grid;place-items:center;touch-action:none;cursor:grab}
.zoom-scene:active{cursor:grabbing}
.zoom-scene img{max-width:96%;max-height:96%;transform-origin:center;background:#fff;-webkit-user-drag:none}
/* ---- Protection anti-reproduction (voir PROTECTION dans le script) ---- */
body.anti-copie{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.anti-copie input{-webkit-user-select:auto;user-select:auto}
#rapport{display:none}
button.option{width:100%;text-align:left;color:var(--encre)}
@media print{
  body.export-pdf>*:not(#rapport){display:none!important}
  body.export-pdf #rapport{display:block;color:#000;background:#fff;font:13px/1.45 Arial,sans-serif;padding:8mm}
  #rapport h1{font-size:20px;color:#FE5000;margin:0 0 6px} #rapport h2{font-size:15px;margin:16px 0 6px}
  #rapport table{width:100%;border-collapse:collapse} #rapport th,#rapport td{border:1px solid #bbb;padding:4px 8px;text-align:left}
  #rapport .rq{break-inside:avoid;border-left:4px solid #FE5000;padding-left:8px;margin:0 0 8px}
  body.sans-impression:not(.export-pdf)>*{display:none!important}
  body.sans-impression:not(.export-pdf)::before{content:"Impression désactivée – © Mohamed BARR";display:block;font:700 20px Arial,sans-serif;padding:40px}
}
/* ---- Marquage (drapeau) ---- */
.btn.drapeau{padding:7px 14px;font-size:.88rem;border-width:1.5px}
.btn.drapeau.actif{background:var(--orange-pale);border-color:var(--orange);color:var(--orange-fonce)}
.btn.drapeau.actif:hover:not(:disabled){background:var(--orange);color:#fff}
.pastille{position:relative}
.pastille.marque::after{content:"";position:absolute;top:-1.5px;right:-1.5px;border:9px solid transparent;border-top-color:var(--orange);border-right-color:var(--orange);border-top-right-radius:10px}
.legende i.flag{background:var(--orange);border-color:var(--orange)}
/* ---- Mode examen ---- */
.panneau-examen{border:1.5px solid var(--trait);border-left:8px solid var(--orange);border-radius:10px;padding:16px 20px;margin:0 0 26px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panneau-examen strong{display:block;font-size:1.05rem}
.panneau-examen span{color:var(--gris);font-size:.92rem}
.regles{margin:0 0 24px;padding-left:20px;max-width:68ch}
.regles li{margin-bottom:8px}
.score-live.attention{background:#B26A00}
.score-live.urgence{background:var(--ko)}
.verdict{display:inline-block;padding:6px 20px;border-radius:99px;font-weight:800;color:#fff;margin-bottom:14px}
.verdict.ok{background:var(--ok)} .verdict.ko{background:var(--ko)}
.avis{background:var(--orange-pale);border-radius:8px;padding:10px 14px;margin:0 auto 16px;max-width:560px;font-weight:600}
@media (max-width:720px){
  .banniere-in{grid-template-columns:1fr;padding:22px 20px 26px}
  .banniere img{order:-1;max-width:420px;margin:0 auto}
}
@media (max-width:600px){
  .carte{padding:18px}
  .nav-q{flex-direction:column-reverse;align-items:stretch}
  .nav-centre{justify-content:space-between}
  .nav-centre .btn.primaire{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ============ Mode lecture : confort visuel (police légèrement réduite, interligne aéré, fond « papier », lignes courtes) ============ */
html{font-size:93.75%}                                   /* 15 px au lieu de 16 px */
html[data-taille=grand]{font-size:106.25%}
html[data-taille=petit]{font-size:87.5%}
:root{--bg:#F3F1EB;--carte:#FFFEFA;--encre:#33322E}
body{line-height:1.65;letter-spacing:.005em}
.enonce{font-size:1.12rem;line-height:1.6}
.texte-opt{line-height:1.55}
.option{padding:13px 16px}
.fb-corps p,.revue-item details p,.exhibit details p{line-height:1.7;max-width:66ch}
.fb-corps ul,.revue-item details ul,.apropos ul,.apropos ol{line-height:1.7;max-width:66ch}
.apropos ol{padding-left:1.5em}.apropos ol li{margin-bottom:8px}
.apropos p,.apropos li{line-height:1.7;max-width:66ch}
.revue-item h3{line-height:1.5}
.icone[id=btnTaille]{font-size:.8rem;font-weight:800}
/* ============ En-tête : accueil agrandi, bouton central, groupe d'icônes ============ */
.entete{justify-content:space-between}
.lien-accueil{font-size:1.4rem;gap:12px}
.lien-accueil img{width:42px;height:auto}
.cta-entete{display:none;padding:9px 22px;white-space:nowrap}
body.sur-apropos .cta-entete{display:inline-block}
.droite{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.droite .score-live{margin-left:0}
@media (max-width:720px){
  .cta-entete{order:5;flex:1 1 100%}
  .entete{padding:8px 14px;gap:8px 10px}
  .droite{gap:6px;margin-left:auto}
  .icone{width:32px;height:32px;font-size:.95rem}
  .droite .score-live{padding:5px 11px;font-size:.82rem}
  .lien-accueil .txt-accueil{display:none}      /* mobile : icône seule */
  .lien-accueil{padding:2px}
  .lien-accueil img{width:32px}
  .droite{flex-wrap:nowrap}                    /* tout reste sur une seule ligne */
  body.sur-apropos header{position:static}      /* page 1 : en-tête non collant sur mobile (gain de place) */
}
/* ============ Profil du candidat, félicitations ============ */
.champ{display:grid;gap:4px;margin:0 0 12px}
.champ span{font-size:.85rem;font-weight:700;color:var(--gris)}
.champ input{font:inherit;padding:10px 12px;border:1.5px solid var(--trait);border-radius:8px;background:var(--carte);color:var(--encre)}
.champ input:focus{border-color:var(--orange);outline:none}
.modale-corps h3{margin:0 0 6px}
.modale-corps p.note{font-weight:400;font-size:.88rem;color:var(--gris);margin-bottom:16px}
.profil-carte{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--hdr);border:0;border-left:4px solid var(--orange);border-radius:10px;padding:12px 16px;margin:16px 0 4px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.felic{font-weight:700;color:var(--ok);margin:0 0 14px}

/* Examen : navigation Précédent / Suivant, bouton « Revue » distinct */
.nav-exam{display:flex;gap:12px;margin-top:22px}
.nav-exam .btn{flex:1;min-height:48px}
.revue-sep{margin-top:18px;padding-top:18px;border-top:1px solid var(--trait)}
.btn-revue{width:100%;min-height:46px;background:var(--encre);color:var(--carte);border-color:var(--encre)}
.btn-revue:hover:not(:disabled){opacity:.88}
</style>
</head>
<body>

/* ============================================================

const QUESTIONS = [{"n": 1, "q": "What is the correct sequence to provision a new volume to a Linux host on a Pure Storage FlashArray?", "o": {"A": "Create volume, rescan SCSI bus, then connect to host", "B": "Connect host to array, create volume, rescan SCSI bus", "C": "Create volume, connect volume to host or host group, then rescan SCSI bus on host", "D": "Format the volume on the array, then attach"}, "a": "C", "e": [["p", "Le workflow standard de provisionnement d’un LUN hôte sur FlashArray est le suivant : (1) créer le volume sur la baie, (2) connecter le volume à l’objet hôte ou groupe d’hôtes, puis (3) déclencher un rescan du bus SCSI sur l’hôte afin qu’il découvre le nouveau périphérique. Les volumes doivent être associés à un objet hôte ou groupe d’hôtes avant que l’hôte puisse les voir, et un rescan côté hôte est nécessaire car la découverte des LUN est pilotée par l’initiateur sous Linux/Windows/ESXi."]], "t": "Administration au quotidien (Day-2)"}, {"n": 2, "q": "On a Pure FlashArray, what is the purpose of a host group?", "o": {"A": "To group volumes that share the same snapshot schedule", "B": "To represent a clustered set of hosts that all need access to the same volumes", "C": "To organize hosts by physical location only", "D": "To separate replication traffic from production"}, "a": "B", "e": [["p", "Un groupe d’hôtes représente un cluster d’hôtes (par exemple un cluster vSphere HA, un cluster Oracle RAC ou un cluster de basculement Microsoft) qui ont tous besoin d’un accès partagé au même ensemble de volumes. Connecter un volume au groupe d’hôtes l’attache de manière cohérente à chaque hôte membre, ce qui élimine le risque de LUN ID discordants qui casseraient les systèmes de fichiers en cluster."]], "t": "Administration au quotidien (Day-2)"}, {"n": 3, "q": "What is the primary use case for volume groups on Pure FlashArray?", "o": {"A": "To enforce hardware-level RAID at the LUN level", "B": "To create an application or VM consistency boundary so volumes can be snapshotted and managed together", "C": "To provide write cache acceleration", "D": "To replace host groups for clustered hosts"}, "a": "B", "e": [["p", "Les groupes de volumes définissent une limite d’application ou de charge de travail : tous les volumes appartenant à une même application (par exemple tous les LUN de données, de journaux et de tempdb d’une instance SQL Server) sont regroupés afin qu’une seule opération de snapshot capture une vue cohérente après crash de l’application entière. Les groupes de volumes simplifient également le suivi de l’espace et l’affectation des politiques de protection par application."]], "t": "Administration au quotidien (Day-2)"}, {"n": 4, "q": "Which Purity feature provides immutable snapshots that cannot be deleted by an administrator until a configured retention timer expires?", "o": {"A": "Standard local snapshots", "B": "SafeMode snapshots with a PIN-protected retention lock", "C": "CloudSnap", "D": "Replicated snapshots in ActiveDR"}, "a": "B", "e": [["p", "Les snapshots SafeMode sont protégées par un code PIN détenu uniquement par le support technique Everpure. Une fois un groupe de protection SafeMode configuré, les snapshots ne peuvent pas être éradiquées par l’administrateur local tant que la période de rétention configurée n’est pas écoulée, même si le compte administrateur de stockage est compromis. C’est le principal contrôle de protection contre la suppression de snapshots provoquée par un ransomware."]], "t": "Services de données & SafeMode"}, {"n": 5, "q": "What latency requirement must be met between two FlashArrays running ActiveCluster synchronous replication?", "o": {"A": "No more than 11 ms round-trip time (RTT) between sites", "B": "No more than 5 microseconds RTT", "C": "Latency is irrelevant for ActiveCluster", "D": "Less than 100 ms RTT is acceptable"}, "a": "A", "e": [["p", "ActiveCluster est une technologie de réplication synchrone bidirectionnelle qui exige un temps d’aller-retour (RTT) maximal de 11 ms entre les deux baies. Au-delà, la latence applicative se dégrade de façon inacceptable, car chaque écriture doit être acquittée par les deux baies avant de l’être auprès de l’hôte. ActiveDR (asynchrone) tolère une latence bien plus élevée."]], "t": "Réplication & reprise après sinistre"}, {"n": 6, "q": "Which component arbitrates which FlashArray remains online if the replication link in an ActiveCluster pair fails?", "o": {"A": "A SafeMode PIN held by Pure Support", "B": "The mediator (often called the witness), typically a small VM at a third site or Pure Cloud Mediator", "C": "Whichever array has more free capacity", "D": "The host MPIO driver"}, "a": "B", "e": [["p", "ActiveCluster utilise un médiateur (également appelé témoin ou witness) situé sur un troisième site indépendant pour arbitrer les scénarios de split-brain. Si le lien inter-sites tombe, les deux baies tentent d’acquérir le médiateur ; seule la baie gagnante continue de servir les E/S, tandis que l’autre suspend son pod synchrone, ce qui évite toute divergence des données. Le médiateur peut être hébergé sous forme de VM gérée par le client ou via le service Pure Cloud Mediator."]], "t": "Réplication & reprise après sinistre"}, {"n": 7, "q": "In ActiveDR, what is a 'pod'?", "o": {"A": "A physical drive group on the FlashArray", "B": "A logical container that holds volumes (and their snapshots) and is replicated as a unit", "C": "A host group used only for replication", "D": "A SafeMode policy template"}, "a": "B", "e": [["p", "Un pod est l’unité de réplication d’ActiveCluster (synchrone) comme d’ActiveDR (réplication continue asynchrone). Les volumes placés dans un pod sont répliqués ensemble comme un groupe de cohérence. Dans ActiveDR, le pod est à l’état promu (lecture-écriture) d’un côté et à l’état rétrogradé (lecture seule) de l’autre, et le basculement s’effectue en promouvant le pod précédemment rétrogradé."]], "t": "Réplication & reprise après sinistre"}, {"n": 8, "q": "To recover an application using ActiveDR after a primary site outage, what is the correct administrator action on the surviving array?", "o": {"A": "Eradicate the source pod", "B": "Promote the demoted pod on the secondary array so its volumes become read-write", "C": "Manually copy snapshots to a new volume", "D": "Reinstall Purity on the secondary array"}, "a": "B", "e": [["p", "Dans ActiveDR, le côté secondaire d’un pod répliqué est rétrogradé (lecture seule). Pour démarrer l’application sur le site de reprise, on promeut le pod rétrogradé, ce qui rend ses volumes accessibles en lecture-écriture afin que les hôtes du site de reprise puissent les monter. Lorsque le site principal est rétabli, le pod d’origine est rétrogradé et re-synchronisé (re-baseline) pour ramener les sites dans un état de réplication cohérent."]], "t": "Réplication & reprise après sinistre"}, {"n": 9, "q": "CloudSnap allows snapshots from a Pure FlashArray to be offloaded to which targets?", "o": {"A": "Only on-premises NFS shares", "B": "Only Pure Cloud Block Store", "C": "Amazon S3, Azure Blob, Google Cloud Storage, or NFS", "D": "Local SSD shelves only"}, "a": "C", "e": [["p", "CloudSnap déporte les données de snapshot vers un stockage objet économique, ce qui permet aux clients de conserver des sauvegardes à long terme en dehors de la baie. Les cibles prises en charge comprennent Amazon S3, Microsoft Azure Blob, Google Cloud Storage et des stockages objet sur site accessibles via NFS. Les données sont chiffrées en transit et au repos, et les snapshots peuvent être récupérées sur n’importe quelle FlashArray exécutant une version de Purity compatible."]], "t": "CloudSnap"}, {"n": 10, "q": "What is Cloud Block Store (CBS)?", "o": {"A": "A Pure FlashArray controller upgrade kit", "B": "Purity Operating Environment running as a software-defined array on AWS or Azure infrastructure", "C": "A backup software product", "D": "A new Pure flash module type"}, "a": "B", "e": [["p", "Cloud Block Store est le logiciel Purity//FA exécuté comme baie virtuelle sur AWS (avec des instances EC2 et EBS) ou sur Microsoft Azure. Il offre la même interface de gestion, les mêmes cibles de réplication et les mêmes services de données que les FlashArray sur site, ce qui permet la réplication du site vers le cloud et la migration à l’identique (lift-and-shift) des charges de travail bloc vers le cloud public sans réécrire les applications."]], "t": "Cloud Block Store"}, {"n": 11, "q": "Which Purity REST API client library is officially supported by Pure Storage for Python automation?", "o": {"A": "py-pure", "B": "pypureclient", "C": "pure-rest-py", "D": "cinder-pure"}, "a": "B", "e": [["p", "pypureclient est le SDK Python officiel d’Everpure, publié sur PyPI. Il prend en charge les API REST de FlashArray et de FlashBlade, y compris l’authentification par jetons d’API ou par nom d’utilisateur/mot de passe, et expose des objets Python pour les volumes, hôtes, snapshots, pods et groupes de protection. C’est la bibliothèque recommandée pour l’automatisation par scripts de Purity//FA."]], "t": "Automatisation"}, {"n": 12, "q": "Which Ansible collection should an administrator install to automate Pure FlashArray configuration tasks?", "o": {"A": "community.storage", "B": "purestorage.flasharray", "C": "ansible.builtin.pure", "D": "redhat.flasharray"}, "a": "B", "e": [["p", "La collection Ansible officielle est purestorage.flasharray, disponible sur Ansible Galaxy. Elle fournit des modules pour gérer les volumes, hôtes, groupes d’hôtes, groupes de protection, pods, snapshots, la réplication et la configuration de la baie. Une collection distincte, purestorage.flashblade, existe pour l’automatisation de FlashBlade."]], "t": "Automatisation"}, {"n": 13, "q": "What is the recommended ESXi advanced setting Disk.MaxIOSize value when using Pure FlashArray?", "o": {"A": "32 KB", "B": "128 KB", "C": "512 KB", "D": "4096 KB"}, "a": "C", "e": [["p", "Everpure recommande de définir le paramètre avancé ESXi Disk.MaxIOSize à 512 Ko (524288 octets) lors de la présentation d’un stockage FlashArray. La valeur par défaut de 32767 Ko peut entraîner un découpage défavorable des grosses opérations d’E/S ; 512 Ko correspond à la taille d’E/S préférée de Purity et évite la fragmentation, en particulier sur les charges de travail à gros I/O séquentiels comme les sauvegardes et Storage vMotion."]], "t": "VMware avancé"}, {"n": 14, "q": "What is the recommended MTU for an iSCSI network connecting hosts to Pure FlashArray when jumbo frames are supported end-to-end?", "o": {"A": "1500", "B": "4096", "C": "9000", "D": "16384"}, "a": "C", "e": [["p", "Everpure recommande de configurer les jumbo frames avec une MTU de 9000 sur les réseaux iSCSI lorsque chaque équipement du chemin (carte réseau de l’hôte, commutateurs et ports de la baie) les prend en charge. Les jumbo frames réduisent la surcharge TCP/IP par octet de données utiles et améliorent le débit pour les E/S en gros blocs. Tous les sauts doivent s’accorder sur la MTU, faute de quoi des échecs de découverte PMTU provoqueront des problèmes de connexion."]], "t": "Performance"}, {"n": 15, "q": "Which ESXi multipathing path selection policy does Pure Storage recommend for FlashArray volumes?", "o": {"A": "Most Recently Used (MRU)", "B": "Fixed", "C": "Round Robin (VMW_PSP_RR), typically with IOPS=1", "D": "Path Quiesce"}, "a": "C", "e": [["p", "Everpure recommande la politique de sélection de chemin Round Robin (VMW_PSP_RR) pour les volumes FlashArray, avec la limite d’IOPS abaissée à 1 afin qu’ESXi passe au chemin suivant après chaque E/S. Cela maximise l’utilisation des chemins sur tous les ports de contrôleur actifs, et ce réglage est appliqué automatiquement lorsque le plugin vSphere Everpure ou les règles de claim HCL sont appliqués."]], "t": "VMware avancé"}, {"n": 16, "q": "On a Linux host, what is the purpose of SCSI UNMAP (also called TRIM) when used with a Pure FlashArray volume?", "o": {"A": "To increase the SCSI queue depth", "B": "To inform the array which logical blocks are no longer in use so capacity can be reclaimed", "C": "To enable jumbo frames", "D": "To force a rescan of the SCSI bus"}, "a": "B", "e": [["p", "SCSI UNMAP (ou fstrim/discard sous Linux, TRIM dans l’usage général) indique à la baie que certains blocs logiques ne sont plus utilisés par le système de fichiers, ce qui permet à Purity de récupérer cet espace sur les volumes à provisionnement dynamique (thin provisioning). Sans UNMAP, les données supprimées du système de fichiers apparaissent toujours comme écrites pour la baie et ne sont pas libérées, ce qui gonfle l’utilisation rapportée."]], "t": "Performance"}, {"n": 17, "q": "Which Pure1 feature predicts when an array will run out of capacity based on observed growth trends?", "o": {"A": "Pure1 Workload Planner", "B": "Pure1 Capacity Planning", "C": "Pure1 SafeMode Manager", "D": "Pure1 ServiceNow Connector"}, "a": "B", "e": [["p", "Pure1 Capacity Planning analyse la télémétrie historique de consommation de capacité envoyée par chaque baie et projette une date d’échéance à laquelle chaque baie atteindra les seuils de remplissage configurés. Il modélise également l’impact de l’ajout de capacity packs ou de nouvelles baies afin que les administrateurs puissent dimensionner correctement leurs achats. Workload Planner est une fonction distincte, destinée à modéliser le placement de nouvelles charges de travail."]], "t": "Supervision & Pure1"}, {"n": 18, "q": "During a Purity Non-Disruptive Upgrade (NDU), what happens to host I/O?", "o": {"A": "All host I/O is paused for several minutes", "B": "One controller is upgraded at a time and host I/O continues over the surviving controller via MPIO", "C": "Hosts must be rebooted before the upgrade", "D": "I/O continues but at half speed permanently"}, "a": "B", "e": [["p", "La NDU de Purity met à niveau un contrôleur à la fois. Pendant que le contrôleur en cours de mise à niveau est hors ligne, les E/S de l’hôte continuent sur l’autre contrôleur grâce au multipathing actif/actif côté hôte. Une fois le premier contrôleur revenu en ligne, le second est mis à niveau de la même façon. Il n’y a aucune interruption côté hôte, mais un MPIO correctement configuré est indispensable pour que la NDU soit réellement non disruptive."]], "t": "Mises à niveau & NDU"}, {"n": 19, "q": "What command is used on a FlashArray to run hardware diagnostics from the array CLI?", "o": {"A": "purearray test", "B": "purehealth scan", "C": "purediag run", "D": "puremaint check"}, "a": "A", "e": [["p", "La famille de commandes purearray test (par exemple purearray test ntp, purearray test alert, purearray test dns) exécute des diagnostics ciblés depuis la CLI de la FlashArray afin de valider la connectivité, les services et le matériel. Pour des données de diagnostic plus approfondies, purelog regroupe les journaux de support qui peuvent être transmis au support technique Everpure."]], "t": "Dépannage"}, {"n": 20, "q": "What is the primary advantage of vVols (vSphere Virtual Volumes) on FlashArray compared with traditional VMFS datastores?", "o": {"A": "vVols use a different RAID level for better performance", "B": "Each VMDK becomes a first-class array object, so snapshot, replication, and QoS policies can be applied per VMDK", "C": "vVols eliminate the need for ESXi multipathing", "D": "vVols compress data better than VMFS"}, "a": "B", "e": [["p", "Avec vVols, la baie expose chaque VMDK comme un objet distinct au lieu de sous-fichiers au sein d’un datastore VMFS. Cela signifie que les snapshots, la réplication, le chiffrement et la QoS de la baie peuvent être définis par VMDK à l’aide de la gestion basée sur les politiques de stockage de vSphere (SPBM), ce qui offre des services de données à la granularité de la VM sans action à l’échelle du VMFS ni compromis par datastore."]], "t": "VMware avancé"}, {"n": 21, "q": "Which Purity component must be reachable for vSphere to use vVols on a FlashArray?", "o": {"A": "The Pure1 cloud service only", "B": "The VASA Provider built into Purity", "C": "A separate Linux VM", "D": "The Pure FlashRecover appliance"}, "a": "B", "e": [["p", "vVols nécessite un fournisseur VASA (vSphere APIs for Storage Awareness) que vCenter enregistre et interroge pour connaître les capacités de stockage. Purity//FA inclut un fournisseur VASA intégré, aucune appliance externe n’est donc requise. vCenter doit pouvoir joindre l’adresse IP de gestion de la baie pour le point de terminaison VASA et pour le fonctionnement du protocole SPBM."]], "t": "VMware avancé"}, {"n": 22, "q": "In a Microsoft Hyper-V Failover Cluster on FlashArray, which volume type is recommended for shared VM storage?", "o": {"A": "A volume formatted as NTFS attached to a single host", "B": "A Cluster Shared Volume (CSV) attached to all cluster nodes via a host group", "C": "An iSCSI volume mounted in the guest only", "D": "A pass-through SCSI device per VM"}, "a": "B", "e": [["p", "Les Cluster Shared Volumes (CSV) sont le stockage bloc partagé recommandé pour les clusters de basculement Hyper-V, car ils permettent un accès concurrent à un unique volume NTFS/ReFS depuis tous les nœuds du cluster. Le volume est connecté à un groupe d’hôtes FlashArray contenant tous les nœuds du cluster, afin que les LUN ID soient cohérents et que les tests de validation du cluster réussissent."]], "t": "Intégration Microsoft"}, {"n": 23, "q": "What is ODX in the context of Microsoft and Pure FlashArray?", "o": {"A": "A Microsoft offload data transfer feature where the array performs the copy without sending bytes to the host", "B": "An Oracle dialect of SQL", "C": "A licensing model for ODBC drivers", "D": "A type of NFS share"}, "a": "A", "e": [["p", "Offloaded Data Transfer (ODX) est une fonctionnalité de Windows par laquelle les opérations de copie sont déléguées à la baie de stockage. La baie effectue la copie en interne entre les LUN source et destination sans que les données ne transitent par l’hôte. FlashArray prend en charge ODX : les copies de fichiers et les déploiements de modèles de VM Hyper-V à l’intérieur de Windows s’achèvent donc bien plus rapidement qu’avec des copies côté hôte."]], "t": "Intégration Microsoft"}, {"n": 24, "q": "Which Linux configuration file should be modified to ensure correct multipathing parameters for FlashArray volumes?", "o": {"A": "/etc/fstab", "B": "/etc/multipath.conf", "C": "/etc/iscsi/iscsid.conf", "D": "/etc/lvm/lvm.conf"}, "a": "B", "e": [["p", "/etc/multipath.conf régit la pile multipath device-mapper sous Linux. Everpure publie des entrées de périphérique recommandées (pour le vendor PURE / le produit FlashArray), notamment path_grouping_policy, path_selector (round-robin ou service-time), no_path_retry et les valeurs rr_min_io_rq. Après modification du fichier, multipath -r le recharge sans interruption."]], "t": "Intégration Linux"}, {"n": 25, "q": "FlashArray//File supports which file sharing protocols natively?", "o": {"A": "SMB only", "B": "NFS only", "C": "Both SMB and NFS", "D": "HTTP and FTP"}, "a": "C", "e": [["p", "FlashArray//File fournit des services de fichiers sur le même matériel FlashArray que le bloc, en prenant en charge à la fois SMB (pour les clients Windows) et NFS (pour Linux/Unix et ESXi) sur les mêmes systèmes de fichiers gérés. Elle prend en charge l’intégration Active Directory pour SMB, Kerberos pour NFS et la multi-location via des systèmes de fichiers virtuels."]], "t": "Services de fichiers"}, {"n": 26, "q": "How many sites are involved in a complete ActiveCluster deployment with mediator?", "o": {"A": "1 site", "B": "2 sites", "C": "3 sites (two arrays plus a mediator location)", "D": "4 sites"}, "a": "C", "e": [["p", "Un déploiement ActiveCluster standard implique trois domaines de défaillance indépendants : le site A et le site B hébergeant chacun une FlashArray, plus un troisième emplacement hébergeant le médiateur. Ce troisième site peut être un petit datacenter, une région de cloud public (Pure Cloud Mediator) ou une agence distante, mais il doit être indépendant des modes de défaillance qui affectent les sites A et B."]], "t": "Réplication & reprise après sinistre"}, {"n": 27, "q": "In Purity, what is the difference between deleting and eradicating a snapshot?", "o": {"A": "There is no difference; both terms mean the same thing", "B": "Delete moves the snapshot to a destroyed state with a 24-hour recovery window; eradicate purges it permanently", "C": "Delete only removes the metadata; eradicate runs garbage collection", "D": "Eradicate creates a backup copy before removal"}, "a": "B", "e": [["p", "Supprimer (delete) une snapshot, un volume ou un pod le place à l’état détruit, où il reste récupérable pendant la durée du timer d’éradication (24 heures par défaut, extensible). Éradiquer (eradicate) purge immédiatement et définitivement l’objet. SafeMode protège contre les opérations d’éradication non autorisées en exigeant le PIN du support Everpure pour raccourcir le timer ou éradiquer avant son terme."]], "t": "Services de données & SafeMode"}, {"n": 28, "q": "Which Pure1 capability identifies workloads that show abnormal IOPS, latency, or capacity behavior?", "o": {"A": "Workload Planner", "B": "AIOps anomaly detection", "C": "SafeMode PIN", "D": "CloudSnap retrieval"}, "a": "B", "e": [["p", "Pure1 Meta utilise le machine learning pour comparer la télémétrie d’une baie à celle de l’ensemble de la flotte Everpure, en identifiant les anomalies d’IOPS, de latence, de profondeur de file, de croissance de capacité ou de capteurs environnementaux qui s’écartent de la référence prévue. Les anomalies sont présentées sous forme d’analyses exploitables, afin que les administrateurs puissent enquêter avant qu’elles ne provoquent des incidents."]], "t": "Supervision & Pure1"}, {"n": 29, "q": "What is the recommended approach to schedule local snapshots and remote replication on FlashArray?", "o": {"A": "Manually create snapshots on a cron job", "B": "Use a protection group with a snapshot schedule and a replication schedule", "C": "Use SafeMode only", "D": "Use CloudSnap exclusively"}, "a": "B", "e": [["p", "Les groupes de protection (pgroups) sont la construction native de Purity pour la planification. Un pgroup contient des volumes, des hôtes ou des groupes d’hôtes, et expose un planning de snapshots (fréquence et rétention locale) ainsi qu’un planning de réplication optionnel (fréquence, cible et rétention distante). Cela fournit une politique cohérente et adaptée à l’application, sans scripts externes."]], "t": "Services de données & SafeMode"}, {"n": 30, "q": "Which on-host action is needed after a volume is resized larger on the array, for a Linux ext4 filesystem to use the new space?", "o": {"A": "No action; the filesystem grows automatically", "B": "Rescan the device, then run resize2fs against the device", "C": "Reboot the host", "D": "Detach and reattach the volume to a different host"}, "a": "B", "e": [["p", "Après avoir augmenté la taille d’un volume sur la FlashArray, l’hôte doit refaire un scan du périphérique SCSI (echo 1 > /sys/block/<dev>/device/rescan ou multipathd reload) pour que le noyau voie la nouvelle taille, puis le système de fichiers doit être agrandi. Pour ext4, resize2fs agrandit le système de fichiers à chaud ; pour XFS, on utilise xfs_growfs. La baie elle-même n’agrandit jamais le système de fichiers de l’hôte."]], "t": "Intégration Linux"}, {"n": 31, "q": "How does Pure Storage recommend connecting an Oracle RAC cluster to FlashArray volumes?", "o": {"A": "Connect each host individually with separate volumes", "B": "Place all RAC nodes in a single host group, then connect shared volumes to the host group", "C": "Use NFS only", "D": "Use one volume per database file"}, "a": "B", "e": [["p", "Pour Oracle RAC, chaque nœud du cluster a besoin d’un accès identique (mêmes LUN ID) aux disques ASM partagés. Le schéma recommandé consiste à créer un groupe d’hôtes contenant tous les nœuds RAC, puis à connecter chaque volume de disque ASM au groupe d’hôtes, afin que les LUN ID soient garantis cohérents entre les nœuds, condition nécessaire au bon fonctionnement d’ASM et de Clusterware."]], "t": "Administration au quotidien (Day-2)"}, {"n": 32, "q": "What is the function of the Pure Storage vSphere Plugin?", "o": {"A": "It replaces vCenter", "B": "It integrates FlashArray management into the vSphere Client so VI admins can create datastores, snapshots, and protection from inside vCenter", "C": "It runs ESXi upgrades", "D": "It manages backups to tape"}, "a": "B", "e": [["p", "Le plugin vSphere Everpure (HTML5) s’intègre au vSphere Client et permet aux administrateurs VMware de provisionner des datastores, de gérer les snapshots, de configurer des groupes de protection et d’appliquer les paramètres hôtes recommandés (profondeur de file, Disk.MaxIOSize, Round Robin) sans quitter vCenter. Il peut être installé via l’interface de la baie, le Plugin Manager du vCenter Client ou Pure1."]], "t": "VMware avancé"}, {"n": 33, "q": "What is the recommended ESXi HBA queue depth (qdepth) for FlashArray volumes?", "o": {"A": "8", "B": "32", "C": "64", "D": "256"}, "a": "C", "e": [["p", "Everpure recommande une profondeur de file de 64 par périphérique pour les hôtes ESXi connectés à une FlashArray. Associée à la sélection de chemin Round Robin et à IOPS=1, elle offre une concurrence d’E/S en attente suffisante pour atteindre un nombre élevé d’IOPS sans saturer un chemin donné. Le plugin vSphere Everpure peut appliquer ce réglage automatiquement."]], "t": "VMware avancé"}, {"n": 34, "q": "Which technology in FlashArray supports NVMe over Fabrics (NVMe-oF) connectivity to hosts?", "o": {"A": "NVMe is not supported on FlashArray", "B": "NVMe/FC and NVMe/RoCE on supported FlashArray//X and //XL controllers", "C": "Only iSCSI", "D": "Only FCoE"}, "a": "B", "e": [["p", "FlashArray prend en charge NVMe over Fabrics pour la connectivité des hôtes, notamment NVMe/FC sur Fibre Channel et NVMe/RoCE sur Ethernet RDMA, sur les contrôleurs FlashArray//X et //XL pris en charge. NVMe-oF réduit la surcharge du protocole par rapport au SCSI/FC traditionnel et prend en charge des files bien plus profondes, ce qui améliore la latence et le débit pour les charges de travail modernes."]], "t": "Performance"}, {"n": 35, "q": "What is a baseline copy in ActiveDR?", "o": {"A": "The first full replication of a pod's volumes from source to target before incremental replication begins", "B": "A SafeMode snapshot taken at activation", "C": "A protection group snapshot", "D": "A nightly backup"}, "a": "A", "e": [["p", "Lorsque la réplication ActiveDR est activée pour la première fois sur un pod, la baie source envoie à la baie cible une copie de référence (baseline) contenant toutes les données actuelles des volumes du pod. Une fois la baseline terminée, seules les modifications (delta) sont répliquées en continu. La baseline peut être réamorcée si la cible est reconstruite ou si l’état du pod diverge."]], "t": "Réplication & reprise après sinistre"}, {"n": 36, "q": "What is the purpose of a vVols replication group?", "o": {"A": "A group of vVols that are not replicated", "B": "A group of vVols whose replication is coordinated as a consistent unit by SPBM and the VASA provider", "C": "A network port group", "D": "A datastore cluster"}, "a": "B", "e": [["p", "Un groupe de réplication vVols regroupe des vVols afin qu’ils soient répliqués et restaurés comme une seule unité de cohérence. SPBM associe les groupes de réplication à une politique de stockage et le fournisseur VASA coordonne la réplication côté baie. Cela garantit qu’une application multi-VMDK, comme une base de données, reste cohérente lors d’un basculement."]], "t": "VMware avancé"}, {"n": 37, "q": "In a CloudSnap retrieval, where does data go?", "o": {"A": "Directly back into the original volume", "B": "Into a destroyed snapshot that can be recovered as a new volume on a target FlashArray", "C": "To Pure1 only", "D": "To a SafeMode vault"}, "a": "B", "e": [["p", "Lorsqu’une CloudSnap est récupérée, la baie extrait les données de snapshot du stockage objet configuré (S3, Azure Blob, GCS ou NFS) et les crée sous forme de snapshot sur la FlashArray cible. L’administrateur peut ensuite copier la snapshot vers un nouveau volume ou écraser un volume existant, ce qui reproduit le workflow de restauration d’une snapshot locale classique."]], "t": "CloudSnap"}, {"n": 38, "q": "Which two Purity replication technologies can be combined for both zero-RPO local resilience and remote DR?", "o": {"A": "ActiveCluster (sync) plus ActiveDR (async) on the same pod", "B": "Two ActiveCluster pairs", "C": "Two ActiveDR pairs only", "D": "CloudSnap plus ActiveCluster only"}, "a": "A", "e": [["p", "Un pod peut être protégé par ActiveCluster entre deux baies metro pour une résilience synchrone à RPO nul, et le même pod peut en plus utiliser ActiveDR vers une troisième baie sur un site de reprise distant pour une protection asynchrone. Cette topologie « synchrone plus asynchrone » est une architecture de référence courante en entreprise, à la fois pour la haute disponibilité metro et pour la reprise après sinistre hors région."]], "t": "Réplication & reprise après sinistre"}, {"n": 39, "q": "How does FlashArray handle thin provisioning by default?", "o": {"A": "All volumes must be thick-provisioned", "B": "Every volume is thin-provisioned and only consumes space for unique, post-reduction data", "C": "Thin provisioning requires a special license", "D": "Thin provisioning is per-host"}, "a": "B", "e": [["p", "Les volumes FlashArray sont toujours en provisionnement dynamique (thin provisioning). Les tailles de volume rapportées sont logiques, et seuls les octets uniques après déduplication et compression consomment de la capacité physique. C’est le fondement des ratios de réduction de données élevés de FlashArray ; cela signifie aussi que le surprovisionnement est courant et attendu, la capacité étant gérée au niveau de la baie et non du volume."]], "t": "Services de données & SafeMode"}, {"n": 40, "q": "What action should you take if a host shows lost paths to FlashArray after a controller failover?", "o": {"A": "Reboot the array", "B": "Verify host MPIO configuration, port zoning, and run multipath -ll or esxcli storage core path list to confirm path state", "C": "Recreate all volumes", "D": "Eradicate the host object"}, "a": "B", "e": [["p", "Les symptômes de perte de chemins après un événement sur un contrôleur indiquent presque toujours un problème de configuration côté hôte (réglages MPIO incorrects, zoning manquant vers le contrôleur survivant ou rescans manquants) plutôt qu’un problème de baie. L’ordre de diagnostic est le suivant : confirmer que les deux contrôleurs sont sains dans Purity, valider le zoning du fabric vers les quatre ports frontaux, puis inspecter l’état des chemins de l’hôte avec multipath -ll sous Linux ou esxcli storage core path list sous ESXi."]], "t": "Dépannage"}, {"n": 41, "q": "Which Purity feature enables encryption of data at rest on FlashArray?", "o": {"A": "It is an optional paid add-on", "B": "Always-on AES-256 encryption with FIPS 140-2 validated self-encrypting drives", "C": "Customer must use host-side encryption", "D": "Only for replicated data"}, "a": "B", "e": [["p", "FlashArray inclut un chiffrement des données au repos permanent utilisant AES-256 sur des modules flash auto-chiffrants validés FIPS 140-2. Le chiffrement est activé d’office, sans pénalité de performance, et constitue la base du déclassement rapide d’une baie par effacement cryptographique (la destruction de la clé rend instantanément toutes les données illisibles)."]], "t": "Services de données & SafeMode"}, {"n": 42, "q": "In the Pure Storage Ansible collection, which module manages a FlashArray volume?", "o": {"A": "purefa_volume", "B": "pure_volume", "C": "fa_volume", "D": "pure_storage_volume"}, "a": "A", "e": [["p", "Dans la collection purestorage.flasharray, les modules spécifiques à FlashArray sont préfixés par purefa_ ; le module de gestion des volumes est donc purefa_volume. Parmi les autres exemples : purefa_host, purefa_hg (groupe d’hôtes), purefa_pg (groupe de protection), purefa_pod et purefa_snap. Cette nomenclature distingue les modules FlashArray de la collection FlashBlade, qui utilise les préfixes purefb_."]], "t": "Automatisation"}, {"n": 43, "q": "Which of the following is required to pull a SafeMode snapshot back into an active volume after a ransomware event?", "o": {"A": "The local administrator can do it without any third party", "B": "Coordination with Pure Technical Support to provide the SafeMode PIN if eradication or shortening of the retention timer is needed", "C": "An offline rebuild of the array", "D": "Restoring from CloudSnap only"}, "a": "B", "e": [["p", "La restauration de données à partir d’une snapshot SafeMode existante (copie de la snapshot vers un volume nouveau ou existant) ne nécessite pas le support Everpure ; l’administrateur peut la réaliser lui-même. En revanche, modifier la protection SafeMode (raccourcir le timer de rétention ou éradiquer avant son échéance) exige le PIN du support Everpure. C’est ce contrôle qui rend SafeMode résistant à des identifiants d’administrateur compromis lors d’un événement de ransomware."]], "t": "Services de données & SafeMode"}, {"n": 44, "q": "For a Windows host attached via Fibre Channel to FlashArray, which Microsoft MPIO DSM is used?", "o": {"A": "A Pure-supplied DSM", "B": "The built-in Microsoft MPIO DSM, configured to claim PURE FlashArray devices", "C": "The vendor DSM is mandatory", "D": "No DSM is needed"}, "a": "B", "e": [["p", "FlashArray prend en charge le DSM MPIO Microsoft intégré (msdsm). Les administrateurs installent la fonctionnalité MPIO sur Windows Server, puis la configurent pour réclamer (claim) les périphériques ayant l’ID matériel PURE FlashArray. Une fois réclamés, un équilibrage de charge Round Robin with Subset (ou Least Queue Depth) est utilisé. Everpure ne fournit pas de DSM personnalisé."]], "t": "Intégration Microsoft"}, {"n": 45, "q": "What is the purpose of replication bandwidth throttling in ActiveDR?", "o": {"A": "To slow down host I/O", "B": "To cap the network bandwidth used for replication so it does not impact other applications on shared links", "C": "To enable jumbo frames", "D": "To compress snapshots"}, "a": "B", "e": [["p", "La limitation de bande passante de réplication permet aux administrateurs de plafonner la bande passante WAN consommée par ActiveDR, éventuellement selon une plage horaire. C’est essentiel lorsque le lien de réplication est partagé avec d’autres flux de production, afin que les sauvegardes ou la réplication de reprise ne privent pas les applications utilisateurs de ressources pendant les heures de pointe."]], "t": "Réplication & reprise après sinistre"}, {"n": 46, "q": "On FlashArray//File, what is required for SMB clients to authenticate using domain accounts?", "o": {"A": "A local user database only", "B": "Active Directory integration via the array joining the AD domain", "C": "A Kerberos KDC only", "D": "Anonymous access"}, "a": "B", "e": [["p", "Pour l’authentification SMB basée sur le domaine, FlashArray//File doit être jointe à Active Directory. Une fois jointe, les utilisateurs et groupes AD peuvent se voir accorder l’accès aux partages SMB au moyen d’ACL de type NTFS. Les exports NFS peuvent en outre utiliser Kerberos (krb5/krb5i/krb5p) pour un accès aux fichiers authentifié et, en option, chiffré."]], "t": "Services de fichiers"}, {"n": 47, "q": "What is the typical use of Pure1 Workload Planner?", "o": {"A": "To plan firmware upgrades", "B": "To model how a new workload would fit on existing arrays based on its IOPS, latency, and capacity profile", "C": "To tune ESXi host settings", "D": "To provision SafeMode"}, "a": "B", "e": [["p", "Pure1 Workload Planner prend en entrée les besoins attendus d’une charge de travail en IOPS, latence et capacité, puis simule son placement sur les baies existantes de la flotte du client. Il identifie les baies disposant de la marge nécessaire pour absorber la charge en toute sécurité, et peut aussi modéliser l’impact d’une consolidation, d’un déplacement ou d’un retrait de charges de travail. C’est un outil d’aide à la décision pour la planification de capacité."]], "t": "Supervision & Pure1"}, {"n": 48, "q": "Why might an administrator place a witness or mediator VM on a separate ESXi cluster, in a different failure domain, from both ActiveCluster arrays?", "o": {"A": "To reduce CPU usage", "B": "So that a failure that takes down one of the arrays cannot also take down the mediator, which would otherwise prevent automatic failover", "C": "To improve replication throughput", "D": "To share storage between sites"}, "a": "B", "e": [["p", "Le médiateur doit se trouver dans un domaine de défaillance distinct de celui des deux baies ActiveCluster. Si le médiateur partage l’alimentation, le réseau ou l’infrastructure d’hébergement avec l’une des baies et que ce domaine tombe, la baie survivante perdrait simultanément son homologue et le médiateur, ce qui suspendrait les E/S. Un troisième site réellement indépendant (ou Pure Cloud Mediator) évite ce scénario."]], "t": "Réplication & reprise après sinistre"}, {"n": 49, "q": "Which file system is recommended on Linux for FlashArray volumes hosting databases like Oracle or PostgreSQL?", "o": {"A": "FAT32", "B": "ext2", "C": "XFS or ext4 with proper alignment and discard mount option", "D": "NTFS"}, "a": "C", "e": [["p", "Sous Linux, XFS (préféré pour les très grands systèmes de fichiers et le fort parallélisme) ou ext4 sont les choix standard pour les volumes de bases de données sur FlashArray. Les deux doivent être créés avec l’alignement de blocs par défaut de 4 Kio et montés avec l’option discard (ou un fstrim planifié) afin que les blocs de base de données supprimés soient récupérés par la baie. FAT32 et ext2 ne disposent pas de la journalisation ni des fonctionnalités modernes requises."]], "t": "Intégration Linux"}, {"n": 50, "q": "Which Purity API version does pypureclient typically negotiate when connecting to a modern FlashArray?", "o": {"A": "Only API 1.x", "B": "REST 2.x for newer features (pods, ActiveDR, vVols), with REST 1.x available for legacy operations", "C": "SOAP only", "D": "gRPC only"}, "a": "B", "e": [["p", "Les FlashArray modernes exposent à la fois l’API REST 1.x (héritée) et l’API REST 2.x (actuelle). pypureclient prend en charge les deux : la plupart des nouvelles fonctionnalités (pods, ActiveCluster, ActiveDR, vVols, NVMe-oF) sont exposées via REST 2.x, tandis que certaines opérations héritées restent sur REST 1.x. La bibliothèque négocie automatiquement la version lors de la construction d’un client de baie."]], "t": "Automatisation"}, {"n": 51, "q": "What does LCM-style 'Evergreen Forever' provide for FlashArray customers?", "o": {"A": "Free hardware refreshes via a controller upgrade program included with active subscriptions", "B": "Unlimited cloud storage", "C": "Pure-managed off-site backups", "D": "Free Pure Storage training"}, "a": "A", "e": [["p", "Evergreen Forever (et les niveaux d’abonnement Evergreen associés) fournit des mises à niveau non disruptives des contrôleurs à une cadence définie, dans le cadre d’un abonnement actif, afin que les clients restent sur du matériel à jour sans migrations disruptives de type forklift. Associé à la NDU pour le logiciel, c’est l’engagement d’Everpure de supprimer les cycles de renouvellement du stockage."]], "t": "Mises à niveau & NDU"}, {"n": 52, "q": "During a controller swap (chassis upgrade) on FlashArray, what is the sequence?", "o": {"A": "Power down both controllers, replace, power up", "B": "Replace one controller at a time, allowing host I/O to continue on the surviving controller via MPIO", "C": "Replace the chassis entirely in a single operation", "D": "Reinstall Purity from scratch"}, "a": "B", "e": [["p", "Un remplacement de contrôleur (mise à niveau du châssis) s’effectue un contrôleur à la fois, exactement comme une NDU. Le premier contrôleur est mis hors ligne, remplacé, remis en ligne, puis le cluster vérifie son état de santé avant que le second contrôleur ne soit remplacé. Pendant tout ce processus, les E/S de l’hôte continuent sur le contrôleur survivant grâce au multipathing actif/actif, de sorte que les utilisateurs ne constatent aucune interruption."]], "t": "Mises à niveau & NDU"}, {"n": 53, "q": "What CLI command lists the snapshots associated with a volume on FlashArray?", "o": {"A": "purevol list --snap <volume>", "B": "purevol snap list <volume>", "C": "purevolume snapshot list", "D": "puresnap volume <volume> --snap"}, "a": "A", "e": [["p", "Depuis la CLI de la FlashArray, purevol list --snap <volume> affiche les snapshots associées au volume spécifié, avec leur date de création, leur taille et leur source. La CLI reflète les objets de l’API REST : purevol pour les volumes, purepgroup pour les groupes de protection, purepod pour les pods et pureport pour les ports frontaux."]], "t": "Administration au quotidien (Day-2)"}, {"n": 54, "q": "What is the purpose of a Pure FlashArray protection policy in Pure Fusion?", "o": {"A": "A Pure Fusion feature that defines snapshot and replication intent at the fleet level rather than per array", "B": "A type of host group", "C": "A SafeMode license", "D": "A capacity tier"}, "a": "A", "e": [["p", "Everpure Fusion abstrait les services de données sur plusieurs FlashArray : les administrateurs définissent une fois l’intention (par exemple une politique de protection Gold : snapshots toutes les heures, répliquées vers deux cibles, conservées 30 jours), puis Fusion la place et l’applique sur les bonnes baies. Cela dissocie la politique de la baie physique spécifique sur laquelle une charge de travail se trouve."]], "t": "Automatisation"}, {"n": 55, "q": "What is the recommended FC zoning model for a host attached to FlashArray?", "o": {"A": "A single zone with all initiators and all targets", "B": "Single-initiator, multi-target zoning (one host HBA WWPN per zone with all relevant array WWPNs)", "C": "Single-target, multi-initiator", "D": "No zoning required"}, "a": "B", "e": [["p", "La bonne pratique Everpure pour le zoning FC est le zoning à initiateur unique et cibles multiples : chaque zone contient exactement un WWPN de HBA hôte et les WWPN des ports frontaux concernés de la FlashArray (généralement les quatre, pour assurer la redondance entre les deux contrôleurs et les deux fabrics). Cela isole les initiateurs les uns des autres afin de limiter le bruit sur le fabric et les découvertes inattendues."]], "t": "Administration au quotidien (Day-2)"}, {"n": 56, "q": "Which Purity feature replaces volumes from a snapshot without losing the existing volume name and host connections?", "o": {"A": "Eradicate the volume and recreate it from a clone", "B": "Volume copy with overwrite from snapshot (purevol copy --overwrite)", "C": "Detach the volume and recreate", "D": "Reboot the array"}, "a": "B", "e": [["p", "Pour ramener un volume à une snapshot antérieure, on copie la snapshot dans le volume avec l’option d’écrasement (purevol copy <snap> <vol> --overwrite ou l’action équivalente REST/UI). Le volume conserve son nom, son numéro de série et ses connexions d’hôtes ; les hôtes voient donc simplement les données précédentes après un rescan ou un remontage. Il n’est pas nécessaire de supprimer puis de recréer le volume."]], "t": "Services de données & SafeMode"}, {"n": 57, "q": "What information is most important to gather when opening a Pure Technical Support case for a performance issue?", "o": {"A": "The administrator password", "B": "The exact symptoms, time window, affected hosts and volumes, and an array support log bundle (auto-uploaded via Pure1 phone-home)", "C": "Photos of the rack", "D": "The CFO's name"}, "a": "B", "e": [["p", "Pour un cas de support relatif à la performance, l’ingénieur support a besoin de la description des symptômes, de la fenêtre de temps précise, des hôtes/volumes/protocoles concernés et du lot de journaux de diagnostic. Les journaux sont normalement déjà disponibles car le phone-home de Pure1 envoie en continu de la télémétrie, mais la baie peut aussi générer manuellement un lot de support si nécessaire. Un cadrage détaillé accélère l’analyse de la cause racine."]], "t": "Dépannage"}, {"n": 58, "q": "What is the function of a snapshot suffix in Purity?", "o": {"A": "A required encryption key", "B": "An administrator-assigned name appended to snapshot names so they can be identified", "C": "A SafeMode PIN", "D": "A volume size multiplier"}, "a": "B", "e": [["p", "Lorsqu’une snapshot est créée (manuellement ou par un groupe de protection), Purity ajoute un suffixe qui l’identifie. Pour les snapshots de pgroup, le suffixe correspond au planning et à l’heure. Pour les snapshots manuelles, l’administrateur fournit un suffixe significatif (par exemple pre-upgrade) afin que la snapshot puisse être retrouvée et gérée facilement par la suite."]], "t": "Services de données & SafeMode"}, {"n": 59, "q": "Which approach is recommended for backing up SQL Server databases hosted on FlashArray volumes?", "o": {"A": "Manually copy MDF files at midnight", "B": "Use SQL Server VSS-aware backup tools (or Pure-aware integrations) that quiesce SQL Server then trigger a Purity snapshot", "C": "Take an array snapshot during peak load without coordinating with SQL Server", "D": "Use a screen-recording tool"}, "a": "B", "e": [["p", "Les sauvegardes cohérentes au niveau applicatif pour SQL Server combinent VSS, qui met la base en quiescence (vidage des tampons, gel bref des E/S), et une snapshot de la baie des volumes hébergeant les fichiers de données, de journaux et de tempdb. Everpure publie des scripts d’intégration et des outils partenaires (par exemple avec Veeam, Commvault et Microsoft VSS) pour orchestrer ce processus. Les snapshots cohérentes après crash restent utiles, mais la cohérence applicative est préférable pour les bases de données de production."]], "t": "Intégration Microsoft"}, {"n": 60, "q": "What does the Purity feature 'eradication timer' control?", "o": {"A": "When a snapshot is automatically created", "B": "How long a destroyed object (volume, snapshot, pod) remains recoverable before it is permanently purged", "C": "How often controllers swap roles", "D": "When SafeMode releases its PIN"}, "a": "B", "e": [["p", "Le timer d’éradication (24 heures par défaut, configurable jusqu’à 30 jours) définit la durée pendant laquelle un objet détruit reste à l’état récupérable. Pendant cette fenêtre, un administrateur peut récupérer l’objet sans l’intervention du support Everpure. Une fois le timer expiré, la baie purge définitivement l’objet. SafeMode protège le timer lui-même contre toute réduction par un attaquant."]], "t": "Services de données & SafeMode"}, {"n": 61, "q": "Which monitoring integration sends FlashArray alerts and incident data into ServiceNow?", "o": {"A": "The Pure1 ServiceNow Connector", "B": "Cisco UCS Manager", "C": "Microsoft SCOM", "D": "Nagios"}, "a": "A", "e": [["p", "Pure1 fournit un connecteur ServiceNow qui diffuse les alertes et les événements opérationnels de la flotte de baies du client directement dans ServiceNow, en ouvrant, mettant à jour et fermant automatiquement les incidents. Cela intègre Everpure aux workflows ITSM existants du client, sans nécessiter de scripts personnalisés sur l’API REST."]], "t": "Supervision & Pure1"}, {"n": 62, "q": "What is the FlashArray recommendation for dedicated replication ports versus front-end ports?", "o": {"A": "Replication and host traffic must always share the same physical ports", "B": "Use dedicated replication interfaces where possible (separate Ethernet ports configured as replbond) to isolate replication traffic from host I/O", "C": "Replication is only over Fibre Channel", "D": "Replication uses USB"}, "a": "B", "e": [["p", "Everpure recommande de configurer des interfaces de réplication dédiées (replbond) sur les deux baies afin que le trafic de réplication asynchrone et synchrone n’entre pas en concurrence avec les E/S des hôtes sur les ports frontaux. Cela permet aussi aux administrateurs d’appliquer des politiques de VLAN, de MTU et de routage distinctes au réseau de réplication, et simplifie le dépannage des liens de réplication sensibles à la latence."]], "t": "Réplication & reprise après sinistre"}, {"n": 63, "q": "Which command on Linux flushes pending discards and reclaims unused space on a mounted file system?", "o": {"A": "fsck", "B": "fstrim -av", "C": "mount -o remount", "D": "sync"}, "a": "B", "e": [["p", "fstrim -av exécute l’opération de discard sur chaque système de fichiers monté qui la prend en charge, en envoyant des commandes UNMAP au périphérique sous-jacent pour les blocs inutilisés. Everpure recommande de planifier fstrim régulièrement (par exemple chaque semaine via un timer systemd ou cron) sur les volumes qui ne sont pas montés avec l’option discard, afin que la récupération d’espace se fasse de manière prévisible, sans surcharge par E/S."]], "t": "Intégration Linux"}, {"n": 64, "q": "In a Cloud Block Store deployment on AWS, what backs the underlying capacity?", "o": {"A": "Local NVMe on EC2 only", "B": "A combination of EC2 instances plus EBS volumes (for example io2) managed by Purity", "C": "S3 only", "D": "Glacier only"}, "a": "B", "e": [["p", "CBS sur AWS exécute Purity dans des instances EC2 et utilise des volumes EBS (généralement io2) comme capacité sous-jacente, le tout géré et abstrait par Purity. Le client interagit avec CBS exactement comme avec une FlashArray physique (volumes, hôtes, snapshots), tandis que l’infrastructure spécifique à AWS (instances et EBS) est masquée par la pile logicielle Purity."]], "t": "Cloud Block Store"}, {"n": 65, "q": "What is the recommended Pure FlashArray practice when presenting a single very large datastore to ESXi?", "o": {"A": "Use an unlimited number of VMs per datastore", "B": "Follow VMware's per-datastore limits but generally prefer fewer, larger datastores given FlashArray's inherent QoS and lack of per-LUN bottlenecks", "C": "Always use one VM per datastore", "D": "Use only NFS"}, "a": "B", "e": [["p", "Comme FlashArray n’a aucun goulot d’étranglement de performance par LUN (pas de disques à plateaux, pas de cache par LUN), Everpure recommande moins de datastores VMFS, mais plus grands, que ne le faisaient les baies traditionnelles. Cela réduit la charge de gestion tout en respectant les limites de VMware sur le nombre maximal de VM par datastore (généralement 256 chemins). Pour une granularité par VM, les vVols sont préférables à de nombreux petits datastores VMFS."]], "t": "VMware avancé"}, {"n": 66, "q": "What is the impact of increasing host queue depth too aggressively on FlashArray?", "o": {"A": "Always improves performance", "B": "May increase latency and cause SCSI QFULL responses if the array's per-port queue is exceeded", "C": "Has no effect", "D": "Doubles capacity"}, "a": "B", "e": [["p", "La profondeur de file contrôle le nombre d’E/S en attente par périphérique ou par HBA. L’augmenter au-delà de ce dont la charge de travail a réellement besoin peut engendrer une latence plus élevée en cas de contention, et peut amener la baie à renvoyer SCSI QFULL lorsque sa limite de file par port est dépassée, ce qui force les hôtes à ralentir. Everpure publie des profondeurs de file recommandées par système d’exploitation afin d’équilibrer débit et latence."]], "t": "Performance"}, {"n": 67, "q": "What is FlashArray vRealize Operations integration used for?", "o": {"A": "To replace vCenter", "B": "To stream FlashArray performance and capacity metrics into vRealize Operations dashboards for unified VMware infrastructure monitoring", "C": "To deploy ESXi", "D": "To create virtual networks"}, "a": "B", "e": [["p", "Le Management Pack Everpure pour vRealize Operations (vROps) apporte les métriques au niveau de la baie (IOPS, latence, capacité, réduction de données, état de SafeMode) dans vROps, afin que les administrateurs VMware puissent corréler la performance des VM avec le comportement de la baie dans un seul outil. C’est l’une des nombreuses intégrations d’Everpure à l’ensemble de la pile d’exploitation VMware, aux côtés du plugin vSphere et du plugin vCenter."]], "t": "VMware avancé"}, {"n": 68, "q": "What is required for a successful failback after an ActiveDR failover?", "o": {"A": "Nothing; failback is automatic with no preparation", "B": "The original primary pod must be demoted, the previously promoted pod resynchronized to it, then the original direction restored", "C": "Eradicate the secondary pod first", "D": "Reinstall Purity on the primary"}, "a": "B", "e": [["p", "Le failback est une opération contrôlée : une fois le site principal rétabli, le pod principal d’origine est rétrogradé afin qu’il ne cherche plus à faire autorité ; le delta de données du pod actuellement promu est répliqué en retour ; puis l’administrateur promeut de nouveau le pod principal d’origine pour rétablir le sens initial. Omettre une étape fait courir un risque de divergence des données."]], "t": "Réplication & reprise après sinistre"}, {"n": 69, "q": "Which Pure CLI command shows array-wide capacity, data reduction, and shared space?", "o": {"A": "purearray list --space", "B": "purecapacity show", "C": "purearray status", "D": "purefa space"}, "a": "A", "e": [["p", "purearray list --space affiche la capacité physique et effective totale de la baie, l’espace utilisé et libre, ainsi que les métriques de réduction de données, notamment la déduplication, la compression et le ratio de réduction total. Les mêmes données sont affichées dans le tableau de bord de l’interface Purity et exportées via REST pour les consommateurs de télémétrie comme Pure1."]], "t": "Administration au quotidien (Day-2)"}, {"n": 70, "q": "What feature lets administrators apply an SLA-style throughput cap on individual volumes or volume groups?", "o": {"A": "Volume QoS bandwidth and IOPS limits", "B": "SafeMode", "C": "CloudSnap", "D": "ActiveDR"}, "a": "A", "e": [["p", "FlashArray prend en charge la QoS par volume et par groupe de volumes, sous forme de limites de bande passante et d’IOPS. Ces limites évitent les scénarios de voisin bruyant, où une seule charge de travail pourrait consommer une part disproportionnée des ressources de la baie. Des limites peuvent aussi être appliquées au niveau d’un hôte ou d’un groupe d’hôtes selon le modèle d’exploitation."]], "t": "Services de données & SafeMode"}, {"n": 71, "q": "On FlashArray//File, what is the unit of multitenancy for separating different customer file systems?", "o": {"A": "A volume group", "B": "A virtual file system / managed directory with its own quota and access policy", "C": "A pod", "D": "A host group"}, "a": "B", "e": [["p", "FlashArray//File prend en charge la multi-location en exposant des répertoires gérés et des systèmes de fichiers virtuels dotés de leurs propres quotas, exports et contrôles d’accès. Cela permet à une même FlashArray d’héberger des partages de fichiers pour plusieurs services ou clients, tout en maintenant totalement isolées les données, l’identité et la politique de quotas."]], "t": "Services de fichiers"}, {"n": 72, "q": "What does the Pure1 Service Catalog provide?", "o": {"A": "Pure-managed VM hosting", "B": "A self-service catalog of recommended workload sizes, configurations, and best-practice templates", "C": "Tape backup services", "D": "Free hardware shipping"}, "a": "B", "e": [["p", "Le Pure1 Service Catalog publie des recommandations de dimensionnement, de configuration et de bonnes pratiques pour les charges de travail courantes (par exemple SQL, Oracle, VDI). Les clients peuvent comparer leurs déploiements réels aux modèles recommandés et utiliser le catalogue comme point de départ pour planifier le placement de nouvelles charges de travail avec Workload Planner."]], "t": "Supervision & Pure1"}, {"n": 73, "q": "How is replication traffic between two FlashArrays for ActiveDR or async replication encrypted?", "o": {"A": "It is sent in plaintext", "B": "TLS is used for the replication control plane and snapshot data is encrypted in flight; data at rest remains AES-256 encrypted", "C": "Customers must configure IPsec themselves", "D": "It is only encrypted on Wednesdays"}, "a": "B", "e": [["p", "La réplication Everpure utilise TLS pour protéger le canal de contrôle et chiffre en transit les données de snapshot répliquées. Les données au repos restent chiffrées en AES-256 sur chaque baie grâce aux disques auto-chiffrants toujours actifs. Pour un chiffrement supplémentaire au niveau réseau, les clients peuvent en outre déployer IPsec ou MACsec indépendamment sur le WAN."]], "t": "Réplication & reprise après sinistre"}, {"n": 74, "q": "What is the purpose of udev rules in Linux for FlashArray volumes?", "o": {"A": "To rename the host", "B": "To set persistent device naming, ownership, and permissions for FlashArray devices so applications and clusterware can rely on stable paths", "C": "To enable jumbo frames", "D": "To configure NTP"}, "a": "B", "e": [["p", "Les règles udev sous Linux créent des noms de périphériques stables et prévisibles et appliquent des politiques de propriétaire et de permissions aux périphériques bloc FlashArray. C’est indispensable pour les disques Oracle ASM, les systèmes de fichiers en cluster et les autres charges de travail qui s’appuient sur la présence d’un chemin ou d’un propriétaire précis après chaque redémarrage, quelle que soit la façon dont le noyau énumère les périphériques SCSI."]], "t": "Intégration Linux"}, {"n": 75, "q": "What is the recommended order of operations to deploy a new ActiveCluster pod across two arrays?", "o": {"A": "Configure replication interfaces, connect the arrays, create a stretched pod, add volumes, then connect hosts on both sides via a stretched host group", "B": "Create the pod first, then configure the network", "C": "Configure the pod on only one side", "D": "No order is required"}, "a": "A", "e": [["p", "L’ordre de déploiement ActiveCluster de bout en bout est le suivant : configurer les interfaces de réplication et le routage, établir la connexion de baie à baie, déployer et confirmer le médiateur, créer un pod étendu (stretched pod) couvrant les deux baies, ajouter des volumes au pod, puis connecter les hôtes (généralement sous forme de groupe d’hôtes étendu couvrant les deux côtés) afin qu’ils puissent émettre des E/S vers les deux baies. Sauter ou réordonner des étapes fera échouer la validation."]], "t": "Réplication & reprise après sinistre"}, {"n": 76, "q": "What is the difference between an offload target and a remote array target in Purity?", "o": {"A": "Both are the same", "B": "An offload target is an object store (CloudSnap S3/Blob/GCS or NFS) for snapshot offload; a remote array target is another FlashArray for native replication", "C": "Only offload targets exist", "D": "Only remote array targets exist"}, "a": "B", "e": [["p", "Purity distingue deux types de points de terminaison de réplication. Une cible de baie distante (remote array target) est une autre FlashArray vers laquelle la réplication native (asynchrone ou synchrone) envoie les données modifiées. Une cible de déport (offload target) est un point de terminaison de stockage objet (S3, Azure Blob, GCS, NFS) utilisé par CloudSnap pour la rétention à long terme des snapshots. Un groupe de protection donné peut utiliser l’un, l’autre ou les deux."]], "t": "CloudSnap"}, {"n": 77, "q": "How does Purity handle deduplication?", "o": {"A": "Post-process only with administrator scheduling", "B": "Always-on inline global deduplication across the entire array, plus inline compression, before data is written to flash", "C": "Per-volume deduplication t
