hat must be enabled", "D": "Deduplication is a paid add-on"}, "a": "B", "e": [["p", "Purity effectue en permanence une déduplication globale et une compression en ligne sur l’ensemble de la baie. Il n’y a aucun réglage par volume ni tâche de post-traitement planifiée à gérer. Le ratio de réduction rapporté par la baie reflète la déduplication et la compression combinées, après suppression des motifs (pattern removal) et thin provisioning."]], "t": "Services de données & SafeMode"}, {"n": 78, "q": "What is the recommended approach for monitoring replication lag on ActiveDR pods?", "o": {"A": "Use a stopwatch", "B": "Use the Purity GUI replication dashboard, REST API, or Pure1 to monitor lag in seconds and bandwidth utilization", "C": "Lag cannot be monitored", "D": "Wait for users to complain"}, "a": "B", "e": [["p", "Le retard de réplication (lag) d’ActiveDR est exposé dans le tableau de bord de réplication de l’interface Purity, dans l’API REST (métriques du replica-link du pod) et dans les vues multi-flotte de Pure1. Les administrateurs doivent configurer une alerte lorsque le retard dépasse l’objectif de RPO de l’application, et en rechercher les causes, comme la saturation de la bande passante, les pics de latence WAN ou les rafales d’écriture."]], "t": "Dépannage"}, {"n": 79, "q": "On FlashArray, what is a 'protection group snapshot' compared with a single volume snapshot?", "o": {"A": "They are identical", "B": "A protection group snapshot is a consistency-group snapshot taken simultaneously across all members of the pgroup", "C": "Pgroup snapshots are slower", "D": "Pgroup snapshots cannot be replicated"}, "a": "B", "e": [["p", "Une snapshot de groupe de protection capture tous les volumes membres au même instant, offrant une restauration cohérente après crash pour les applications multi-volumes (par exemple une base de données avec des volumes de données et de journaux distincts). Associée à la mise en quiescence de l’application, elle devient cohérente au niveau applicatif. Les snapshots de pgroup peuvent être répliquées vers des baies distantes ou déportées via CloudSnap."]], "t": "Services de données & SafeMode"}, {"n": 80, "q": "What protocol is typically used between vCenter and the FlashArray VASA provider for vVols?", "o": {"A": "SMB", "B": "HTTP unencrypted", "C": "HTTPS (TLS)", "D": "Telnet"}, "a": "C", "e": [["p", "La communication VASA entre vCenter et le fournisseur VASA de la FlashArray utilise HTTPS sur TLS. vCenter fait confiance au point de terminaison VASA de la baie grâce à l’enregistrement du certificat lors de la configuration du fournisseur VASA. Toutes les requêtes de politique SPBM, l’enregistrement des groupes de réplication et les opérations de bind/unbind des vVols transitent par ce canal sécurisé."]], "t": "VMware avancé"}, {"n": 81, "q": "How does FlashArray handle a failed flash module (drive) in a DirectFlash Shelf?", "o": {"A": "The whole array goes offline", "B": "RAID-3D rebuild starts automatically using parity, and the failed module can be replaced as a hot-swap with no service impact", "C": "An administrator must manually rebuild the data", "D": "The data is permanently lost"}, "a": "B", "e": [["p", "FlashArray utilise RAID-3D, un schéma de protection développé par Everpure qui tolère des défaillances simultanées et se reconstruit automatiquement à partir de la parité. Un DirectFlash Module défaillant est remplaçable à chaud. Après remplacement, la baie intègre le nouveau module au pool et rééquilibre automatiquement. Il n’y a aucun impact sur les hôtes pendant ce processus."]], "t": "Mises à niveau & NDU"}, {"n": 82, "q": "What is the recommended approach to create many similar volumes for VDI deployment?", "o": {"A": "Manually create each volume one at a time", "B": "Use a Purity REST API script, Ansible playbook, or Terraform module to provision volumes in bulk from a template", "C": "Reinstall Purity for each volume", "D": "Call Pure Support to create them"}, "a": "B", "e": [["p", "Le provisionnement en masse est un cas d’usage d’automatisation typique. Les administrateurs écrivent un script pypureclient, un playbook Ansible utilisant purestorage.flasharray ou une configuration Terraform utilisant le provider Everpure, puis l’exécutent pour créer des centaines de volumes identiques (taille, groupe d’hôtes, appartenance à un groupe de protection) en une seule opération. La création manuelle volume par volume ne passe pas à l’échelle des déploiements VDI."]], "t": "Automatisation"}, {"n": 83, "q": "What does Purity//FA do automatically when a host's I/O pattern shifts (for example, from random small block to sequential large block)?", "o": {"A": "Asks the administrator to retune", "B": "Adapts internally; there are no per-workload tuning knobs to set because the array adapts read/write paths automatically", "C": "Throttles the host", "D": "Disables compression"}, "a": "B", "e": [["p", "FlashArray est délibérément exempte de réglages en fonction du comportement des charges de travail. Purity s’adapte en interne au profil d’E/S réel (taille de bloc, caractère aléatoire, profondeur de file) sans intervention de l’administrateur. Il n’existe aucun réglage de performance par charge de travail équivalent aux groupes RAID, partitions de cache ou promotions de tiers des baies traditionnelles."]], "t": "Performance"}, {"n": 84, "q": "In ActiveCluster, what happens to writes during a brief inter-site network glitch shorter than the timeout?", "o": {"A": "Writes are lost", "B": "Writes are held very briefly then continue once the link recovers, with no data divergence", "C": "One side is destroyed", "D": "I/O switches to async"}, "a": "B", "e": [["p", "Pour les micro-coupures plus courtes que le timeout configuré, les écritures sont mises en file d’attente et reprennent après le rétablissement. Les deux côtés restent synchronisés. Si l’interruption dépasse le timeout, le médiateur est consulté et un seul côté continue de servir les E/S pendant que l’autre se suspend. Une fois la connectivité rétablie et la resynchronisation terminée, le côté suspendu rejoint de nouveau le pod."]], "t": "Réplication & reprise après sinistre"}, {"n": 85, "q": "What is the recommended NDU rollback strategy if a Purity upgrade reveals a host-side issue?", "o": {"A": "No rollback is possible", "B": "Pure Support can roll back the upgrade to the prior Purity release on the affected controller, restoring the previous behavior", "C": "Reinstall Purity from scratch", "D": "Replace the controllers"}, "a": "B", "e": [["p", "Si une NDU de Purity fait apparaître un problème de compatibilité côté hôte, le support technique Everpure peut effectuer un retour arrière coordonné vers la version précédente de Purity. Les clients ne doivent pas tenter le retour arrière eux-mêmes ; la procédure est réalisée sous la conduite du support afin que l’état du cluster, les homologues de réplication et les chemins des hôtes soient ramenés en toute sécurité à l’état antérieur connu comme sain."]], "t": "Mises à niveau & NDU"}, {"n": 86, "q": "For an FC link health investigation, which front-end port-level metric is most useful on FlashArray?", "o": {"A": "DNS lookup time", "B": "Per-port link errors, loss-of-sync, loss-of-signal counters, and CRC errors visible via pureport list", "C": "Number of volumes", "D": "Snapshot count"}, "a": "B", "e": [["p", "pureport list (ainsi que la vue des ports de l’interface Purity) expose les compteurs d’erreurs de lien par port : loss-of-sync, loss-of-signal et erreurs CRC. Des compteurs non nuls ou en augmentation indiquent un problème de SFP, de câble ou de fabric sur ce chemin. Ils doivent être corrélés avec les compteurs côté commutateur sur le port de fabric correspondant afin de localiser le composant défectueux."]], "t": "Dépannage"}, {"n": 87, "q": "What is the recommended way to script idempotent FlashArray infrastructure as code?", "o": {"A": "Use shell scripts with the SSH CLI", "B": "Use the Pure Storage Terraform provider so configuration is declarative and idempotent", "C": "Write a custom binary in C", "D": "Use only the GUI"}, "a": "B", "e": [["p", "Le modèle déclaratif de Terraform convient bien à l’infrastructure as code de FlashArray. Le provider Terraform Everpure prend en charge les volumes, hôtes, groupes d’hôtes, groupes de protection, pods et d’autres objets ; les ingénieurs peuvent ainsi stocker l’état de FlashArray dans un gestionnaire de versions et appliquer les changements de manière idempotente dans des pipelines GitOps. Ansible est aussi très utilisé pour l’automatisation procédurale."]], "t": "Automatisation"}, {"n": 88, "q": "How does FlashArray report effective vs physical capacity?", "o": {"A": "Only physical capacity is reported", "B": "Effective capacity (logical, post-reduction credit) and physical capacity (actual flash used) are both shown, with the data reduction ratio between them", "C": "Only effective capacity is reported", "D": "Capacity is reported in megabytes only"}, "a": "B", "e": [["p", "Purity rapporte la capacité physique (flash réellement consommée) et la capacité effective (octets logiques présentés aux hôtes après déduplication, compression et suppression des motifs). Le rapport entre les deux est le ratio de réduction de données. La planification de capacité doit tenir compte des deux : la capacité physique détermine la décision sur la marge disponible ; la capacité effective détermine la quantité de charge de travail qui semble pouvoir tenir."]], "t": "Supervision & Pure1"}, {"n": 89, "q": "What is the function of Pure FlashArray Storage DRS interactions with vSphere?", "o": {"A": "FlashArray takes over Storage DRS", "B": "FlashArray is generally Storage DRS-friendly, but I/O metric-based moves are usually unnecessary because the array eliminates per-LUN bottlenecks; capacity-based moves remain useful", "C": "Storage DRS must be disabled", "D": "Storage DRS is required"}, "a": "B", "e": [["p", "Grâce aux caractéristiques de performance uniformes de FlashArray, les déplacements de VM de Storage DRS fondés sur les métriques d’E/S sont généralement inutiles et peuvent générer du trafic vMotion sans bénéfice. Storage DRS basé sur la capacité reste utile pour équilibrer l’espace libre entre les datastores. La recommandation d’Everpure est généralement de désactiver les déplacements basés sur les métriques d’E/S et de conserver ceux basés sur la capacité."]], "t": "VMware avancé"}, {"n": 90, "q": "After replacing a failed DirectFlash Module, how long does the rebuild typically take compared with a legacy disk array?", "o": {"A": "Days, like legacy spinning disks", "B": "Hours or less due to RAID-3D and the parallelism of all-flash, with no host performance impact", "C": "Months", "D": "Forever; the data is lost"}, "a": "B", "e": [["p", "Les reconstructions FlashArray sont considérablement plus rapides que celles des baies à disques à plateaux, car RAID-3D répartit la parité sur tous les modules et le parallélisme en lecture est élevé sur le support 100 % flash. Les reconstructions s’achèvent généralement en quelques heures ou moins, sans impact perceptible sur les hôtes, ce qui laisse la baie exposée à une seconde défaillance pendant une fenêtre bien plus courte que sur les baies traditionnelles."]], "t": "Mises à niveau & NDU"}, {"n": 91, "q": "What is the safest way to test a new ESXi host best-practice script before applying it to production hosts?", "o": {"A": "Apply it directly in production at peak hours", "B": "Apply it to a maintenance-mode host first, validate path counts and queue depths, then roll it out to other hosts during a change window", "C": "Skip testing", "D": "Always test on the FlashArray controllers"}, "a": "B", "e": [["p", "La procédure de changement standard consiste à appliquer les réglages de bonnes pratiques hôtes à un seul hôte placé en mode maintenance (aucune VM en cours d’exécution), à confirmer que le nombre de chemins, la profondeur de file, Disk.MaxIOSize et la politique Round Robin se rechargent correctement, puis à déployer sur les hôtes restants pendant une fenêtre de changement contrôlée. Cela minimise le périmètre d’impact si un réglage provoque une interaction inattendue."]], "t": "VMware avancé"}, {"n": 92, "q": "What is the function of NFS-protected snapshots (also called snapshot-only retention via NFS offload)?", "o": {"A": "NFS clients write to the array directly", "B": "Purity offloads snapshots to an NFS object/file target so they can be retained for long periods on cheaper storage outside the FlashArray", "C": "NFS clients read snapshots over SMB", "D": "NFS replaces FC"}, "a": "B", "e": [["p", "Pour les clients qui préfèrent des cibles NFS sur site au stockage objet du cloud public, Purity prend en charge le déport de snapshots de type CloudSnap vers des points de terminaison NFS. La baie conserve l’index des snapshots et rapatrie les données lorsqu’une récupération est demandée, gardant les snapshots récentes sur la baie tandis que la rétention longue durée se trouve sur un stockage fichier moins coûteux."]], "t": "CloudSnap"}, {"n": 93, "q": "What is the impact of a Purity controller failover on host I/O when MPIO is correctly configured?", "o": {"A": "A multi-minute outage", "B": "A brief pause measured in seconds while host MPIO transitions to the alternate controller's paths, with no application outage", "C": "Permanent data loss", "D": "Host reboot required"}, "a": "B", "e": [["p", "Avec un MPIO Round Robin actif sur les chemins des deux contrôleurs, un basculement de contrôleur (planifié ou non) apparaît aux hôtes comme une brève pause, le temps que la pile MPIO de l’hôte dirige les E/S exclusivement vers les chemins du contrôleur survivant. Les applications et les timeouts du système d’exploitation correctement réglés traversent cet événement de façon transparente, sans interruption visible par l’application."]], "t": "Administration au quotidien (Day-2)"}, {"n": 94, "q": "What metric on FlashArray indicates overall data reduction achieved across the array?", "o": {"A": "IOPS", "B": "Latency in milliseconds", "C": "Total Reduction (a ratio combining deduplication, compression, pattern removal, and thin provisioning)", "D": "Cache hit ratio"}, "a": "C", "e": [["p", "Total Reduction est le ratio principal rapporté par Purity ; il combine les effets de la déduplication, de la compression, de la suppression des motifs et du thin provisioning pour comparer les octets logiques présentés aux hôtes aux octets physiques stockés sur le flash. C’est la métrique utilisée dans les échanges sur la planification de capacité, et elle est visible dans le tableau de bord Purity, l’API REST et Pure1."]], "t": "Supervision & Pure1"}, {"n": 95, "q": "What must be true to add a new node to an existing ActiveCluster pair (creating a 'three-array' synchronous topology)?", "o": {"A": "ActiveCluster supports only two arrays per pod; expansion to a third array requires ActiveDR or a separate sync pair, not a third sync member", "B": "Any number of arrays can join a single ActiveCluster pod", "C": "ActiveCluster requires at least four arrays", "D": "ActiveCluster does not support replication"}, "a": "A", "e": [["p", "ActiveCluster est une réplication synchrone bidirectionnelle entre deux baies par pod. Pour étendre la protection à une troisième baie, les clients ajoutent ActiveDR (asynchrone) depuis la paire ActiveCluster vers un troisième site distant. Cette topologie « synchrone plus asynchrone » est la méthode prise en charge pour combiner une protection metro à RPO nul avec une reprise après sinistre à plus longue distance."]], "t": "Réplication & reprise après sinistre"}, {"n": 96, "q": "How can a host workload sizing exercise on FlashArray be validated before production rollout?", "o": {"A": "Skip validation", "B": "Use Pure1 Workload Planner to model fit, then run a representative workload (vdbench, fio, SLOB) against test volumes to confirm latency and throughput targets", "C": "Trust marketing materials", "D": "Test in production at peak"}, "a": "B", "e": [["p", "Un bon dimensionnement associe une prédiction fondée sur un modèle à une validation empirique. Pure1 Workload Planner modélise l’adéquation à partir de la télémétrie ; les administrateurs valident ensuite en exécutant des charges de travail synthétiques représentatives (vdbench, fio pour le bloc générique, SLOB pour Oracle, HammerDB pour SQL) sur des volumes de test reproduisant l’organisation de la production, afin de confirmer que la baie atteint les objectifs de latence et de débit à la concurrence attendue."]], "t": "Performance"}, {"n": 97, "q": "What is the typical Purity behavior when a SafeMode-protected pgroup tries to be eradicated immediately?", "o": {"A": "Eradication succeeds instantly", "B": "Eradication is blocked until the SafeMode retention timer expires; shortening the timer requires a Pure Support PIN", "C": "Eradication corrupts the array", "D": "Eradication completes after 5 minutes"}, "a": "B", "e": [["p", "SafeMode empêche l’éradication immédiate. L’éradication ne peut aboutir qu’une fois le timer de rétention SafeMode écoulé naturellement. Pour raccourcir le timer ou contourner la protection, un administrateur doit contacter le support Everpure afin d’obtenir le PIN SafeMode. C’est la défense explicite contre un ransomware qui tenterait de supprimer les snapshots de protection."]], "t": "Services de données & SafeMode"}, {"n": 98, "q": "What is the role of Purity's Stretch Cluster (stretched host group) in ActiveCluster?", "o": {"A": "Holds CloudSnap targets", "B": "Lets the same host group span both ActiveCluster arrays so identical LUN IDs are presented to a host cluster from both sides simultaneously", "C": "Replaces the mediator", "D": "Disables replication"}, "a": "B", "e": [["p", "Dans ActiveCluster, les hôtes peuvent se voir présenter simultanément des volumes identiques depuis les deux baies. Un groupe d’hôtes étendu (stretched host group) est la construction qui couvre les deux baies, de sorte que les LUN ID et l’état des connexions sont répliqués en miroir ; c’est ce qui permet à une seule pile MPIO d’hôte d’envoyer les E/S vers l’une ou l’autre baie de façon transparente, et de traverser une défaillance de site."]], "t": "Réplication & reprise après sinistre"}, {"n": 99, "q": "What is the FlashArray approach to firmware updates on DirectFlash Modules?", "o": {"A": "Updates are manual and disruptive", "B": "Updates are delivered as part of Purity software releases and applied non-disruptively in the background", "C": "Modules cannot be updated", "D": "Customers must ship modules back to Pure"}, "a": "B", "e": [["p", "Le firmware des DirectFlash Modules est livré intégré aux versions de Purity. Lorsque Purity est mis à niveau via la NDU, le firmware des DFM est lui aussi mis à jour en arrière-plan dans le cadre du processus orchestré. Il n’y a aucune procédure de mise à jour de firmware distincte, pilotée par le client, à gérer, ce qui explique en partie pourquoi l’empreinte opérationnelle de FlashArray est si réduite."]], "t": "Mises à niveau & NDU"}, {"n": 100, "q": "You suspect an ActiveCluster split-brain occurred during a planned maintenance window. What is the correct diagnostic and recovery approach?", "o": {"A": "Reboot both arrays simultaneously", "B": "Engage Pure Technical Support, gather logs from both arrays and the mediator, then follow the documented split-brain recovery procedure to choose the authoritative side and resync the other", "C": "Eradicate the pod", "D": "Disable replication permanently"}, "a": "B", "e": [["p", "La gestion d’un split-brain est une opération à fort enjeu, qui doit toujours être coordonnée avec le support technique Everpure. La bonne approche consiste à rassembler les journaux Purity des deux baies et du médiateur, à identifier quel côté fait autorité d’après des critères documentés (E/S valide la plus récente, dernier contact avec le médiateur), puis à suivre la procédure de récupération prise en charge pour désigner un gagnant et resynchroniser l’autre côté à partir de l’état d’autorité choisi. Agir unilatéralement fait courir un risque de perte de données."]], "t": "Dépannage"}];      // n, q = énoncé, o = options, a = bonne réponse, e = explication (blocs), t = thème, x = description d'exhibit

function charger(){

const $app = document.getElementById('app');
const N = QUESTIONS.length;

/* Création d'élément concise (le texte est toujours inséré via textContent : aucun risque d'injection) */
function el(tag, attrs={}, ...enfants){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class') n.className = v;
    else if(k==='text') n.textContent = v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if(v!==false && v!=null) n.setAttribute(k, v);
  }
  enfants.flat().filter(c => c != null && c !== false).forEach(c => n.append(c));  // ignore les enfants vides
  return n;
}
/* ============================================================
   TEXTE ENRICHI : **gras**, *italique*, `code` (construit via le DOM, sans innerHTML)
   ============================================================ */
function inline(txt){
  const f = document.createDocumentFragment();
  String(txt).split(/(\*\*[^*]+\*\*|`[^`]+`|\*[^*\s][^*]*\*)/).forEach(s => {
    if(!s) return;
    if(s.startsWith('**')) f.append(el('strong',{text:s.slice(2,-2)}));
    else if(s[0]==='`') f.append(el('code',{text:s.slice(1,-1)}));
    else if(s[0]==='*') f.append(el('em',{text:s.slice(1,-1)}));
    else f.append(s);
  });
  return f;
}
const bloc = b => (b[0]==='ul' || b[0]==='ol') ? el(b[0],{}, b[1].map(x => el('li',{}, inline(x)))) : el('p',{}, inline(b[1]));

function ouvrirZoom(src, alt){
  let s = 1, x = 0, y = 0, deplace = false; const pts = new Map(); let d0 = 0, s0 = 1;
  const retour = document.activeElement;
  const img = el('img',{src, alt, draggable:'false'});
  const scene = el('div',{class:'zoom-scene'}, img);
  const lbl = el('span');
  const maj = () => { img.style.transform = `translate(${x}px,${y}px) scale(${s})`; lbl.textContent = Math.round(s*100) + ' %'; };
  const zoomer = (f, cx, cy) => {                       // zoom centré sur (cx,cy), en pixels écran
    const r = scene.getBoundingClientRect();
    const px = (cx ?? r.left + r.width/2) - r.left - r.width/2, py = (cy ?? r.top + r.height/2) - r.top - r.height/2;
    const ns = Math.min(10, Math.max(.3, s*f)), k = ns/s;
    x = px - (px-x)*k; y = py - (py-y)*k; s = ns; maj();
  };
  const reset = () => { s = 1; x = 0; y = 0; maj(); };
  const fermer = () => { document.removeEventListener('keydown', touche, true); ov.remove(); document.body.style.overflow = ''; retour?.focus?.(); };
  const touche = e => {
    if(e.key==='Escape') fermer(); else if(e.key==='+'||e.key==='=') zoomer(1.25); else if(e.key==='-') zoomer(.8); else if(e.key==='0') reset(); else return;
    e.preventDefault(); e.stopPropagation();
  };
  const btnFermer = el('button',{onclick:fermer,'aria-label':'Fermer',text:'✕ Fermer'});
  const ov = el('div',{class:'zoom',role:'dialog','aria-modal':'true','aria-label':'Exhibit agrandi'},
    el('div',{class:'zoom-barre'},
      el('button',{onclick:()=>zoomer(.8),'aria-label':'Dézoomer',text:'−'}), lbl,
      el('button',{onclick:()=>zoomer(1.25),'aria-label':'Zoomer',text:'+'}),
      el('button',{onclick:reset,text:'Ajuster'}), btnFermer,
      el('small',{style:'flex-basis:100%;text-align:center;color:#aaa',text:'Molette ou pincer pour zoomer · glisser pour déplacer · double-clic pour agrandir · Échap pour fermer'})),
    scene);
  scene.addEventListener('wheel', e => { e.preventDefault(); zoomer(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX, e.clientY); }, {passive:false});
  scene.addEventListener('dblclick', e => { if(s > 1.05) reset(); else zoomer(2.5, e.clientX, e.clientY); });
  scene.addEventListener('pointerdown', e => { scene.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); deplace = false;
    if(pts.size===2){ const [a,b] = [...pts.values()]; d0 = Math.hypot(a.x-b.x, a.y-b.y); s0 = s; } });
  scene.addEventListener('pointermove', e => {
    if(!pts.has(e.pointerId)) return;
    const p = pts.get(e.pointerId);
    if(pts.size===1){ x += e.clientX-p.x; y += e.clientY-p.y; if(Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y) > 2) deplace = true; maj(); }
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){ const [a,b] = [...pts.values()]; zoomer(s0*Math.hypot(a.x-b.x,a.y-b.y)/d0/s, (a.x+b.x)/2, (a.y+b.y)/2); deplace = true; }
  });
  const fin = e => { pts.delete(e.pointerId); if(e.type==='pointerup' && e.target===scene && !deplace && pts.size===0) fermer(); };
  scene.addEventListener('pointerup', fin); scene.addEventListener('pointercancel', fin);
  document.body.append(ov); document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', touche, true);
  maj(); btnFermer.focus();
}

/* ============================================================
   PROTECTIONS ANTI-REPRODUCTION (dissuasives : aucun moyen n'empêche totalement la copie d'une page web)
   true / false pour activer ou désactiver chaque mesure
   ============================================================ */
const PROTECTION = {
  antiCopie: true,    // pas de sélection / copier / glisser-déposer / menu contextuel sur le contenu
  impression: false   // false = l'impression (Ctrl+P / PDF) n'affiche qu'un message
};
function activerProtections(){
  const b = document.body;
  b.classList.toggle('sans-impression', !PROTECTION.impression);
  b.classList.toggle('anti-copie', PROTECTION.antiCopie);
  if(PROTECTION.antiCopie)
    ['copy','cut','dragstart','contextmenu','selectstart'].forEach(ev =>
      document.addEventListener(ev, e => { if(!(e.target.closest && e.target.closest('input,textarea'))) e.preventDefault(); }));
}
/* Le copyright est reconstitué s'il est supprimé ou modifié */
function garantirCopyright(){
  let f = document.querySelector('footer');
  if(!f){ f = el('footer'); document.body.append(f); }
  const p = f.querySelector('.copyright');
  if(!p || !/Mohamed BARR/.test(p.textContent)){ p && p.remove(); f.prepend(el('p',{class:'copyright',text:'© 2026 Mohamed BARR. Tous droits réservés.'})); }
}

function liste(f = etat.filtre || 'tous'){

    || (f==='marquees' && etat.flags[i]) || (f==='dues' && etat.sr[i] && etat.sr[i].due<=Date.now()) || (th && QUESTIONS[i].t===th));
}

function voisin(i, d){ const l = ordreNav(), p = l.indexOf(i); if(p<0) return Math.max(0, Math.min(N-1, i+d)); return l[p+d] ?? null; }

function majEntete(){
  const pastille = document.getElementById('scoreLive'), barre = document.getElementById('barreGlobale');
  const enExam = examActif() && (etat.vue==='examQ' || etat.vue==='examRevue');

    barre.style.width = (nbRepExam()/NX()*100) + '%';
  } else {
    pastille.classList.remove('attention','urgence');
    pastille.textContent = `Score : ${nbJustes()} / ${nbVerifiees()}`;
    barre.style.width = (nbVerifiees()/N*100) + '%';
  }
}
function aller(vue, cur){
  etat.vue = vue;
  if(cur!==undefined) etat.cur = Math.max(0, Math.min(N-1, cur));

function blocFeedback(i){
  const q = QUESTIONS[i], ok = estJuste(i);
  return el('div',{class:`fb-corps ${ok?'ok':'ko'}`},
    el('p',{class:'fb-titre',text: ok ? '✅ Correcte !' : '❌ Incorrecte'}),
    ok ? null : el('p',{},'La bonne réponse est ', el('strong',{}, `${q.a}. `, inline(q.o[q.a])), '.'),
    el('p',{class:'expl-label',text:'Explication'}),
    q.e.map(bloc)
  );
}

function vueQuestion(){
  const i = etat.cur, q = QUESTIONS[i], verifiee = !!etat.verif[i];
  const choix = etat.rep[i] || null;

  /* Options : cases à cocher, une seule sélection possible */
  const champ = el('fieldset',{class:'options'}, el('legend',{class:'sr',style:'position:absolute;left:-9999px',text:`Options de la question ${q.n}`}));
  Object.entries(q.o).forEach(([lettre,texte])=>{
    let cls = 'option';
    if(verifiee){
      cls += ' verrou';
      if(lettre===q.a) cls += ' bonne';
      else if(lettre===choix) cls += ' mauvaise';
    } else if(lettre===choix) cls += ' choisie';

    const cb = el('input',{type:'checkbox',name:`q${q.n}`,value:lettre,checked:lettre===choix?'':false,disabled:verifiee?'':false});
    cb.checked = lettre===choix;
    cb.addEventListener('change',()=>{
      etat.rep[i] = cb.checked ? lettre : undefined;       // décocher = effacer la sélection
      if(!cb.checked) delete etat.rep[i];
      sauver(); rendre();
    });
    const badge = verifiee && lettre===q.a ? el('span',{class:'badge',text:'Bonne réponse'})
                : verifiee && lettre===choix ? el('span',{class:'badge',text:'Votre réponse'}) : null;
    champ.append(el('label',{class:cls}, cb, el('span',{class:'lettre',text:lettre+'.'}), el('span',{class:'texte-opt'}, inline(texte)), badge));
  });

  const fb = el('div',{class:'feedback','aria-live':'polite'}, el('div',{}, verifiee ? blocFeedback(i) : ''));
  if(verifiee) fb.classList.add('ouvert');

  const L = ordreNav(), p = Math.max(0, L.indexOf(i)), prev = voisin(i,-1), next = voisin(i,1), dernier = next===null;
  const btnVerifier = el('button',{class:'btn primaire',disabled:(!choix||verifiee)?'':false,text:'Vérifier la réponse',
    onclick:()=>{
      if(!choix || etat.verif[i]) return;
      etat.verif[i] = true; srMaj(i, choix===q.a); sauver(); majEntete();
      fb.firstChild.replaceChildren(blocFeedback(i));
      /* Mise en couleur des options sans reconstruire la page, pour garder l'animation */
      champ.querySelectorAll('.option').forEach(l=>{
        const v = l.querySelector('input').value;
        l.classList.remove('choisie'); l.classList.add('verrou');
        l.querySelector('input').disabled = true;
        if(v===q.a){ l.classList.add('bonne'); l.append(el('span',{class:'badge',text:'Bonne réponse'})); }
        else if(v===choix){ l.classList.add('mauvaise'); l.append(el('span',{class:'badge',text:'Votre réponse'})); }
      });
      btnVerifier.disabled = true;
      requestAnimationFrame(()=>requestAnimationFrame(()=>fb.classList.add('ouvert')));
      setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),150);
    }});

  return el('section',{class:'carte'},
    el('div',{class:'haut-q'},
      el('span',{class:'num-q',text: etat.filtre==='tous' ? `Question ${q.n} sur ${N}` : `Question ${q.n} · ${p+1}/${L.length} de la sélection`}),
      el('div',{class:'rangee'}, boutonFlag(etat.flags, i), el('button',{class:'lien',onclick:()=>aller('sommaire'),text:'Retour au sommaire'}))
    ),
    el('div',{class:'mini-barre'}, el('div',{style:`width:${(p+1)/L.length*100}%`})),
    el('h2',{class:'enonce'}, inline(q.q)),
    blocExhibit(q),
    champ,
    fb,
    el('div',{class:'nav-q'},
      el('button',{class:'btn fleche',disabled:prev===null?'':false,'aria-label':'Question précédente',title:'Précédente (←)',onclick:()=>aller('question',prev),text:'←'}),
      el('div',{class:'nav-centre'},
        btnVerifier,
        dernier ? el('button',{class:'btn',onclick:()=>aller('resume'),text:'Terminer'}) : null
      ),
      el('button',{class:'btn fleche',disabled:dernier?'':false,'aria-label':'Question suivante',title:'Suivante (→)',onclick:()=>aller('question',next),text:'→'})
    )
  );
}

/* ============================================================
   MARQUAGE : bouton « 🚩 Marquer pour révision » (entraînement et examen)
   ============================================================ */
function boutonFlag(flags, idx){
  const b = el('button',{class:'btn drapeau',title:'Marquer cette question pour y revenir plus tard'});
  const maj = () => { const on = !!flags[idx]; b.classList.toggle('actif',on); b.setAttribute('aria-pressed',String(on)); b.textContent = on ? '🚩 Marquée' : '🚩 Marquer pour révision'; };
  b.addEventListener('click',()=>{ if(flags[idx]) delete flags[idx]; else flags[idx] = true; sauver(); maj(); });
  maj(); return b;
}

/* Carte de correction (utilisée par le résumé d'entraînement et le résultat d'examen) */
function carteRevue({q, choix, repondu, flag, label, msgNr, onRevoir}){
  const s = !repondu ? 'nr' : (choix===q.a ? 'ok' : 'ko');
  const opts = el('div',{class:'options'}, Object.entries(q.o).map(([l,tx])=>{
    let cls = 'option verrou', badge = null;
    if(l===q.a){ cls += ' bonne'; badge = el('span',{class:'badge',text:'Bonne réponse'}); }
    else if(repondu && l===choix){ cls += ' mauvaise'; badge = el('span',{class:'badge',text:'Votre réponse'}); }
    return el('div',{class:cls}, el('span',{class:'lettre',text:l+'.'}), el('span',{class:'texte-opt'}, inline(tx)), badge);
  }));
  return el('article',{class:`revue-item ${s}`},
    el('h3',{text:`${s==='ok'?'✅':s==='ko'?'❌':'⚪'} ${flag?'🚩 ':''}${label} – ${q.q}`}),
    blocExhibit(q),
    opts,
    s==='nr' ? el('p',{style:'color:var(--gris);margin:0 0 8px',text:msgNr}) : null,
    el('details',{}, el('summary',{text:'Explication'}), q.e.map(bloc)),
    onRevoir ? el('div',{style:'margin-top:8px'}, el('button',{class:'lien',onclick:onRevoir,text:'Revoir cette question'})) : null
  );
}

   ============================================================ */
const vers = v => { etat.vue = v; sauver(); rendre(); window.scrollTo({top:0}); };
function allerExam(vue, pos){
  etat.vue = vue;
  if(pos!==undefined) etat.exam.pos = Math.max(0, Math.min(NX()-1, pos));
  sauver(); rendre(); window.scrollTo({top:0});
}

function demarrerExamen(){
  const ordre = QUESTIONS.map((_,i)=>i);
  for(let k=ordre.length-1;k>0;k--){ const r = Math.floor(Math.random()*(k+1)); [ordre[k],ordre[r]] = [ordre[r],ordre[k]]; }  ordre.length = Math.min(NB_EXAMEN, N);   // tirage aléatoire différent à chaque passage
  const now = Date.now();
  etat.exam = { ordre, pos:0, rep:{}, flags:{}, debut:now, fin:now+DUREE_EXAMEN, termine:null, auto:false };
  allerExam('examQ', 0);
}

function terminerExamen(auto){
  if(!examActif()) return;
  etat.exam.termine = Math.min(Date.now(), etat.exam.fin);
  etat.exam.auto = !!auto; etat.exam.ordre.forEach(i => { if(etat.exam.rep[i]) srMaj(i, etat.exam.rep[i]===QUESTIONS[i].a); });
  etat.vue = 'examRes'; sauver(); rendre(); window.scrollTo({top:0});
}

/* Chronomètre : vérifié chaque seconde ; l'examen est rendu automatiquement à 0:00:00 */
function tick(){
  if(!examActif()) return;
  if(etat.exam.fin - Date.now() <= 0){ terminerExamen(true); return; }
  if(etat.vue==='examQ' || etat.vue==='examRevue') majEntete();
}

async function recommencer(){
  if(!(await confirmer('Effacer toutes vos réponses d’entraînement et recommencer ?', 'Recommencer'))) return;
  etat = Object.assign(ETAT_INITIAL(), {exam:etat.exam});   // ne réinitialise que l'entraînement
  sauver(); rendre(); window.scrollTo({top:0});
}

const VUES = {sommaire:vueSommaire, question:vueQuestion, resume:vueResume, examIntro:vueExamIntro, examQ:vueExamQ, examRevue:vueExamRevue, examRes:vueExamRes, apropos:vueApropos, dash:vueDash, rev:vueRev, flash:vueFlash};
let cleVue = null;
function rendre(){
  /* Garde-fous : état d'examen incohérent → retour au sommaire */
  if(etat.vue.startsWith('exam') && etat.vue!=='examIntro' && !etat.exam) etat.vue = 'sommaire';
  if((etat.vue==='examQ'||etat.vue==='examRevue') && !examActif()) etat.vue = etat.exam ? 'examRes' : 'sommaire';
  majEntete();
  document.body.classList.toggle('hors-sommaire', !['sommaire','apropos'].includes(etat.vue));

const cp = s => [...String(s).replace(/[\u00a0\u202f\u2009]/g,' ').replace(/[\r\n\t]+/g,' ')].map(c => { const k = c.codePointAt(0); return CP1252[c] || ((k>=32 && k<127) || (k>=160 && k<256) ? k : 63); });
const larg = (f, s, z) => cp(s).reduce((a,k) => a + (AFM[f][k-32] || 500), 0) * z / 1000;
const pdfStr = s => '(' + cp(s).map(k => (k===40||k===41||k===92) ? '\\'+String.fromCharCode(k) : (k<32||k>126) ? '\\'+k.toString(8).padStart(3,'0') : String.fromCharCode(k)).join('') + ')';

function coupe(f, s, z, max){ const out = []; let l = ''; String(s).split(/\s+/).filter(Boolean).forEach(m => { const t = l ? l+' '+m : m; if(l && larg(f,t,z) > max){ out.push(l); l = m; } else l = t; }); if(l) out.push(l); return out; }

/* Une page : coordonnées depuis le coin supérieur gauche, en points (1 pt = 1/72 pouce) */
function Page(w = 595.28, h = 841.89){
  const ops = [], Y = y => (h - y).toFixed(2);
  const P = { w, h, ops,
    rect(x, y, ww, hh, fill, stroke, lw = 1){ ops.push(`${fill ? rgb(fill)+' rg ' : ''}${stroke ? rgb(stroke)+' RG '+lw+' w ' : ''}${x} ${Y(y+hh)} ${ww} ${hh} re ${fill && stroke ? 'B' : fill ? 'f' : 'S'}`); return P; },
    ligne(x1, y1, x2, y2, c, lw = 1){ ops.push(`${rgb(c)} RG ${lw} w ${x1} ${Y(y1)} m ${x2} ${Y(y2)} l S`); return P; },
    texte(x, y, s, f = 'H', z = 10, c = '#33322E', al = 'l'){ const d = larg(f,s,z); x = al==='c' ? x - d/2 : al==='r' ? x - d : x; ops.push(`BT ${rgb(c)} rg /${f} ${z} Tf ${x.toFixed(2)} ${Y(y)} Td ${pdfStr(s)} Tj ET`); return P; },
    image(x, y, ww, hh){ ops.push(`q ${ww.toFixed(2)} 0 0 ${hh.toFixed(2)} ${x} ${Y(y+hh)} cm /Im1 Do Q`); return P; },
    par(x, y, s, f, z, c, max, lead){ coupe(f,s,z,max).forEach(l => { P.texte(x, y, l, f, z, c); y += lead; }); return y; }
  };
  return P;
}

  const flux = (d, data) => cat([S(`<<${d}/Length ${data.length}>>\nstream\n`), data, S('\nendstream')]);

  o[2] = S(`<</Type/Pages/Count ${n}/Kids[${pages.map((_,i) => (10+2*i)+' 0 R').join(' ')}]>>`);
  ['Helvetica','Helvetica-Bold','Times-Bold','Times-Italic'].forEach((f,i) => o[3+i] = S(`<</Type/Font/Subtype/Type1/BaseFont/${f}/Encoding/WinAnsiEncoding>>`));
  o[7] = flux(`/Type/XObject/Subtype/Image/Width ${logo.w}/Height ${logo.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/SMask 8 0 R${logo.z?'/Filter/FlateDecode':''}`, logo.rgb);
  o[8] = flux(`/Type/XObject/Subtype/Image/Width ${logo.w}/Height ${logo.h}/ColorSpace/DeviceGray/BitsPerComponent 8${logo.z?'/Filter/FlateDecode':''}`, logo.a);
  const res = '/Resources<</Font<</H 3 0 R/HB 4 0 R/TB 5 0 R/TI 6 0 R>>/XObject<</Im1 7 0 R>>>>';
  pages.forEach((p,i) => { o[9+2*i] = flux('', S(p.ops.join('\n'))); o[10+2*i] = S(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${p.w} ${p.h}]${res}/Contents ${9+2*i} 0 R>>`); });
  const parts = [S('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')], off = []; let len = parts[0].length;
  for(let i = 1; i < o.length; i++){ off[i] = len; const b = cat([S(`${i} 0 obj\n`), o[i], S('\nendobj\n')]); parts.push(b); len += b.length; }
  let x = `xref\n0 ${o.length}\n0000000000 65535 f \n`; for(let i = 1; i < o.length; i++) x += String(off[i]).padStart(10,'0') + ' 00000 n \n';
  parts.push(S(x + `trailer\n<</Size ${o.length}/Root 1 0 R/Info<</Title ${pdfStr(titre)}/Author ${pdfStr('Mohamed BARR')}>>>>\nstartxref\n${len}\n%%EOF`));
  return cat(parts);
}

  const im = new Image();
  im.onload = () => { const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const x = c.getContext('2d'); x.drawImage(im,0,0);
    const d = x.getImageData(0,0,c.width,c.height).data, n = c.width*c.height, col = new Uint8Array(n*3), a = new Uint8Array(n);
    for(let i = 0; i < n; i++){ col[i*3] = d[i*4]; col[i*3+1] = d[i*4+1]; col[i*3+2] = d[i*4+2]; a[i] = d[i*4+3]; }
    const z = async u => { try{ return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer()); }catch(e){ return null; } };   // compression Flate si disponible
    Promise.all([z(col), z(a)]).then(([zc, za]) => res(zc && za ? {w:c.width, h:c.height, rgb:zc, a:za, z:true} : {w:c.width, h:c.height, rgb:col, a})); };

function telecharger(octets, nom){

async function partager(txt){
  const url = location.href.split('#')[0];
  if(!/^https?:/.test(location.protocol)) return info('Cette copie est ouverte en local : publiez-la (lien claude.ai, GitHub Pages, Netlify…) pour obtenir un lien à partager.');
  try{ if(navigator.share) return await navigator.share({title:document.title, text:txt||'QCM FASP Everpure', url}); }catch(e){ if(e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(url); info('Lien copié dans le presse-papiers.'); }catch(e){ info(url); }
}
