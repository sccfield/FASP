const QUESTIONS = [{"n": 1, "q": "A new array is directly connected to a host with Direct Attach Copper (DAC) cables. The link does not come up. Which document can be used to help identify the issue ?", "o": {"A": "The FlashArray User Guide", "B": "FlashArray Transceiver and Cable Support article", "C": "The Port Usage and Definitions article"}, "a": "B", "e": [["p", "Quand un lien physique ne monte pas avec des câbles DAC, on vérifie d'abord la compatibilité matérielle. l'article « **FlashArray Transceiver and Cable Support** » liste les câbles DAC, AOC et transceivers pris en charge par modèle de FlashArray et par type de port. Un câble non supporté est une cause fréquente de lien « down »."]], "t": "Matériel & réseau"}, {"n": 2, "q": "When is it possible to simulate snapshot policies in the Pure1 Snapshot Policies (SafeMode) ?", "o": {"A": "When a FlashArray has existing snapshots", "B": "When a FlashArray does not have existing snapshots", "C": "When a FlashArray has an existing saved workload simulation"}, "a": "A", "e": [["p", "Le simulateur de politiques de snapshots de Pure1 s'appuie sur l'historique des snapshots existants (taux de changement, rétention) pour projeter l'impact en capacité. Sans snapshots existants, il n'a aucune donnée de référence. Correction : l'explication d'origine assimilait ce simulateur à « SafeMode », alors que SafeMode désigne le verrouillage de rétention (retention lock) des groupes de protection, une fonction distincte."]], "t": "Protection & SafeMode"}, {"n": 3, "q": "What command must an administrator run to use newly installed DirectFlash Modules (DFM) ?", "o": {"A": "pureadmin --admit-drive", "B": "purearray admit drive", "C": "puredrive admit"}, "a": "C", "e": [["p", "Depuis Purity//FA 5.2.0, l'admission des modules est en deux étapes (« Two Step Drive Admission ») : les ajouts de capacité, data packs, modules et tiroirs doivent être explicitement approuvés par l'utilisateur. Les modules insérés apparaissent en statut « unadmitted » et ne sont plus admis automatiquement, sauf s'ils sont insérés dans un emplacement précédemment utilisé et non évacué. La commande CLI « puredrive admit » (ou le bouton « Admit » de la GUI, Health \\> Hardware, où les modules en attente s'affichent en jaune) fait passer leur statut de « unadmitted » à « healthy » lorsque c'est possible. Prérequis : terminer au préalable toutes les mises à jour de firmware des modules. Si un problème n'apparaît qu'après la tentative d'admission, le module peut passer en « unhealthy », « failed » ou « unrecognized » : le guide **FlashArray Space** précise que la correction du problème entraîne alors l'admission automatique, tandis que le **Purity//FA Administration Guide 6.10.4** indique de relancer « puredrive admit » et de contacter le support si la seconde tentative échoue. Évolutions : TwoStep.Next (Purity 5.3.4) ajoute des contrôles de santé avant l'admission ; Purity 6.3.4 ajoute d'autres contrôles. Un module qui ne peut pas être admis reste « unadmitted » (détail « Admit failed » : contacter le support). Pour un remplacement, le nouveau module est admis automatiquement s'il est de taille et de type similaires à l'ancien ; sinon il reste « unadmitted » avec le détail « not suitable replacement (waiting for user) » et peut quand même être admis par « puredrive admit ». À noter : « puredrive admit » est réservée à pureuser / Array Admin (**Directory Services on FlashArray**) , et les options « pureadmin --admit-drive » et « purearray admit drive » n'existent pas. Côté matériel, le **FlashArray//XR4 Service Guide 50-0033-11** décrit uniquement l'installation physique : modules et obturateurs installés de gauche à droite à partir du premier emplacement libre, les 10 emplacements d'un pack étant tous remplis (modules ou obturateurs, pour assurer le flux d'air), et tous les modules du châssis devant être du même type et de la même capacité ; ce guide ne traite pas l'admission."]], "t": "Matériel & réseau"}, {"n": 4, "q": "During a test failover using ActiveDR, what content will be presented to the target pod ?", "o": {"A": "The content from the last periodic refresh", "B": "The content from the last real fail-over", "C": "The content from the undo pod"}, "a": "A", "e": [["p", "Le **Purity//FA Administration Guide 6.10.4** précise que, lors d'un test de reprise ActiveDR, la promotion du pod cible présente aux hôtes le point dans le temps correspondant aux dernières données répliquées avec succès avant la promotion --- autrement dit le **RPO disponible le plus récent**. Pendant le test, les nouvelles écritures de la source continuent d'être suivies dans un journal en arrière-plan et ne mettent pas à jour le pod cible promu. L'« undo-demote pod » n'est créé qu'au moment du demote, pour conserver les données écrites pendant le test. La réponse A reste donc la meilleure des trois propositions, même si « last periodic refresh » est moins précis que « latest available RPO / last successfully completed replication transfer »."]], "t": "ActiveCluster & ActiveDR"}, {"n": 5, "q": "What major benefit does meta fingerprinting provide for customers ?", "o": {"A": "Provides security for Remote Assist (RA)", "B": "Ensures biometric security", "C": "Enables predictive support"}, "a": "C", "e": [["p", "Le guide **Purity//FA Alerts 6.10.4** décrit le « Predictive Support » au moyen de *fingerprints* : des scripts analysent les journaux Purity afin d'identifier des problèmes connus ou des signes avant-coureurs. Le guide FASP officiel inclut par ailleurs le thème **meta forecasting** dans les objectifs de certification. En revanche, le terme exact « meta fingerprinting » n'est pas défini tel quel dans le **Purity//FA Administration Guide 6.10.4** : il faut donc éviter d'affirmer sans source que ces fingerprints sont exclusivement des « empreintes de métadonnées anonymisées ». Pour l'examen, l'association **fingerprinting / meta forecasting → predictive support** est la plus cohérente. A et B sont sans rapport avec cette fonction."]], "t": "Pure1 & supervision"}, {"n": 6, "q": "A storage administrator has presented VMFS datastores from a FlashArray with 10TB of raw capacity. Why would the administrator see System space when logging in to the FlashArray GUI ?", "o": {"A": "Virtual machines have not yet issued an UNMAP command", "B": "System space can include reclaimable user capacity after atypical LUN deletions or extensive overwrites", "C": "More than 2TB of volume snapshots were destroyed"}, "a": "B", "e": [["p", "Le **Purity//FA Administration Guide 6.10.4** définit « System » comme l'espace physique occupé par les métadonnées internes. Dans certaines situations atypiques, notamment après un nombre important de suppressions de LUN ou de réécritures, l'espace « System » peut également représenter une combinaison de surcharge de métadonnées et d'espace utilisateur récupérable. Cet espace doit normalement diminuer avec le temps. La réponse **B** est donc directement conforme à la définition documentée. L'absence d'UNMAP peut retarder la récupération d'espace, mais elle ne constitue pas à elle seule la définition de « System space »."]], "t": "VMware & vVols"}, {"n": 7, "q": "What is the recommended Maximum Transmission Unit (MTU) size for the replication ports on a FlashArray ?", "o": {"A": "4200", "B": "1500", "C": "9000"}, "a": "B", "e": [["p", "Le **Purity//FA Administration Guide 6.10.4** (réplication asynchrone) indique que Everpure recommande de laisser le MTU à 1500 : les jumbo frames (9000) sont pris en charge mais n'apportent qu'un bénéfice limité. Le **FlashArray ActiveCluster** va dans le même sens : le MTU par défaut de 1500 est « requis comme bonne pratique » et Everpure recommande de ne pas modifier cette valeur sur les ports de réplication. Si l'on utilise 9000, il doit être identique sur tout le chemin entre les baies. À ne pas confondre avec le trafic hôte NVMe/TCP, où le MTU 9000 de bout en bout est la pratique recommandée."]], "t": "Matériel & réseau"}, {"n": 8, "q": "A FlashArray is configured to use directory services. A user is a member of the groups associated with both Array Admin and Storage Admin. What will the user experience when logging into the array ?", "o": {"A": "Inability to login", "B": "Storage Admin permissions", "C": "Array Admin permissions"}, "a": "B", "e": [["p", "Le **Directory Services on FlashArray** indique de ne pas rendre un utilisateur membre de plusieurs groupes Pure : ses permissions sur la FlashArray sont alors restreintes au groupe le plus bas (principe du moindre privilège). Pour un utilisateur à la fois dans les groupes Array Admin et Storage Admin, il obtient donc les permissions Storage Admin. La même règle est rappelée pour la saisie des groupes dans la configuration : ne jamais saisir le même nom de groupe dans plusieurs champs, sinon les permissions sont verrouillées au niveau le plus bas. Variante à connaître : pour l'intégration FreeIPA, le guide indique qu'un utilisateur membre de plus d'un groupe de sécurité ne parvient pas à se connecter ; la question générique (annuaire, AD) retient le cas « permissions les plus basses ». Confirmation par le guide **Purity//FA Alerts**. L'alerte 158 (« User granted reduced permissions due to role misconfiguration ») indique que, lorsqu'un utilisateur d'annuaire se voit attribuer plusieurs rôles Purity parmi array_admin, storage_admin et readonly, il reçoit le rôle le moins privilégié : array_admin + storage_admin donne donc Storage Admin."]], "t": "File Services"}, {"n": 9, "q": "How are in-progress asynchronous snapshot transfers monitored from the UI ?", "o": {"A": "From the replication target", "B": "From either the replication source or target", "C": "From the replication source"}, "a": "B", "e": [["p", "Les transferts asynchrones en cours peuvent être suivis depuis la baie source (transferts sortants) comme depuis la baie cible (transferts entrants), dans l'interface de gestion de chacune."]], "t": "ActiveCluster & ActiveDR"}, {"n": 10, "q": "A FlashArray//C R4 has ports Eth0 and Eth1 connected to a switch using 100Gb/s Direct Attach Copper (DAC) cables. The administrator is unable to configure these ports for iSCSI services. Why is this occurring ?", "o": {"A": "The ports are designated for Management connectivity", "B": "The DAC cables are not compatible with the array's ports", "C": "The ports are designated for DirectFlash Shelf connectivity"}, "a": "C", "e": [["p", "Le guide **FlashArray//C** R4(b) confirme cette réponse (**Port Usage and Definitions**). Table des ports LOM par contrôleur : ETH0 et ETH1 (100G) ont pour service par défaut « DirectFlash Shelf » ; ETH2 et ETH3 (10/25G) servent à la réplication ou au SAN (iSCSI, NVMe-RoCE, NVMe-TCP) ; ETH4 et ETH5 (1G) servent à la gestion. Le guide précise que les ports ETH0 et ETH1 sont des ports QSFP dédiés à la connectivité des DirectFlash Shelf (formulation reprise pour la //CR5), et que par défaut un seul service est affecté à chaque interface. Les configurations de base //C50R4, //C70R4 et //C90R4 comportent « 2 x QSFP DirectFlash shelf ports ». Les ports ETH0/ETH1 ne sont donc pas des ports de services hôtes : on ne peut pas les configurer pour iSCSI, même s'ils sont physiquement reliés à un switch avec des câbles DAC 100 Gb. Les ports hôtes iSCSI de la //C R4 sont ceux des cartes d'extension Ethernet (par exemple la carte 4 ports 10/25G livrée en configuration de base iSCSI) et, pour le 10/25G, les ports ETH2/ETH3 réservés par défaut à la réplication. À noter : la //C50R4 ne prend pas en charge les DirectFlash Shelf (réservés aux //C70R4 et //C90R4), mais ses ports ETH0/ETH1 restent des ports QSFP dédiés aux shelves."]], "t": "Matériel & réseau"}, {"n": 11, "q": "An administrator is running commands to verify NVMe/TCP connectivity from the hosts to the FlashArray. They use the command ping -M do -s 8972 from the initiator and it fails. What should the administrator do to resolve the issue ?", "o": {"A": "Engage support to enable NVMe/TCP services", "B": "Check the MTU of 9000 is set on each hop to the FA", "C": "Run the command from the target"}, "a": "B", "e": [["p", "Le test « ping -M do -s 8972 » envoie un paquet de 8972 octets avec le bit « Don't Fragment » (8972 + 28 octets d'en-têtes = 9000). Il échoue si un saut du chemin n'est pas en MTU 9000. Il faut donc vérifier le MTU sur chaque équipement entre l'hôte et la FlashArray, conformément aux recommandations du guide pour NVMe/TCP."]], "t": "Matériel & réseau"}, {"n": 12, "q": "Pure Protect //DRaaS is configured with a Business Policy to back up data to AWS. An administrator, with DRaaS Global Admin access, is trying to delete the policy but is unable to do so. What is restricting the administrator from deleting the policy ?", "o": {"A": "Application groups are currently protected under that policy", "B": "The Business Policy is marked as the Primary Policy", "C": "The administrator also needs DRaaS Cloud Admin access"}, "a": "A", "e": [["p", "Une Business Policy de Pure Protect //DRaaS ne peut pas être supprimée tant que des groupes d'applications y sont protégés. Il faut d'abord les réaffecter à une autre politique ou les retirer de la protection."]], "t": "ActiveCluster & ActiveDR"}, {"n": 13, "q": "What should an administrator configure when setting up device-level access control in an NVMe/TCP network ?", "o": {"A": "VLANs", "B": "NQN", "C": "LACP"}, "a": "B", "e": [["p", "En NVMe/TCP, le contrôle d'accès au niveau du périphérique repose sur les NQN (NVMe Qualified Name). On ajoute le NQN de l'hôte à un objet hôte (ou groupe d'hôtes) de la FlashArray, puis on y connecte les volumes."]], "t": "Matériel & réseau"}, {"n": 14, "q": "A storage administrator is tasked with providing real-time data and alerts to the Network Operations Center (NOC) dashboard. What source should the information come from to provide real-time data ?", "o": {"A": "Pure Performance Monitoring", "B": "Pure1", "C": "FlashArray"}, "a": "C", "e": [["p", "Pour des données et alertes en temps réel (tableau de bord NOC), la source doit être la FlashArray elle-même (API REST, SNMP, syslog). Pure1 agrège les données dans le cloud, avec un délai."]], "t": "Pure1 & supervision"}, {"n": 15, "q": "Where can a snapshot be copied out to ?", "o": {"A": "A new volume or existing volume", "B": "A new volume or new Snapshot", "C": "An existing volume or new Snapshot"}, "a": "A", "e": [["p", "Une snapshot peut être copiée vers un nouveau volume ou vers un volume existant qu'elle écrase. La snapshot source reste inchangée dans les deux cas."]], "t": "Protection & SafeMode"}, {"n": 16, "q": "What is the proper procedure for stopping asynchronous replication and in-progress transfers ?", "o": {"A": "Removing the volume member from a protection group", "B": "Disabling the replication schedule", "C": "Disallowing the protection group at the target"}, "a": "C", "e": [["p", "Pour arrêter la réplication asynchrone sur la cible, on interdit (« disallow ») le groupe de protection. Le document **Purity//FA Administration Guide 6.10.4** précise que, si une session de réplication est déjà en cours, Purity//FA **attend que cette session soit terminée**, puis empêche la création de nouvelles sessions de réplication. Il ne s'agit donc pas d'interrompre brutalement le transfert en cours."]], "t": "ActiveCluster & ActiveDR"}, {"n": 17, "q": "What are the two types of FA File quota limits ?", "o": {"A": "File and Block", "B": "Limited and Unlimited", "C": "Enforced and Unenforced"}, "a": "C", "e": [["p", "FA File gère des quotas « Enforced » (appliqués, limite stricte) et « Unenforced » (non appliqués, utilisés pour la notification et le suivi). Confirmation par le guide **FlashArray File Services** (politiques de quotas) : chaque règle de quota est soit « enforced » (limite stricte : l'usage ne peut plus augmenter et les écritures échouent avec une erreur « out of space »), soit « unenforced » (seuil servant uniquement aux notifications, qui n'empêche pas les écritures). Une politique ne peut contenir qu'une seule limite enforced mais plusieurs limites unenforced, lesquelles doivent être inférieures ou égales à 80 % de la limite enforced si elle existe."]], "t": "File Services"}, {"n": 18, "q": "What is the purpose of a Protocol Endpoint volume ?", "o": {"A": "It allows for volumes of the same name within host groups", "B": "It serves as a mount point for vVols", "C": "It is required to set Host Protocol"}, "a": "B", "e": [["p", "Un Protocol Endpoint (PE) est le point d'accès logique par lequel les hôtes ESXi atteignent les vVols (VMware Virtual Volumes) ; ce n'est pas un volume de données. Le **User Guides for VMware Solutions** le confirme : pour monter le datastore vVol, on connecte d'abord le Protocol Endpoint de la FlashArray (pure-protocol-endpoint) aux hôtes ESXi en FC ou iSCSI, puis on monte le datastore vVol. Le plugin vSphere combine ces deux opérations et connecte automatiquement le PE au groupe d'hôtes s'il ne l'est pas."]], "t": "VMware & vVols"}, {"n": 19, "q": "An On-Premises ActiveCluster (AC) Mediator is installed on an ESXi server. The mediator was previously online but when the administrator checked the status of the ActiveCluster (AC) pods the mediator status was listed as \"unreachable\" for both FlashArrays in the ActiveCluster (AC) pair. What is a possible cause of the mediator being unreachable from both FlashArrays ?", "o": {"A": "Fibre Channel (FC) zoning or network access has not been created properly for the host", "B": "The mediator does not reside within a Pure datastore", "C": "Outbound TCP port 80 is not allowed from the FlashArrays"}, "a": "C", "e": [["p", "Les baies ActiveCluster doivent joindre le médiateur sur site (VM déployée dans un troisième site) via le réseau, depuis leurs ports de gestion. Le guide **FlashArray ActiveCluster** le confirme : les baies doivent pouvoir accéder au médiateur sur le port 80. Un flux sortant bloqué (option C) explique donc un statut « unreachable » constaté depuis les deux baies. Pour tester, on peut exécuter depuis la baie : `curl http://<IP-du-médiateur>/mediator/1.0/ping`, qui doit répondre « Pong! ». Le même guide exige au contraire que le datastore du médiateur ne soit pas hébergé sur une FlashArray qui dépend de ce médiateur. Complément (alerte 122, « ActiveCluster Mediator is Offline ») : le **Purity//FA Administration Guide 6.10.4** indique que la cause la plus fréquente est une perturbation réseau entre la baie et le médiateur, que Purity contacte automatiquement le médiateur toutes les cinq minutes, et que la première étape consiste à vérifier l'environnement réseau. Un flux sortant bloqué (C) correspond à cette cause."]], "t": "ActiveCluster & ActiveDR"}, {"n": 20, "q": "If an NFS client can mount the FA File export shares with the IP address, but not the fully qualified domain name, what is most likely causing the issue ?", "o": {"A": "Issue with the Active Directory (AD) controller", "B": "Issue with the DNS", "C": "Issue with the OpenLDAP"}, "a": "B", "e": [["p", "Si le montage NFS fonctionne avec l'adresse IP mais pas avec le FQDN, le problème vient de la résolution de noms, donc du DNS (serveur, enregistrement manquant ou configuration du client). Recoupement avec le **FlashArray File Services** : les clients montent les exports avec l'adresse IP du VIF « ou le nom DNS correspondant ». Le guide précise que, pour utiliser un FQDN, l'adresse IP du file VIF doit être déclarée dans le DNS (enregistrement A) et que la résolution inverse est également requise pour Kerberos. Un montage qui réussit par IP écarte le réseau, le VIF et la politique d'export ; seule la résolution de noms est en cause."]], "t": "File Services"}, {"n": 21, "q": "Which command provides the negotiated port speed of an ethernet port ?", "o": {"A": "pureport list", "B": "purenetwork eth list --all", "C": "purehw list --all --type eth"}, "a": "C", "e": [["p", "La commande purehw list affiche l'état des composants matériels. Avec le filtre « --type eth », elle liste les ports Ethernet (CT0.ETH0, CT0.ETH1, ...) avec les colonnes Status, Identify, Slot, Index, Speed et Temperature : la colonne Speed donne la vitesse négociée du lien. Le **FlashArray//XR4 Service Guide 50-0033-11** l'utilise précisément pour diagnostiquer un câble DirectFlash : un port avec une vitesse de 0.00 b/s et le statut « disconnected » indique un câble ou un lien défaillant, alors qu'un port fonctionnel affiche sa vitesse (par exemple 50.00 Gb/s). À l'inverse, « purenetwork eth list » présente la configuration réseau logique (adresses IP, masque, MTU, services) et « pureport list » concerne les ports des cibles hôtes. La réponse C est donc la bonne. Confirmation par le guide **Purity//FA Alerts** : le dépannage d'une interface de réplication demande de « vérifier la santé avec purehw list --all --type \\[eth/fc\\] » et de contrôler que le Status est « ok » et que la Speed n'est pas 0.00 b/s ; un exemple de sortie montre CT0.ETH0 à 1.00 Gb/s et CT0.ETH1 à 0.00 b/s, interprété comme un problème de câble."]], "t": "Matériel & réseau"}, {"n": 22, "q": "What is the proper configuration method to connect a volume to multiple hosts ?", "o": {"A": "Connect the volume to a host group", "B": "Connect a volume group to the host", "C": "Connect the volume to each individual host"}, "a": "A", "e": [["p", "Pour donner accès à un même volume à plusieurs hôtes, on le connecte à un groupe d'hôtes (host group) contenant ces hôtes : l'accès est cohérent et le LUN ID est identique pour tous les membres."]], "t": "Hôtes, volumes & admin"}, {"n": 23, "q": "An administrator is setting up FA File using the FlashArray GUI. The company is an NFS only shop and needs to configure their remote user authentication. Which of the following GUI locations should the administrator use to configure access ?", "o": {"A": "Settings Access Create Active Directory Account", "B": "Settings Access Directory Services", "C": "Settings Access File System"}, "a": "B", "e": [["p", "Pour une authentification distante en NFS seul (LDAP/NIS), on configure Settings \\> Access \\> Directory Services. Le guide « **Directory Services on FlashArray** » (Purity 5.3.x et ultérieur) montre que la section Directory Service comporte deux onglets, « Array Management » (service nommé management, pour l'administration de la baie) et « Data » (service nommé data, utilisé pour l'intégration avec un serveur LDAP côté fichiers : « pureds setattr data ... » puis « pureds enable data »). Le **guide Purity//FA Administration** précise que le service « data » est réservé aux utilisateurs de fichiers et permet aux utilisateurs LDAP d'accéder aux exports NFS en AUTH_SYS. Recoupement avec le **FlashArray File Services** : LDAP (OpenLDAP) n'est pris en charge que pour NFS (AUTH_SYS) et ne peut pas être combiné avec Active Directory, alors que la création d'un compte Active Directory (Settings \\> Access \\> Users and Policies / Active Directory Accounts) sert à l'authentification SMB et NFS via AD ; A ne correspond donc pas à un site NFS seul avec authentification distante LDAP. C (File System) n'est pas un emplacement de configuration d'authentification."]], "t": "File Services"}, {"n": 24, "q": "An administrator is attempting to add a volume to a volume group but it does not show up in the list of volumes available to move in, even though it does show up in the volumes pane. Why is the volume missing ?", "o": {"A": "It is already part of another volume group", "B": "It is already part of a Protection Group", "C": "It is protected by SafeMode"}, "a": "A", "e": [["p", "Un volume ne peut appartenir qu'à un seul groupe de volumes (volume group) à la fois ; il n'apparaît donc pas dans la liste s'il est déjà membre d'un autre groupe."]], "t": "Hôtes, volumes & admin"}, {"n": 25, "q": "An application engineer reports seeing high latency in their application running in a VMware instance. What is the best method to determine the source of the latency ?", "o": {"A": "Analyze performance in the VM Topology in Pure1 for each component in the user's data path", "B": "Analyze performance charts in vSphere for CPU, Memory, Network, and Storage Path for the user's data path", "C": "Analyze load metrics in Pure1 for each volume in the user's data path"}, "a": "A", "e": [["p", "Le VM Topology de Pure1 donne une vue de bout en bout du chemin de données (VM, datastore, hôte ESXi, volume) avec les métriques, dont la latence, à chaque niveau. C'est la méthode la plus efficace pour localiser la source de la latence."]], "t": "Pure1 & supervision"}, {"n": 26, "q": "A storage administrator is configuring a new volume and wants to provision 500GB. If the administrator accidentally selects PB, what will happen ?", "o": {"A": "The volume will be created and space will immediately be used", "B": "The volume will be created but a warning will be displayed", "C": "The volume will not be created and a warning will be displayed"}, "a": "C", "e": [["p", "Les volumes FlashArray sont **thin-provisioned** : la création d’un volume ne consomme pas immédiatement une quantité équivalente de capacité physique. Cela ne signifie toutefois pas que la taille logique d’un volume est illimitée. La documentation **FlashArray Capacity and Feature Limits** fixe, pour les modèles concernés, une **taille maximale de volume de 4 PB**. Ainsi, une valeur de **500 PB** dépasse largement la limite autorisée : le volume ne peut pas être créé et l’interface signale l’erreur correspondante."], ["p", "**Point de vigilance :** il faut distinguer le **thin provisioning** (absence de consommation physique immédiate à la création) de la **taille maximale autorisée d’un volume**. Le premier n’annule pas le second."]], "t": "Capacité & espace"}, {"n": 27, "q": "A customer with an X50R2 array connected to 110V power is due for an upgrade to the latest controller generation. What is required to allow this upgrade to proceed ?", "o": {"A": "Call support to schedule a power supply replacement", "B": "Transition the array to DC power", "C": "Switch the array to 220v power outlets"}, "a": "C", "e": [["p", "Le guide **de mise à niveau intra-série //XR2 et //XR3 (40-0157-11)** (« Confirm Power Input ») exige200 ou 240 VAC pour passer d'une //X50R2 (ou //X10/X20 R2/R3) alimentée en 120 VAC vers une //X50R3, //X70 ou //X90 ; sinon on ne poursuit pas la mise à niveau. Le guide **des spécifications techniques //XR4 (50-0035-13)** indique que les //X50R4, //X70R4 et //X90R4 fonctionnent uniquement en haute tension (180-264 V) ; seule la variante « //X20R4 Low-Line » accepte aussi la basse tension (90-140 V). (3) Le Service **FlashArray//XR4 Service Guide 50-0033-11** demande une alimentation AC de 200-240 V, 50-60 Hz. Il faut donc basculer la baie sur des prises 220 V (200-240 V) avant la mise à niveau."]], "t": "Matériel & réseau"}, {"n": 28, "q": "A FlashArray//XL is used for NVMe-RoCE services. The array has been lightly loaded and has performed as expected. A new workload has been added to the array, which is within the array's performance envelope. The change has resulted in extreme latency and service outages for all workloads utilizing NVMe-RoCE. Which misconfiguration is this a symptom of ?", "o": {"A": "NVMe-RoCE is not supported by the new workload", "B": "Priority Flow Control (PFC) is not configured properly", "C": "The ports are configured with NVMe-RoCE and Replication concurrently"}, "a": "B", "e": [["p", "Selon le **Purity//FA Administration Guide 6.10.4**, que NVMe/RoCE exige une fabric sans perte et que le **Priority Flow Control (PFC)** doit être activé et correctement configuré, notamment sur les files utilisées par le trafic NVMe/RoCE. Une mauvaise configuration du PFC peut donc provoquer congestion,pertes, forte latence et interruptions lorsque la charge augmente."]], "t": "ActiveCluster & ActiveDR"}, {"n": 29, "q": "Twelve stretched pods are synchronously replicating between an ActiveCluster (AC) FlashArray pair. A new unstretched pod is created and then is stretched, but the operation fails. What is the most likely cause of the operation not completing successfully ?", "o": {"A": "There is a pod that was deleted and not eradicated", "B": "The mediator is not available on the FlashArray that the pod is being stretched to", "C": "The ActiveCluster (AC) pair has reached its stretch pod limit"}, "a": "C", "e": [["p", "Selon le guide **FlashArray ActiveCluster**, le nombre de pods sur la baie et le nombre de pods pouvant être étirés varient en fonction du modèle de FlashArray et la version de Purity (documents «FlashArray Capacity and Feature Limits » / « Replication Limits »). Atteindre la limite de pods étirés est donc la cause la plus probable de l'échec. Les affirmations de l'explication d'origine sur l'évolution des limites par version, non étayées, ont été retirées. À noter le guide ne cite pas de limite fixe de 12 pods ; la limite de 1500 volumes étirés(Purity 5.0.x à 5.3.x) concerne les volumes, pas les pods. Complément (alerte 233, « Total or Stretched Pods are at X Percent of Limit ») : le guide **Purity//FA Alerts** indique qu'une fois la limite atteinte, aucun nouveau pod ne peut être créé ; l'action suggérée est de supprimer l'étirement (« unstretch ») des pods inutiles, et les limites sont à consulter dans la base de connaissances « FlashArray Limits ». L'exemple de l'alerte affiche d'ailleurs « Used: 10, Limit: 12 », valeur cohérente avec les douze pods de la question, mais il s'agit d'un exemple : la limite réelle dépend du modèle et de la version de Purity. A et B sont écartées : un pod détruit non éradiqué n'est pas cité comme cause, et un médiateur indisponible ferait échouer d'autres opérations avec un autre message."]], "t": "ActiveCluster & ActiveDR"}, {"n": 30, "q": "Which storage protocol is best suited for a Hyper-V cluster in an ethernet-switched environment ?", "o": {"A": "NVMe/FC", "B": "NVMe/RoCE", "C": "iSCSI"}, "a": "C", "e": [["p", "Pour un cluster Hyper-V sur réseau Ethernet commuté, iSCSI est le protocole de bloc le plus adapté : il fonctionne sur une infrastructure Ethernet standard, avec le Microsoft iSCSI Initiator et MPIO, et permet d'utiliser les Cluster Shared Volumes (CSV)."]], "t": "Matériel & réseau"}, {"n": 31, "q": "A storage administrator is troubleshooting multipathing issues. What is the CLI command that allows the administrator to sample the I/O balance information at a consistent interval ?", "o": {"A": "purehost monitor --balance --interval 15 --repeat 5", "B": "purehost monitor --balance --resample 5 -", "C": "purehost monitor --balance --interval 15"}, "a": "A", "e": [["p", "Le **Purity//FA Administration Guide 6.10.4**, l'option `--balance` affiche les informations d'équilibrage des E/S ; `--interval` définit l'intervalle entre les mises à jour et `--repeat` le nombre de répétitions. Pour effectuer plusieurs échantillonnages réguliers, les deux options doivent donc être utilisées, ce qui correspond à `purehost monitor --balance --interval 15 --repeat 5`."]], "t": "Hôtes, volumes & admin"}, {"n": 32, "q": "What is unified storage for Pure ?", "o": {"A": "FlashArray runs both NFS and SMB protocols", "B": "FlashArray runs both Block and File level protocols", "C": "FlashArray runs both iSCSI and Fibre Channel (FC) protocols"}, "a": "B", "e": [["p", "L'« unified storage » de Pure désigne une FlashArray qui sert à la fois des protocoles de bloc (FC, iSCSI, NVMe-oF) et de fichier (NFS, SMB) depuis une seule plateforme. Le guide **FlashArray File Services** emploie explicitement l'expression « unified block-and-file » : le fichier (NFS et SMB) est fourni par la même FlashArray que le bloc, avec les mêmes interfaces GUI, CLI et REST API et les mêmes services de données (snapshots, réplication, réduction de données)."]], "t": "File Services"}, {"n": 33, "q": "In Pure Protect //DRaaS, the administrator modified the business policy used for backups, reducing the \"DR Retention\" from 7 days to 3 days. The DR target environment currently has 7 days of backups. What will occur ?", "o": {"A": "The change will error out, requiring manual expiration of backups older than 3 days", "B": "Earlier backups will be erased to match the modified policy", "C": "Earlier backups will be retained until they expire according to the pre-modification policy, with new backups following the updated policy"}, "a": "B", "e": [["p", "Dans Pure Protect //DRaaS, la réduction de la rétention DR (7 → 3 jours) entraîne la suppression des sauvegardes qui dépassent la nouvelle rétention. Le **FASP Study Guide** fournit explicitement cette question avec la réponse B. L'explication d'origine parlait de snapshots FlashArray, ce qui était inexact pour une sauvegarde DRaaS dans le cloud."]], "t": "ActiveCluster & ActiveDR"}, {"n": 34, "q": "The SNMP protocol can be used to monitor what statistics of the array's performance ?", "o": {"A": "Latency, bandwidth, IOPS", "B": "Host and volume performance", "C": "Available and used capacity"}, "a": "A", "e": [["p", "Le MIB SNMP de la FlashArray expose notamment les statistiques de performance de la baie (latence, bande passante, IOPS), ce qui répond à la question. Il remonte aussi des informations de capacité, mais pas de performance par hôte ou par volume. Le guide **Purity//FA Alerts** présente SNMP uniquement comme canal de notification des alertes (traps envoyés à des gestionnaires SNMP, avec l'e-mail et le syslog distant), il ne décrit aucun objet de performance du MIB."]], "t": "Pure1 & supervision"}, {"n": 35, "q": "How would a FlashArray administrator view external latency for write requests for a specific volume ?", "o": {"A": "Analysis; Performance; Volumes; Select the appropriate volume; Select \"Write\" and Deselect \"Read\" and \"Mirrored Write\"", "B": "Health; Network; Select the appropriate protocol; Select the appropriate port", "C": "Storage; Volumes; Select the appropriate volume; Details"}, "a": "A", "e": [["p", "Pour afficher la latence externe des écritures d'un volume : Analysis \\> Performance \\> Volumes, on sélectionne le volume, puis on ne garde que « Write » en désélectionnant « Read » et « Mirrored Write ». Le guide **Purity//FA Administration** précise que les graphiques de la page Analysis incluent la latence interne et le SAN Time, et peuvent être filtrés par type d'E/S (Read, Write, Mirrored Write), contrairement au Dashboard qui n'affiche que la latence interne."]], "t": "Pure1 & supervision"}, {"n": 36, "q": "Which of the following statements regarding REST APIv1 and REST APIv2 is true ?", "o": {"A": "REST API 1.x will no longer continue to receive feature enhancements for new Purity features", "B": "REST API 2.x has not yet reached feature parity with REST API 1.x", "C": "REST API 1.x and REST API 2.x operations are not supported side by side, support must be contacted to upgrade to REST API 2.x"}, "a": "A", "e": [["p", "L'API REST 2.x reçoit toutes les nouvelles fonctionnalités ; la 1.x est en maintenance et n'évolue plus pour les nouvelles fonctions de Purity//FA. Les deux versions peuvent être utilisées en parallèle, ce qui permet de migrer progressivement les scripts."]], "t": "Hôtes, volumes & admin"}, {"n": 37, "q": "A FlashArray administrator has created a 1PB volume and wants to resize it to 1TB, but accidentally sets the new size to 1GB. How can the administrator recover the potentially truncated data ?", "o": {"A": "Copy from the auto-generated destroyed snapshot", "B": "Create a snapshot of the current volume and restore data from the copy", "C": "Revert the volume to the original size"}, "a": "A", "e": [["p", "Quand un volume est réduit, Purity//FA crée automatiquement une snapshot de protection à la taille d'origine, placée directement dans les éléments détruits (période d'éradication en attente). On la récupère en la restaurant vers un nouveau volume puis en copiant les données voulues. Le guide rappelle que la troncature est immédiate et irréversible : seule cette snapshot permet la récupération."]], "t": "Hôtes, volumes & admin"}, {"n": 38, "q": "An engineer is tasked by the IT security team to pull audit trail logs from the last month. The engineer navigates to the audit trail section of the FlashArray GUI, but sees the audit trail only contains a maximum of 1000 records. What step should the engineer take ?", "o": {"A": "Use the CLI, as it has the ability to specify a date range for logs", "B": "Log in to Pure1 to access historical audit trail items", "C": "Update the Purity tunable on the array to increase the audit trail data"}, "a": "B", "e": [["p", "Les **Audit Logs** de FlashArray, qui enregistrent les opérations effectuées via la GUI, la CLI ou l’API REST pour modifier la configuration de la baie, sont intégrés au **Log Center de Pure1**. Le Log Center fournit une visibilité centralisée sur les journaux d’audit et de session de la flotte, avec notamment des fonctions de **recherche et de filtrage**."], ["p", "Pour rechercher des événements anciens, par exemple sur **le dernier mois**, l’administrateur doit donc utiliser **Pure1 → Log Center**, plutôt que chercher à augmenter la quantité d’historique affichée localement dans la GUI de FlashArray."], ["p", "La documentation fournie confirme le rôle du Log Center pour l’historique d’audit, mais **ne documente pas explicitement le chiffre de 1000 enregistrements** comme limite de l’interface locale, ni une durée de rétention spécifique. La réponse B reste néanmoins celle qui correspond à l’architecture documentée et à la question posée."]], "t": "Pure1 & supervision"}, {"n": 39, "q": "How is SAN Time measured ?", "o": {"A": "Average time, measured in microseconds, required to transfer data between the initiator and the array", "B": "Average time, measured in microseconds, that an IO request spends waiting to synchronize to the peer array", "C": "Average time, measured in microseconds, that an I/O request spends in the array waiting to be served"}, "a": "A", "e": [["p", "Le SAN Time est le temps moyen nécessaire pour transférer les données entre l'initiateur et la baie (définition du guide : « SAN us/op », exprimé en microsecondes dans l'interface). Des transferts lents augmentent le SAN Time. Il n'est pas inclus dans la latence interne affichée au Dashboard, mais il l'est dans les graphiques de la page Analysis. Le **Authorized Support Partner (ASP) Handbook** (Analyzing Latency) donne la même définition : le SAN time est le temps de transfert des données entre le ou les initiateurs et la baie, et des transferts lents sur le SAN augmentent le SAN time. Il distingue aussi le « Queue time » (délai entre le début de l'interruption et l'allocation du buffer, élevé lorsque la charge dépasse la capacité de traitement de la baie) et le « Service time » (traitement par Purity, y compris l'attente de prise en charge)."]], "t": "Hôtes, volumes & admin"}, {"n": 40, "q": "What is indicated by the Fibre Channel (FC) hosts in the following output ?", "o": {"A": "Host multipathing detected a failed path and redirected workloads", "B": "Hosts connected to CT1 are experiencing an outage", "C": "CT1 port WWNs are being presented via CT0"}, "a": "C", "e": [["p", "La commande `pureport list --initiator` permet d’associer un initiateur FC aux ports cibles de la FlashArray. Dans l’exhibit, le même initiateur est vu sur quatre ports cibles : `CT0.FC0`, `CT0.FC1`, `CT1.FC0` et `CT1.FC1`. Les WWN `...E3:10` et `...E3:11` correspondent aux ports FC de **CT1**, alors que la présentation observée dans l’exhibit indique qu’ils sont actuellement présentés via **CT0**."], ["p", "L’information directement déduite de la sortie est donc que **les WWN des ports de CT1 sont présentés via CT0**, ce qui correspond à la réponse C. La documentation fournie confirme par ailleurs l’usage de `pureport list --initiator` pour examiner les connexions FC des hôtes."], ["p", "**Point de vigilance :** il ne faut pas extrapoler à partir de cet exhibit seul que **CT1 est nécessairement en panne** ou qu’un problème MPIO précis s’est produit. Ces éléments ne sont pas démontrés par la sortie elle-même."]], "t": "Matériel & réseau", "x": "sortie de type `pureport list --initiator` avec un initiateur, WWN `21:00:00:24:FF:46:82:C2`, vu sur quatre ports cibles : `CT0.FC0` (`52:4A:93:78:55:2D:E3:00`), `CT0.FC1` (`...E3:01`), `CT1.FC0` (`...E3:10`) et `CT1.FC1` (`...E3:11`)."}, {"n": 41, "q": "An administrator is preparing an array pair for ActiveDR and is trying to calculate the total minimum bandwidth requirement. What percent of bandwidth above the incoming write rate should be allocated to accommodate for unexpected write bursts and still maintain near-sync RPO ?", "o": {"A": "10%", "B": "50%", "C": "30%"}, "a": "C", "e": [["p", "Confirmé par la **ActiveDR Technical Bulletin TB-200501** : pour les liaisons réseau partagées, Pure recommande que la bande passante disponible soit supérieure de 30 % au débit d'écriture entrant sur la baie source. Cette marge absorbe les pointes d'écriture et la consommation des checkpoints de journal et de leurs acquittements. Sans elle, le retard (lag) augmente et peut dépasser le seuil d'alerte (plus de 30 secondes pendant plus de 5 minutes) ; en cas de pointes extrêmes ou d'interruption, la réplication reprend par la procédure de bootstrap. L'explication d'origine parlait d'un passage « en mode asynchrone », ce qui n'est pas décrit ; cette mention a été retirée. Complément (alerte 182, « Pod Replica Link Excessive Lag ») : le guide **Purity//FA Alerts** confirme le seuil d'alerte évoqué plus haut : le retard du lien de réplica dépasse 30 secondes pendant 5 minutes. L'action suggérée est de vérifier la bande passante réseau entre la baie source et la baie cible, ce qui justifie la marge de 30 % prévue au dimensionnement."]], "t": "ActiveCluster & ActiveDR"}, {"n": 42, "q": "An administrator is testing FA File Services configurations and unintentionally disabled UserMapping on an active NFS Export. What happens to file accessibility on that export ?", "o": {"A": "The changes to authentication will not be applied until the export is restarted", "B": "The export will lose accessibility to all existing files but have no issue with file creation", "C": "The export will retain accessibility to all existing files but new files can not be created"}, "a": "B", "e": [["p", "Le guide **FlashArray File Services** décrit le paramètre « NFS User Mapping » des politiques d'export. Activé (valeur par défaut), les UID/GID présentés par le client doivent correspondre à des comptes Active Directory, LDAP ou à des utilisateurs locaux de la baie. Désactivé (option --disable-user-mapping, Purity//FA 6.3.3 et ultérieur), la baie fait confiance aux UID/GID envoyés par le client en AUTH_SYS, sans aucune consultation de l'annuaire. Le guide met en garde : il est déconseillé de désactiver le user mapping sur un export où il était utilisé, car les fichiers et répertoires existants peuvent devenir inaccessibles (ACL qui référencent des SID issus d'UID/GID mappés). La création de nouveaux fichiers reste possible, puisque les identités du client sont acceptées telles quelles."]], "t": "File Services"}, {"n": 43, "q": "An ActiveCluster (AC) FlashArray pair lost connectivity with each other over the replication network. When the pod failover occurred, a single volume in the stretched pod lost connectivity to its host while other volumes in the stretched pod remained available to the host. What is the most likely cause of the loss of stretched volume connectivity from the host ?", "o": {"A": "Uniform volume access was not configured for the volume from the host", "B": "Fibre Channel (FC) zoning or network access has not been created properly for the host", "C": "The host initiators were not registered in Purity for the host"}, "a": "A", "e": [["p", "l'alerte 10006. («Stretched Volumes with no Remote Hosts ») du guide **Purity//FA Alerts** décrit exactement ce scénario. Elle est émise pour un pod étiré dans lequel (1) certains volumes ont des connexions hôtes sur la baie homologue, (2) d'autres volumes n'ont que des connexions hôtes locales (les volumes à risque) et (3) la préférence de failover du pod n'est pas définie sur cette baie. Lors d'une « race to mediator » (par exemple une coupure du réseau entre les baies), la baie qui perd la course cesse de servir les E/S ; les volumes qui n'ont que des connexions locales perdent alors toutes leurs connexions hôtes, alors que les autres volumes du pod restent disponibles via l'autre baie. C'est exactement le symptôme de la question : un seul volume perd sa connectivité, les autres volumes du pod restent accessibles. Cela correspond à la réponse A : l'accès uniforme (connexion du volume à l'hôte sur les deux baies) n'était pas configuré pour ce volume. Vérification : « purevol list --connect --remote » sur la baie concernée ; un nom d'hôte sans deux-points indique une connexion locale uniquement (les hôtes distants sont de la forme baie_distante:hôte). Remédiation (option 3 de l'alerte) : connecter le volume aux hôtes des deux baies avec « purehost connect --vol pod::volume hôte » exécuté sur chacune ; sinon, aligner les connexions de tous les volumes et définir la préférence de failover du pod avec « purepod setattr --failover-preference »."]], "t": "ActiveCluster & ActiveDR"}, {"n": 44, "q": "What FA File user authentication statement is correct ?", "o": {"A": "FA File can use either Microsoft Active Directory (AD) or OpenLDAP for authentication", "B": "FA File can use both Microsoft Active Directory (AD) and SSO for authentication", "C": "FA File can use either LDAP or SAML for authentication"}, "a": "A", "e": [["p", "FA File s'intègre à Microsoft Active Directory (SMB, Kerberos) et à OpenLDAP/LDAP (NFS, mappage des utilisateurs et groupes). Le guide **Directory Services on FlashArray** confirme que l'implémentation des services d'annuaire est prise en charge pour Windows Active Directory et OpenLDAP (389DS à partir de Purity 5.2.0), ainsi qu'avec FreeIPA. SSO et SAML ne sont pas des méthodes d'authentification FA File. Recoupement avec le guide **FlashArray File Services** : la matrice de support ne liste que Microsoft Active Directory (Windows Server 2012 et ultérieur) et OpenLDAP. Le guide précise qu'AD et OpenLDAP ne peuvent pas être utilisés ensemble (il faut choisir l'un ou l'autre), que LDAP n'est pris en charge que pour NFS (AUTH_SYS), que SMB exige Active Directory (ou des utilisateurs locaux) et que Kerberos NFS n'est pris en charge qu'avec AD. SSO et SAML n'apparaissent nulle part dans le guide. Précision : FreeIPA, cité plus haut d'après le guide Directory Services, concerne l'authentification d'administration de la baie ; il ne figure pas dans la matrice de support de FA File."]], "t": "File Services"}, {"n": 45, "q": "The administrator needs to remove a volume from a ratcheted protection group. How can this be accomplished ?", "o": {"A": "Contact Pure Storage Support to help unlock the pgroup", "B": "Unlock the pgroup by using the CLI", "C": "Go to the pgroup in the GUI and unlock the pgroup"}, "a": "A", "e": [["p", "Une fois la rétention verrouillée (« ratchet » SafeMode), le guide **Purity//FA Administration** interdit notamment le retrait de membres, la destruction du groupe ou la baisse de la rétention. Seul le support technique Pure peut déverrouiller le groupe : l'inscription (enrollment) requiert au moins deux administrateurs et des codes PIN."]], "t": "Protection & SafeMode"}, {"n": 46, "q": "What is a potential indicator of incorrect configuration on a Pure Storage FlashArray ?", "o": {"A": "Blinking status LED on the controller", "B": "CRC errors on a single port", "C": "Unusual spikes in latency or IOPS"}, "a": "B", "e": [["p", "Confirmé par l'alerte 184 (« High CRC Error Count ») du guide **Purity//FA Alerts** : un nombre croissant d'erreurs CRC sur une interface peut indiquer un problème de câble et provoquer une latence accrue et un débit réduit. Le guide cite comme causes un câble défectueux ou endommagé, une incohérence de duplex (« duplex mismatch », donc un problème de configuration) et une carte Ethernet ou une carte réseau de routeur défectueuse ; la résolution est de corriger toute mauvaise configuration et de remplacer le matériel endommagé. L'alerte est générée par interface (exemple : ct0.eth1), ce qui correspond à « un seul port »."]], "t": "Matériel & réseau"}, {"n": 47, "q": "A customer is managing a VMware environment and has recently copied a snapshot from a Pure Storage array to a new volume. When attempting to mount this volume on a VMware virtual machine, the operation fails. How should this be resolved ?", "o": {"A": "Resignature the volume", "B": "Reformat the volume", "C": "Adjust the VMware security settings"}, "a": "A", "e": [["p", "Une snapshot d'un datastore VMFS copiée vers un nouveau volume présente la même signature VMFS que l'original. ESXi refuse alors de la monter pour éviter la corruption. Il faut resignaturer le volume dans vSphere pour lui attribuer un nouvel identifiant unique. Le **User Guides for VMware Solutions** illustre cette logique : les workflows de reprise (test, reprise, failback) resignaturent systématiquement les datastores avant de les monter (préfixe « snap-XXXXXXXX- » ajouté au nom), et la fonction « Copy to New Datastore » du plugin vSphere copie une snapshot vers un nouveau volume VMFS monté sur l'hôte ou le cluster, la restauration d'un VMFS à partir d'une snapshot écrasant le volume existant puis le resignaturant."]], "t": "VMware & vVols"}, {"n": 48, "q": "A FlashArray administrator is configuring new hosts. There is an option in the personality settings for the target OS. When is the best time to configure the personality for a host in Purity ?", "o": {"A": "When a host is initially created and before volumes are connected to the host", "B": "Host personalities can be configured at any time except for the ESXi operating system", "C": "After the host has been created and volumes are connected to the host"}, "a": "A", "e": [["p", "Confirmé par le **User Guides for VMware Solutions** : la personnalité « ESXi » doit être définie sur chaque objet hôte de la FlashArray ; le plugin vSphere l'applique d'ailleurs aux hôtes créés lors de la création d'un groupe d'hôtes, et propose un bouton « FIX » si elle est absente. Le guide met en garde contre le changement en ligne : sur Purity 5.3.6 et antérieur, modifier la personnalité d'un hôte ESXi qui exécute des VM sur la baie peut causer une indisponibilité des données (déconnexion/reconnexion fabric, PDL accidentel) ; elle ne doit se faire qu'en mode maintenance. À partir de Purity 5.3.7, elle peut être définie en ligne. ESXi est justement le système pour lequel la personnalité est la plus sensible. La bonne pratique reste de la définir à la création de l'hôte, avant de connecter des volumes."]], "t": "Hôtes, volumes & admin"}, {"n": 49, "q": "An administrator wants to upgrade an Edge Services agent and sees the Gateway Update Status in the GUI showing \"Eligible (updates disallowed)\". What should the administrator do ?", "o": {"A": "Enable agent updates via cli with the command \"puresupport enable edge-agent-update\"", "B": "Remove and re-install the edge agent you want to update", "C": "Log in to the GUI as an array admin and allow Edge Agent updates"}, "a": "A", "e": [["p", "Selon le **Pure1 Manage - Troubleshooting**, À la section « Updating the Pure1 Edge Service (PES) Gateway and Agents », Everpure précise que le statut « Eligible (updates disallowed) » signifie que **Edge Agent Update est désactivé sur la baie**. Il faut vérifier que « Edge Agent Update Enabled » est à True ; si False, la procédure documentée est d'exécuter sur la FlashArray : `puresupport enable edge-agent-update`. Le guide précise également que cette activation permet les changements logiciels des agents (installation, mise à niveau et désinstallation) via Pure1."]], "t": "Matériel & réseau"}, {"n": 50, "q": "RFC2307 enables cross-protocol support for which two protocols ?", "o": {"A": "NFS, S3", "B": "S3, SMB", "C": "NFS, SMB"}, "a": "C", "e": [["p", "La RFC 2307 définit le stockage des attributs POSIX (UID, GID...) dans un annuaire LDAP, y compris Active Directory. Elle permet le mappage d'identités entre Windows (SID) et UNIX (UID/GID) et donc l'accès cohérent aux mêmes fichiers via NFS et SMB. Le **FlashArray File Services** le confirme : la RFC 2307 définit le stockage des attributs POSIX (uidNumber, gidNumber) dans Active Directory ; elle permet à la baie de traduire un SID Windows en UID/GID UNIX et inversement, afin qu'un utilisateur garde une identité et des permissions cohérentes qu'il accède au fichier en SMB ou en NFS. Elle est requise pour l'accès multiprotocole. Les seuls protocoles fichier de FA File sont NFS et SMB."]], "t": "File Services"}, {"n": 51, "q": "FlashArray sent Alert 51 - Protection Group Replication Delayed. What steps should be taken ?", "o": {"A": "Verify if there are any other open alerts, check if any other replication jobs are in progress, and verify current replication bandwidth", "B": "Check for other open alerts, verify if the replication cabling is correct, and check if Protection Group was disabled", "C": "Temporarily disconnect replication for troubleshooting, verify the size of the snapshot, and check for port errors in the FlashArray GUI"}, "a": "A", "e": [["p", "Confirmé par l'alerte 51 (« Protection Group Replication Delayed », sévérité Warning) du guide **Purity//FA Alerts**. Elle signale qu'une tâche de réplication d'un groupe de protection a tenté de démarrer mais a été retardée. Causes citées : première réplication (baseline) qui envoie toutes les données ; volume de données à répliquer trop important pour l'intervalle entre deux fenêtres ; heure planifiée trop proche du snapshot précédent ; baie partenaire inaccessible (ce qui déclenche l'alerte 46) ; autres problèmes de connexion. La tâche reste en file et démarre automatiquement dès que le retard est résorbé. Résolution décrite : (1) vérifier les autres alertes ouvertes (« puremessage list --open »), sur la source et sur la cible ; (2) vérifier si une autre tâche de réplication est déjà en cours (« purepgroup list --snap --transfer » depuis la cible) ; (3) vérifier le planning de réplication, car une fréquence trop élevée fait démarrer une tâche avant la fin de la précédente ; (4) vérifier la bande passante de réplication (GUI Analysis \\> Replication), et contacter le support si elle semble anormale. Cela correspond à la réponse A."]], "t": "ActiveCluster & ActiveDR"}, {"n": 52, "q": "An administrator needs to enable Remote Assist (RA) on Purity version 6.8.4 to facilitate remote troubleshooting. Due to security restrictions, only certain commands can be executed on the array. What type of access should the administrator grant when enabling RA ?", "o": {"A": "Elevated", "B": "Secured", "C": "Restricted"}, "a": "C", "e": [["p", "Pour limiter les actions du support pendant une session Remote Assist, on choisit le niveau d'accès « Restricted » ; par défaut, le niveau est « Elevated ». Il se règle par défaut avec « puresupport remoteassist global setattr --default-access-level restricted » ou par session avec --access-level-override. Complément (guide **Purity//FA Alerts**) : à partir de Purity//FA 6.8.4, SSH aboutit par défaut dans le « Support Shell » ; une session Remote Assist a un niveau d'accès « elevated » ou « restricted » (visible avec « puresupport remoteassist list »), et seule une session « elevated » permet de sortir du Support Shell vers bash. Pour ouvrir une session de niveau supérieur, le client lance « puresupport remoteassist connect --access-level-override elevated ». Le guide indique aussi qu'une session RA a une durée de vie de 48 heures."]], "t": "Pure1 & supervision"}, {"n": 53, "q": "What method is recommended for monitoring an array with 3rd party tools such as Prometheus and SolarWinds ?", "o": {"A": "REST API", "B": "SMI-S", "C": "SYSLOG"}, "a": "A", "e": [["p", "L'API REST est la méthode d'intégration recommandée pour superviser une baie avec des outils tiers comme Prometheus ou SolarWinds : elle expose les métriques de performance, de capacité et d'état matériel. (Pure fournit aussi un exportateur OpenMetrics pour Prometheus, qui s'appuie sur cette API.) Recoupement (revue File Services et Pure1) : le guide File Services indique que les métriques de performance sont disponibles via l'API REST pour l'intégration à des systèmes de supervision tiers (exemples cités : Grafana et Nagios), ce qui va dans le sens de la réponse A. Le document **Pure1 Manage - Log Center** décrit des intégrations OpenTelemetry (Splunk, Elastic, Datadog) pour les journaux, pas pour les métriques. Complément (guide **Purity//FA Alerts**) : les alertes sont diffusées par e-mail, traps SNMP, syslog distant, GUI/CLI et Pure1."]], "t": "Pure1 & supervision"}, {"n": 54, "q": "What is the best practice for configuring VMFS UNMAP for ESXi 6.7 or later ?", "o": {"A": "Set it to Fixed at 500MB/s", "B": "Set it to Auto with High Priority", "C": "Set it to Auto with Low Priority"}, "a": "C", "e": [["p", "Pour VMFS 6 sur ESXi 6.7 et ultérieur, la bonne pratique est de laisser le UNMAP automatique activé avec une priorité faible (« Low »), afin de récupérer l'espace en arrière-plan sans impact sur les E/S de production. Le **User Guides for VMware Solutions** confirme partiellement : il recommande VMFS 6 pour sa récupération d'espace automatique (« automatic space reclamation ») et précise que le UNMAP est à activer (VMFS 6) ou à lancer manuellement (VMFS 5) quand la réduction totale dépasse l'espace VMFS utilisé. Il décrit aussi l'exécution à la demande ou planifiée via le plugin vSphere, de préférence en période de faible charge."]], "t": "VMware & vVols"}, {"n": 55, "q": "How should an administrator configure initiator-to-target connections for zones with multiple initiators ?", "o": {"A": "Multiple initiator to multiple target zone sets", "B": "Single initiator to multiple target zone sets", "C": "Single target to multiple initiator zone sets"}, "a": "B", "e": [["p", "La bonne pratique de zonage FC est « Single Initiator, Multiple Targets » : une zone par port initiateur, contenant les ports cibles de la FlashArray. Cela limite la portée des RSCN et empêche les hôtes de communiquer entre eux."]], "t": "Hôtes, volumes & admin"}, {"n": 56, "q": "The Load Meter in the Pure1 GUI shows a consistently high workload, averaging a 90% load over the past hour. The array also has high space usage of 85%. What is the expected result ?", "o": {"A": "The FlashArray will use QoS to limit impact of incoming IO to verify system processes are functioning for health of array", "B": "The FlashArray will limit Space Reclamation and Space Reporting on array", "C": "The FlashArray will prioritize Space Reclamation so array does not exceed 90% full"}, "a": "B", "e": [["p", "Confirmée par le **Authorized Support Partner (ASP) Handbook** et cohérente avec le guide Purity//FA 6.10.4 : lorsque la baie est à ses limites, GC et Space Reporting ne sont pas prioritaires ; les lectures et écritures le sont, sauf au-dessus de 100 % de remplissage GUI. (1) Section «Reviewing Workload and Load Meter » : la charge de travail a un impact direct sur l'espace et son reporting ; si la baie est à ses limites, la récupération d'espace (GC) et le reporting d'espace ne sont pas priorisés, le système priorisant avant tout les lectures et les écritures. Seule exception : une baie au-dessus de 100 % de remplissage GUI. (2) Section « Reviewing the Load Meter » : une valeur du Load Meter supérieure à 90 % indique que la charge peut pousser la baie trop fort. Ici, la charge moyenne est de 90 % et l'espace de 85 % (inférieur à 100 %) : l'exception ne s'applique pas, donc la récupération d'espace et le reporting d'espace sont limités, ce qui correspond à l'option B. C'est cohérent avec le **FlashArray Space** (Q6, Q63, Q64) : une baie très remplie et très sollicitée est le scénario qui fait apparaître l'espace système."]], "t": "Pure1 & supervision"}, {"n": 57, "q": "An on-premises mediator has been deployed. When a pod is stretched and replicating, it is observed that the pod is utilizing the Pure1 Cloud Mediator and not the on-premises mediator. Why is the on-premises mediator NOT being used by this new pod ?", "o": {"A": "The pod needs to be configured to use the on-premises mediator", "B": "The on-premises mediator is NOT available for the ActiveCluster FlashArrays", "C": "No A record exists for an on-premises mediator"}, "a": "A", "e": [["p", "Confirmée par le **FlashArray ActiveCluster** : le médiateur est configuré par pod, et le médiateur cloud Pure1 est le médiateur par défaut. Une seule instance de médiateur sur site peut servir tous les pods d'une baie, mais chaque pod doit être configuré pour l'utiliser, par exemple avec « `purepod setattr --mediator <adresse> <pod>` » (commande aussi utilisée pour migrer les pods vers un nouveau médiateur). Sans cette configuration, le pod continue d'utiliser le médiateur cloud. Complément (alerte 122) : pour vérifier quel médiateur un pod utilise, la commande « purepod list --mediator » affiche la valeur « purestorage » lorsque le pod utilise le médiateur cloud Pure1 ; toute autre valeur indique qu'un médiateur sur site est utilisé. C'est l'indicateur à contrôler dans le scénario de la question."]], "t": "ActiveCluster & ActiveDR"}, {"n": 58, "q": "Volume space has increased on a FlashArray and shared space decreased by the same amount. What does this indicate ?", "o": {"A": "Space reclamation fell behind", "B": "Hosts were removed", "C": "Volumes were deleted"}, "a": "C", "e": [["p", "Quand des volumes sont éradiqués, les données dédupliquées qui étaient partagées avec eux deviennent propres aux volumes restants : l'espace est reclassé de « Shared » vers « Volumes ». L'espace total ne change pas. Le guide mentionne qu'un volume peut voir sa consommation augmenter quand d'autres volumes partageant ses données sont éradiqués."]], "t": "Capacité & espace"}, {"n": 59, "q": "During testing of an NFS share, the administrator notes that they are able to mount the share as root but are not able to access files as root. Where is the incorrect setting causing the issue located ?", "o": {"A": "Managed Directory", "B": "File System", "C": "Export Policy"}, "a": "C", "e": [["p", "L'accès impossible en tant que root alors que le montage fonctionne est le symptôme du « root squash », qui associe l'UID 0 du client à un utilisateur non privilégié. Ce paramètre se configure dans une règle de l'export policy (politique d'export). Le **FlashArray File Services** le confirme : le squashing est un paramètre des règles de la politique d'export NFS. Les options sont root-squash (valeur par défaut, qui associe l'UID 0 à l'utilisateur anonyme, 65534 « nobody » par défaut), no-root-squash (root conserve ses privilèges) et all-squash (tous les utilisateurs sont associés à l'utilisateur anonyme), avec --anonuid et --anongid pour fixer l'identité anonyme (par exemple `purepolicy nfs rule add --client <réseau> --no-root-squash <politique>`). Le montage est autorisé d'après l'adresse du client et les règles de la politique, tandis que l'accès aux fichiers est jugé sur l'identité obtenue après squash : root monte donc sans problème mais est traité comme « nobody » pour les fichiers."]], "t": "File Services"}, {"n": 60, "q": "An administrator setup replicated snapshots for a protection group last week. They left the local snapshot schedule disabled. How many snapshots are stored locally on the source array ?", "o": {"A": "0", "B": "All of the replicated snapshots are also stored locally", "C": "1"}, "a": "B", "e": [["p", "La réplication asynchrone crée d'abord une snapshot du groupe de protection sur la source, puis la transfère. Ces snapshots restent donc stockées localement selon la rétention du planning de réplication, même si le planning de snapshots locales est désactivé."]], "t": "ActiveCluster & ActiveDR"}, {"n": 61, "q": "An administrator needs a comparison of FA File performance across multiple arrays. What Pure1 Manage report will provide the best results ?", "o": {"A": "File Systems Performance", "B": "Overview Dashboard", "C": "Array Performance"}, "a": "A", "e": [["p", "Dans Pure1 Manage, la page Analytics > Performance > File Systems permet d’analyser les performances des systèmes de fichiers. Pour les FlashArray, les métriques de performance associées aux systèmes de fichiers sont accessibles via l’onglet Directories. Pure1 Manage permet également de regrouper plusieurs baies afin de les suivre comme une seule entité pour l’analyse des performances."]], "t": "File Services"}, {"n": 62, "q": "Which FA File Directory Services statement is correct ?", "o": {"A": "FA File uses file service interfaces as default for directory service communication", "B": "FA File uses management interfaces as default for directory service communication", "C": "FA File uses all network interfaces for DNS and directory service communication"}, "a": "B", "e": [["p", "D'après le guide **FlashArray File Services**, qui est explicite. (1) Pour le DNS, le guide indique que, par défaut, la FlashArray utilise le port Ethernet de management ; une interface alternative (en général le file VIF) ne se choisit que si le port de management ne joint pas le serveur DNS dédié au fichier. (2) Pour Active Directory, le guide désigne vir0 comme interface réseau par défaut pour la communication AD (« revert to the default network interface (vir0) »): la sortie de « purenetwork eth list » du guide montre que vir0 est le VIF de service « management ». La commande « `puread account setattr --source <vif> <compte>` » permet d'affecter un file VIF comme interface de sortie, et « `pureds setattr --source <vif> <ds>` » fait de même pour une connexion LDAP (la colonne Source est vide par défaut). (3) Le guide de triage AD/LDAP précise que seules l'interface DNS configurée (vir0 par défaut) et l'interface de service « ds » configurée (modifiable vers un file VIF) ont besoin des ports 389, 636, 88, etc. ouverts vers les serveurs AD. Les interfaces de fichiers ne sont donc qu'une option configurable, pas la valeur par défaut : A est fausse. C est fausse également : une seule interface source est utilisée pour chaque service, et non toutes les interfaces. La mention de l'option « --use-management-interfaces » de l'explication d'origine n'a pas été retrouvée dans le guide."]], "t": "File Services"}, {"n": 63, "q": "A storage administrator is troubleshooting a FlashArray that is critically low on space. They have successfully deleted and eradicated a large volume, but used space keeps increasing. What is a possible cause ?", "o": {"A": "Space decrease won't be seen for 1 day, as the volume is kept for 24 hours as a safeguard", "B": "FlashArray workload is too high, and the reclamation process is not keeping up", "C": "A host is still connected to the volume so space was not released"}, "a": "B", "e": [["p", "Le guide **FlashArray Space** le dit explicitement : lorsqu'un volume ou un snapshot est supprimé puis éradiqué, la FlashArray ne récupère pas immédiatement l'espace ; elle a besoin de tâches de fond de récupération d'espace pour le rendre réellement disponible. Parmi les causes courantes d'un retard figurent une charge de travail excessive qui limite les ressources pour la comptabilité d'espace et la récupération, des écritures soutenues qui créent un retard de comptabilité, et un taux d'occupation élevé (\\> 80 %) avec des pics de charge. L'espace utilisé peut donc continuer d'augmenter temporairement, et l'espace système disparaît généralement lorsque l'activité en cause cesse. Si l'espace système reste affiché longtemps sans charge de travail expliquant la situation, le support Everpure peut vérifier l'efficacité des processus de comptabilité et de récupération. Complément (**Authorized Support Partner (ASP) Handbook**, « Reviewing Workload and Load Meter ») : si la baie est à ses limites, la récupération d'espace et le reporting d'espace ne sont pas priorisés, car le système traite d'abord les lectures et les écritures ; l'espace utilisé peut donc continuer d'augmenter malgré l'éradication d'un gros volume. Le Handbook recommande de contrôler le Load Meter de Pure1 lorsque l'espace change pendant une forte charge, et rappelle qu'une baie au-dessus de 100 % de remplissage GUI fait exception à cette règle."]], "t": "Capacité & espace"}, {"n": 64, "q": "Refer to the exhibit. What is the most likely cause of system space in this capacity graph ?", "o": {"A": "Space reclamation stopped working properly", "B": "Large volume destroyed and eradicated", "C": "SafeMode was enabled on the system"}, "a": "B", "e": [["p", "La baisse brutale de l'espace « Unique » coïncide avec l'apparition d'un espace « System » très important, puis cet espace « System » diminue progressivement. Cela correspond au scénario d'un volume important détruit puis éradiqué, suivi par la récupération d'espace en arrière-plan. Le **Purity//FA Administration Guide 6.10.4** précise que « System » représente l'espace physique occupé par les métadonnées internes et que, dans certaines situations atypiques après des suppressions de LUN ou de nombreuses réécritures, il peut aussi représenter de l'espace utilisateur récupérable ; cet espace doit diminuer avec le temps. L'évolution du graphique est donc cohérente avec la réponse B."]], "t": "Capacité & espace", "x": "graphique de capacité du 14/06/2022, curseur à 10:46:30 (MDT). Valeurs affichées : Empty Space 0.00 ; System 38.88 T ; Replication 0.00 ; Shared Space 105.02 G ; Snapshots 172.22 M ; Unique 1.70 G ; Used 38.99 T ; Usable Capacity 35.39 T ; Data Reduction 10.22. L'aire « Unique » (turquoise) occupe un très grand volume jusqu'à environ 10:45, puis s'effondre en quelques minutes jusqu'à presque zéro vers 10:50. L'aire « System » (gris) apparaît en même temps, atteint un pic, puis décroît progressivement jusqu'à environ 13:30 -- 14:00. La courbe en pointillés (Data Reduction) pique puis redescend."}, {"n": 65, "q": "In reviewing space metrics via the Pure Management GUI, a storage manager notices the total reduction rate is much higher than the Data Reduction Rate (DRR). What is the reason for this ?", "o": {"A": "The total reduction rate includes compression, while the Data Reduction Rate (DRR) does not", "B": "The total reduction rate includes thin provisioning, while the Data Reduction Rate (DRR) does not", "C": "The total reduction rate includes snapshot space, while the Data Reduction Rate (DRR) does not"}, "a": "B", "e": [["p", "Selon le **Purity//FA Administration Guide 6.10.4**, le « Data Reduction » est le rapport entre les secteurs mappés et l'espace physique après compression et déduplication, sans les économies de provisionnement dynamique. Le « Total Reduction » est le rapport sur les secteurs provisionnés : il inclut donc le provisionnement dynamique, d'où une valeur plus élevée. Le **FlashArray Space** illustre cette notion avec l'attribut « Thin Provisioning » d'un volume (visible en CLI avec « purevol list --space » et par l'API REST) : il représente la part de capacité non adressée par l'hôte ; par exemple, un volume de 100 G avec un Thin Provisioning de 95 % a reçu 5 G de données de l'hôte (taille × (1 − Thin Provisioning)), valeur qui correspond à la capacité « Virtual Host Written » utilisée pour la facturation interne (chargeback) . Cette capacité écrite par l'hôte peut différer de la vue de l'hôte si celui-ci n'a pas exécuté UNMAP/TRIM, et n'est pas disponible pour les snapshots."]], "t": "Capacité & espace"}, {"n": 66, "q": "A network admin is trying to setup Pure1 access and phone home logging on the array. What port should the admin ensure be opened for the array ?", "o": {"A": "22", "B": "8117", "C": "443"}, "a": "C", "e": [["p", "Le **Pure1 Manage - Troubleshooting**, indique explicitement, dans « Pure1 Edge Service -- Supported Systems and Prerequisites », que **le port 443 doit être ouvert et que Pure1 phone-home doit être configuré et opérationnel**. Il précise également que l'endpoint `rest2.cloud-support.purestorage.com` doit être autorisé dans les proxy/firewalls. **Q66 = C (443), confirmation directe par la documentation 2026 (p. 58).** Le 8117 reste le port de réplication FlashArray dans le contexte de la question, tandis que 22 correspond à SSH."]], "t": "Pure1 & supervision"}, {"n": 67, "q": "Which protection group cannot be ratcheted for SafeMode ?", "o": {"A": "A default protection group", "B": "Protection groups with hosts or hostgroups", "C": "A protection group without a local snapshot schedule"}, "a": "B", "e": [["p", "Le **Purity//FA Administration Guide 6.10.4**, indique que le verrouillage de rétention SafeMode « ne peut pas être ratcheté sur les groupes de protection ayant des membres hôtes ou groupes d'hôtes, ou des cibles d'offload ». Pour l'utiliser, il faut créer un autre groupe de protection contenant les volumes à protéger. Le guide ne conditionne pas le ratchet à l'existence d'un planning de snapshots locales, et le groupe de protection par défaut peut être verrouillé."]], "t": "Protection & SafeMode"}, {"n": 68, "q": "What does an asynchronous blackout window prevent ?", "o": {"A": "In progress transfers that started before the blackout window", "B": "New replication transfers that started before the blackout window", "C": "New replication transfers from starting during the blackout window"}, "a": "C", "e": [["p", "Une fenêtre d'interdiction (blackout) de la réplication asynchrone empêche le démarrage de nouveaux transferts pendant la fenêtre. Les transferts déjà en cours se terminent normalement."]], "t": "ActiveCluster & ActiveDR"}, {"n": 69, "q": "What happens when you demote the original source pod ?", "o": {"A": "It saves a temporary copy of the source pod content in the eradication bin", "B": "Replication is reversed", "C": "Replication is paused"}, "a": "B", "e": [["p", "Ce scénario correspond à ActiveDR (promote/demote), et non à ActiveCluster. Selon la **ActiveDR Technical Bulletin TB-200501**, pour inverser les rôles, le pod réplica reste promu et l'administrateur de la baie source rétrograde (demote) le pod source d'origine : la combinaison pod réplica promu + pod source rétrogradé inverse automatiquement le sens de la réplication, et le pod source d'origine devient le réplica. Avec l'option --skip-quiesce, la réplication inverse démarre immédiatement (« reprotection ») ; avec --quiesce (scénario de migration), elle est inhibée."]], "t": "ActiveCluster & ActiveDR"}, {"n": 70, "q": "A storage administrator needs to determine what actions were taken on the array by the previous shift and is only able to access the FlashArray via CLI. Which command provides that information ?", "o": {"A": "pureaudit list --puremessage", "B": "pureaudit list", "C": "puremessage list"}, "a": "B", "e": [["p", "**Purity_FA Administration** confirme la réponse B : `pureaudit list` affiche les enregistrements d'audit correspondant aux actions administratives qui modifient la configuration de la baie, avec notamment l'ID, l'heure, l'utilisateur, l'origine, la commande, la sous-commande et les arguments. `puremessage list` concerne les messages et alertes, et non le journal des actions administratives. `pureaudit list --puremessage` n'est pas la syntaxe attendue."]], "t": "Hôtes, volumes & admin"}, {"n": 71, "q": "An X20R4 array containing 10 x 4.5TB DirectFlash Modules is running out of capacity. The customer found a data pack scheduled for a FlashArray//C array and has inserted it into the array. The customer is unable to admit the new capacity. What is a possible reason for this ?", "o": {"A": "The new capacity is SAS, which is NOT compatible with an X20R4", "B": "The new capacity is QLC, which is NOT compatible with an X20R4", "C": "The new capacity is TLC, which is NOT compatible with an X20R4"}, "a": "B", "e": [["p", "(1) Le guide **FlashArray//C** établit que la //C est la première baie tout QLC et que la famille //C ne prend en charge que des modules DirectFlash capacitifs (DFMc) : les modules DFM des //X ne sont pas compatibles avec la //C (le guide //CR5 ajoute qu'il n'y a pas de support de médias mixtes et que les DFMe ne sont pas compatibles). La capacité d'une //C est vendue en data packs de DFMc NVMe QLC (par exemple 18,6, 24, 37,5, 48,2 ou 75 To par module), qu'il s'agisse d'un châssis ou d'un DirectFlash Shelf. Un data pack destiné à une //C est donc composé de modules QLC DFMc, d'un type différent des modules DirectFlash de la //X20R4 (TLC). (2) Le **FlashArray//XR4 Service Guide 50-0033-11** précise que tous les modules installés dans un châssis doivent être du même type et de la même capacité, et que la //XR4 prend en charge les nouvelles installations de modules NVMe uniquement (le SAS seulement lors des mises à niveau depuis d'anciens modèles). (3) Le **FlashArray Space** indique que l'admission peut échouer pour certaines combinaisons de modules ou de types ; le module reste alors « unadmitted » (détail « Admit failed ») et il faut contacter le support."]], "t": "Capacité & espace"}];      // n, q = énoncé, o = options, a = bonne réponse, e = explication (blocs), t = thème, x = description d'exhibit

/* Création d'élément concise (le texte est toujours inséré via textContent : aucun risque d'injection) */
function el(tag, attrs={}, ...enfants){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class') n.className = v;
    else if(k==='text') n.textContent = v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if(v!==false && v!=null) n.setAttribute(k, v);
  }
  enfants.flat().filter(c => c != null && c !== false).forEach(c => n.append(c));  // ignore les enfants vides
  return n;
}
/* ============================================================
   TEXTE ENRICHI : **gras**, *italique*, `code` (construit via le DOM, sans innerHTML)
   ============================================================ */
function inline(txt){
  const f = document.createDocumentFragment();
  String(txt).split(/(\*\*[^*]+\*\*|`[^`]+`|\*[^*\s][^*]*\*)/).forEach(s => {
    if(!s) return;
    if(s.startsWith('**')) f.append(el('strong',{text:s.slice(2,-2)}));
    else if(s[0]==='`') f.append(el('code',{text:s.slice(1,-1)}));
    else if(s[0]==='*') f.append(el('em',{text:s.slice(1,-1)}));
    else f.append(s);
  });
  return f;
}
const bloc = b => b[0]==='ul' ? el('ul',{}, b[1].map(x => el('li',{}, inline(x)))) : el('p',{}, inline(b[1]));
