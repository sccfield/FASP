function ouvrirZoom(src, alt){
  let s = 1, x = 0, y = 0, deplace = false; const pts = new Map(); let d0 = 0, s0 = 1;
  const retour = document.activeElement;
  const img = el('img',{src, alt, draggable:'false'});
  const scene = el('div',{class:'zoom-scene'}, img);
  const lbl = el('span');
  const maj = () => { img.style.transform = `translate(${x}px,${y}px) scale(${s})`; lbl.textContent = Math.round(s*100) + ' %'; };
  const zoomer = (f, cx, cy) => {                       // zoom centré sur (cx,cy), en pixels écran
    const r = scene.getBoundingClientRect();
    const px = (cx ?? r.left + r.width/2) - r.left - r.width/2, py = (cy ?? r.top + r.height/2) - r.top - r.height/2;
    const ns = Math.min(10, Math.max(.3, s*f)), k = ns/s;
    x = px - (px-x)*k; y = py - (py-y)*k; s = ns; maj();
  };
  const reset = () => { s = 1; x = 0; y = 0; maj(); };
  const fermer = () => { document.removeEventListener('keydown', touche, true); ov.remove(); document.body.style.overflow = ''; retour?.focus?.(); };
  const touche = e => {
    if(e.key==='Escape') fermer(); else if(e.key==='+'||e.key==='=') zoomer(1.25); else if(e.key==='-') zoomer(.8); else if(e.key==='0') reset(); else return;
    e.preventDefault(); e.stopPropagation();
  };
  const btnFermer = el('button',{onclick:fermer,'aria-label':'Fermer',text:'✕ Fermer'});
  const ov = el('div',{class:'zoom',role:'dialog','aria-modal':'true','aria-label':'Exhibit agrandi'},
    el('div',{class:'zoom-barre'},
      el('button',{onclick:()=>zoomer(.8),'aria-label':'Dézoomer',text:'−'}), lbl,
      el('button',{onclick:()=>zoomer(1.25),'aria-label':'Zoomer',text:'+'}),
      el('button',{onclick:reset,text:'Ajuster'}), btnFermer,
      el('small',{style:'flex-basis:100%;text-align:center;color:#aaa',text:'Molette ou pincer pour zoomer · glisser pour déplacer · double-clic pour agrandir · Échap pour fermer'})),
    scene);
  scene.addEventListener('wheel', e => { e.preventDefault(); zoomer(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX, e.clientY); }, {passive:false});
  scene.addEventListener('dblclick', e => { if(s > 1.05) reset(); else zoomer(2.5, e.clientX, e.clientY); });
  scene.addEventListener('pointerdown', e => { scene.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); deplace = false;
    if(pts.size===2){ const [a,b] = [...pts.values()]; d0 = Math.hypot(a.x-b.x, a.y-b.y); s0 = s; } });
  scene.addEventListener('pointermove', e => {
    if(!pts.has(e.pointerId)) return;
    const p = pts.get(e.pointerId);
    if(pts.size===1){ x += e.clientX-p.x; y += e.clientY-p.y; if(Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y) > 2) deplace = true; maj(); }
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){ const [a,b] = [...pts.values()]; zoomer(s0*Math.hypot(a.x-b.x,a.y-b.y)/d0/s, (a.x+b.x)/2, (a.y+b.y)/2); deplace = true; }
  });
  const fin = e => { pts.delete(e.pointerId); if(e.type==='pointerup' && e.target===scene && !deplace && pts.size===0) fermer(); };
  scene.addEventListener('pointerup', fin); scene.addEventListener('pointercancel', fin);
  document.body.append(ov); document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', touche, true);
  maj(); btnFermer.focus();
}

/* ============================================================
   PROTECTIONS ANTI-REPRODUCTION (dissuasives : aucun moyen n'empêche totalement la copie d'une page web)
   true / false pour activer ou désactiver chaque mesure
   ============================================================ */
const PROTECTION = {
  antiCopie: true,    // pas de sélection / copier / glisser-déposer / menu contextuel sur le contenu
  impression: false   // false = l'impression (Ctrl+P / PDF) n'affiche qu'un message
};
function activerProtections(){
  const b = document.body;
  b.classList.toggle('sans-impression', !PROTECTION.impression);
  b.classList.toggle('anti-copie', PROTECTION.antiCopie);
  if(PROTECTION.antiCopie)
    ['copy','cut','dragstart','contextmenu','selectstart'].forEach(ev =>
      document.addEventListener(ev, e => { if(!(e.target.closest && e.target.closest('input,textarea'))) e.preventDefault(); }));
}
/* Le copyright est reconstitué s'il est supprimé ou modifié */
function garantirCopyright(){
  let f = document.querySelector('footer');
  if(!f){ f = el('footer'); document.body.append(f); }
  const p = f.querySelector('.copyright');
  if(!p || !/Mohamed BARR/.test(p.textContent)){ p && p.remove(); f.prepend(el('p',{class:'copyright',text:'© 2026 Mohamed BARR. Tous droits réservés.'})); }
}

/* ============================================================
   FILTRES : statut (toutes, non vérifiées, erreurs, marquées) ou thème ; la navigation suit la sélection
   ============================================================ */
function liste(f = etat.filtre || 'tous'){
  const th = f.startsWith('th:') ? f.slice(3) : null;
  return QUESTIONS.map((_,i)=>i).filter(i => f==='tous' || (f==='nonrep' && !etat.verif[i]) || (f==='erreurs' && etat.verif[i] && !estJuste(i))
    || (f==='marquees' && etat.flags[i]) || (f==='dues' && etat.sr[i] && etat.sr[i].due<=Date.now()) || (th && QUESTIONS[i].t===th));
}
const ordreNav = () => { const l = liste(); return l.length ? l : QUESTIONS.map((_,i)=>i); };
function voisin(i, d){ const l = ordreNav(), p = l.indexOf(i); if(p<0) return Math.max(0, Math.min(N-1, i+d)); return l[p+d] ?? null; }

const pad = n => String(n).padStart(2,'0');
const fmt = ms => { const s = Math.max(0, Math.ceil(ms/1000)); return `${Math.floor(s/3600)}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`; };

function majEntete(){
  const pastille = document.getElementById('scoreLive'), barre = document.getElementById('barreGlobale');
  const enExam = examActif() && (etat.vue==='examQ' || etat.vue==='examRevue');
  if(enExam){
    const rest = etat.exam.fin - Date.now();
    pastille.textContent = `⏱ ${fmt(rest)}`;
    pastille.classList.toggle('attention', rest < 15*60000 && rest >= 5*60000);
    pastille.classList.toggle('urgence', rest < 5*60000);
    barre.style.width = (nbRepExam()/N*100) + '%';
  } else {
    pastille.classList.remove('attention','urgence');
    pastille.textContent = `Score : ${nbJustes()} / ${nbVerifiees()}`;
    barre.style.width = (nbVerifiees()/N*100) + '%';
  }
}

      el('span',{},el('i'),'Non répondue'), el('span',{},el('i',{class:'ok'}),'Correcte'), el('span',{},el('i',{class:'ko'}),'Incorrecte'), el('span',{},el('i',{class:'flag'}),'Marquée')),

/* ============================================================
   VUE 2 : QUESTION
   ============================================================ */
function blocFeedback(i){
  const q = QUESTIONS[i], ok = estJuste(i);
  return el('div',{class:`fb-corps ${ok?'ok':'ko'}`},
    el('p',{class:'fb-titre',text: ok ? '✅ Correcte !' : '❌ Incorrecte'}),
    ok ? null : el('p',{},'La bonne réponse est ', el('strong',{}, `${q.a}. `, inline(q.o[q.a])), '.'),
    el('p',{class:'expl-label',text:'Explication'}),
    q.e.map(bloc)
  );
}

function vueQuestion(){
  const i = etat.cur, q = QUESTIONS[i], verifiee = !!etat.verif[i];
  const choix = etat.rep[i] || null;

  /* Options : cases à cocher, une seule sélection possible */
  const champ = el('fieldset',{class:'options'}, el('legend',{class:'sr',style:'position:absolute;left:-9999px',text:`Options de la question ${q.n}`}));
  Object.entries(q.o).forEach(([lettre,texte])=>{
    let cls = 'option';
    if(verifiee){
      cls += ' verrou';
      if(lettre===q.a) cls += ' bonne';
      else if(lettre===choix) cls += ' mauvaise';
    } else if(lettre===choix) cls += ' choisie';

    const cb = el('input',{type:'checkbox',name:`q${q.n}`,value:lettre,checked:lettre===choix?'':false,disabled:verifiee?'':false});
    cb.checked = lettre===choix;
    cb.addEventListener('change',()=>{
      etat.rep[i] = cb.checked ? lettre : undefined;       // décocher = effacer la sélection
      if(!cb.checked) delete etat.rep[i];
      sauver(); rendre();
    });
    const badge = verifiee && lettre===q.a ? el('span',{class:'badge',text:'Bonne réponse'})
                : verifiee && lettre===choix ? el('span',{class:'badge',text:'Votre réponse'}) : null;
    champ.append(el('label',{class:cls}, cb, el('span',{class:'lettre',text:lettre+'.'}), el('span',{class:'texte-opt'}, inline(texte)), badge));
  });

  const fb = el('div',{class:'feedback','aria-live':'polite'}, el('div',{}, verifiee ? blocFeedback(i) : ''));
  if(verifiee) fb.classList.add('ouvert');

  const L = ordreNav(), p = Math.max(0, L.indexOf(i)), prev = voisin(i,-1), next = voisin(i,1), dernier = next===null;
  const btnVerifier = el('button',{class:'btn primaire',disabled:(!choix||verifiee)?'':false,text:'Vérifier la réponse',
    onclick:()=>{
      if(!choix || etat.verif[i]) return;
      etat.verif[i] = true; srMaj(i, choix===q.a); sauver(); majEntete();
      fb.firstChild.replaceChildren(blocFeedback(i));
      /* Mise en couleur des options sans reconstruire la page, pour garder l'animation */
      champ.querySelectorAll('.option').forEach(l=>{
        const v = l.querySelector('input').value;
        l.classList.remove('choisie'); l.classList.add('verrou');
        l.querySelector('input').disabled = true;
        if(v===q.a){ l.classList.add('bonne'); l.append(el('span',{class:'badge',text:'Bonne réponse'})); }
        else if(v===choix){ l.classList.add('mauvaise'); l.append(el('span',{class:'badge',text:'Votre réponse'})); }
      });
      btnVerifier.disabled = true;
      requestAnimationFrame(()=>requestAnimationFrame(()=>fb.classList.add('ouvert')));
      setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),150);
    }});

  return el('section',{class:'carte'},
    el('div',{class:'haut-q'},
      el('span',{class:'num-q',text: etat.filtre==='tous' ? `Question ${q.n} sur ${N}` : `Question ${q.n} · ${p+1}/${L.length} de la sélection`}),
      el('div',{class:'rangee'}, boutonFlag(etat.flags, i), el('button',{class:'lien',onclick:()=>aller('sommaire'),text:'Retour au sommaire'}))
    ),
    el('div',{class:'mini-barre'}, el('div',{style:`width:${(p+1)/L.length*100}%`})),
    el('h2',{class:'enonce'}, inline(q.q)),
    blocExhibit(q),
    champ,
    fb,
    el('div',{class:'nav-q'},
      el('button',{class:'btn fleche',disabled:prev===null?'':false,'aria-label':'Question précédente',title:'Précédente (←)',onclick:()=>aller('question',prev),text:'←'}),
      el('div',{class:'nav-centre'},
        btnVerifier,
        dernier ? el('button',{class:'btn',onclick:()=>aller('resume'),text:'Terminer'}) : null
      ),
      el('button',{class:'btn fleche',disabled:dernier?'':false,'aria-label':'Question suivante',title:'Suivante (→)',onclick:()=>aller('question',next),text:'→'})
    )
  );
}

/* ============================================================
   VUE 3 : RÉSUMÉ FINAL
   ============================================================ */
function vueResume(){
  const j = nbJustes(), v = nbVerifiees(), f = v-j, nr = N-v;

        el('div',{class:'v',style:'width:0'}), el('div',{class:'r',style:'width:0'})),
      el('div',{class:'repartition',text:`${j} correcte${j>1?'s':''} · ${f} incorrecte${f>1?'s':''} · ${nr} non vérifiée${nr>1?'s':''}`}),

/* ============================================================
   MARQUAGE : bouton « 🚩 Marquer pour révision » (entraînement et examen)
   ============================================================ */
function boutonFlag(flags, idx){
  const b = el('button',{class:'btn drapeau',title:'Marquer cette question pour y revenir plus tard'});
  const maj = () => { const on = !!flags[idx]; b.classList.toggle('actif',on); b.setAttribute('aria-pressed',String(on)); b.textContent = on ? '🚩 Marquée' : '🚩 Marquer pour révision'; };
  b.addEventListener('click',()=>{ if(flags[idx]) delete flags[idx]; else flags[idx] = true; sauver(); maj(); });
  maj(); return b;
}

/* Carte de correction (utilisée par le résumé d'entraînement et le résultat d'examen) */
function carteRevue({q, choix, repondu, flag, label, msgNr, onRevoir}){
  const s = !repondu ? 'nr' : (choix===q.a ? 'ok' : 'ko');
  const opts = el('div',{class:'options'}, Object.entries(q.o).map(([l,tx])=>{
    let cls = 'option verrou', badge = null;
    if(l===q.a){ cls += ' bonne'; badge = el('span',{class:'badge',text:'Bonne réponse'}); }
    else if(repondu && l===choix){ cls += ' mauvaise'; badge = el('span',{class:'badge',text:'Votre réponse'}); }
    return el('div',{class:cls}, el('span',{class:'lettre',text:l+'.'}), el('span',{class:'texte-opt'}, inline(tx)), badge);
  }));
  return el('article',{class:`revue-item ${s}`},
    el('h3',{text:`${s==='ok'?'✅':s==='ko'?'❌':'⚪'} ${flag?'🚩 ':''}${label} – ${q.q}`}),
    blocExhibit(q),
    opts,
    s==='nr' ? el('p',{style:'color:var(--gris);margin:0 0 8px',text:msgNr}) : null,
    el('details',{}, el('summary',{text:'Explication'}), q.e.map(bloc)),
    onRevoir ? el('div',{style:'margin-top:8px'}, el('button',{class:'lien',onclick:onRevoir,text:'Revoir cette question'})) : null
  );
}

/* ============================================================
   MODE EXAMEN (type Pearson VUE) : 120 min, aucune correction avant la fin
   ============================================================ */
const vers = v => { etat.vue = v; sauver(); rendre(); window.scrollTo({top:0}); };
function allerExam(vue, pos){
  etat.vue = vue;
  if(pos!==undefined) etat.exam.pos = Math.max(0, Math.min(NX()-1, pos));
  sauver(); rendre(); window.scrollTo({top:0});
}

function demarrerExamen(){
  const court = etat.examType==='court', ordre = QUESTIONS.map((_,i)=>i);
  for(let k=ordre.length-1;k>0;k--){ const r = Math.floor(Math.random()*(k+1)); [ordre[k],ordre[r]] = [ordre[r],ordre[k]]; }  if(court) ordre.length = Math.min(MINI,N);
  const now = Date.now();
  etat.exam = { ordre, pos:0, rep:{}, flags:{}, debut:now, fin:now+(court?DUREE_MINI:DUREE_EXAMEN), court, termine:null, auto:false };
  allerExam('examQ', 0);
}

function terminerExamen(auto){
  if(!examActif()) return;
  etat.exam.termine = Math.min(Date.now(), etat.exam.fin);
  etat.exam.auto = !!auto; etat.exam.ordre.forEach(i => { if(etat.exam.rep[i]) srMaj(i, etat.exam.rep[i]===QUESTIONS[i].a); });
  etat.vue = 'examRes'; sauver(); rendre(); window.scrollTo({top:0});
}

/* Chronomètre : vérifié chaque seconde ; l'examen est rendu automatiquement à 0:00:00 */
function tick(){
  if(!examActif()) return;
  if(etat.exam.fin - Date.now() <= 0){ terminerExamen(true); return; }
  if(etat.vue==='examQ' || etat.vue==='examRevue') majEntete();
}

/* Encart du sommaire : lancer, reprendre ou revoir l'examen */

      el('button',{class:'btn primaire',onclick:()=>allerExam('examQ',ex.pos),text:'Reprendre l’examen'}));
  }
  return el('div',{class:'panneau-examen'},
    el('div',{}, el('strong',{text:'Mode examen'}), el('span',{text:`Simulation type Pearson VUE : ${N} questions, 120 minutes, résultat à la fin.`})),
    el('div',{class:'rangee'},
      ex ? el('button',{class:'btn',onclick:()=>vers('examRes'),text:`Dernier résultat (${Math.round(scoreExam()/NX()*100)} %)`}) : null,
      el('button',{class:'btn primaire',onclick:()=>{etat.examType='complet';vers('examIntro')},text:ex ? 'Nouvel examen' : 'Passer l’examen'})));

function vueExamRevue(){

      el('div',{class:'stat'}, el('b',{text:String(nbMarq)}), el('span',{text:'Marquées'}))),
    el('div',{class:'legende'}, el('span',{},el('i'),'Non répondue'), el('span',{},el('i',{style:'background:var(--orange-pale);border-color:var(--orange)'}),'Répondue'), el('span',{},el('i',{class:'flag'}),'Marquée')),

    el('div',{class:'rangee',style:'margin-bottom:22px'},

    el('div',{class:'nav-q'},

      el('button',{class:'btn primaire',text:'Terminer l’examen',onclick:async()=>{

}

/* ============================================================
   ACTIONS GLOBALES
   ============================================================ */
async function recommencer(){
  if(!(await confirmer('Effacer toutes vos réponses d’entraînement et recommencer ?', 'Recommencer'))) return;
  etat = Object.assign(ETAT_INITIAL(), {exam:etat.exam});   // ne réinitialise que l'entraînement
  sauver(); rendre(); window.scrollTo({top:0});
}

const VUES = {sommaire:vueSommaire, question:vueQuestion, resume:vueResume, examIntro:vueExamIntro, examQ:vueExamQ, examRevue:vueExamRevue, examRes:vueExamRes, apropos:vueApropos, dash:vueDash, rev:vueRev, flash:vueFlash};
let cleVue = null;
function rendre(){
  /* Garde-fous : état d'examen incohérent → retour au sommaire */
  if(etat.vue.startsWith('exam') && etat.vue!=='examIntro' && !etat.exam) etat.vue = 'sommaire';
  if((etat.vue==='examQ'||etat.vue==='examRevue') && !examActif()) etat.vue = etat.exam ? 'examRes' : 'sommaire';
  majEntete();
  document.body.classList.toggle('hors-sommaire', !['sommaire','apropos'].includes(etat.vue));
  document.body.classList.toggle('sur-apropos', etat.vue==='apropos');
  document.getElementById('banniereTexte').textContent = `QCM d’entraînement à la certification : ${N} questions, une réponse par question, correction et explication immédiates, ou mode examen chronométré.`;
  const maj = () => {
    $app.replaceChildren((VUES[etat.vue] || vueSommaire)());
    /* Animation de remplissage de la barre du résumé / résultat */
    const barre = $app.querySelector('.grande-barre');
    if(barre){
      const ex = etat.vue==='examRes', j = ex ? scoreExam() : nbJustes(), f = (ex ? nbRepExam() : nbVerifiees()) - j;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        barre.querySelector('.v').style.width = (j/N*100)+'%';
        barre.querySelector('.r').style.width = (f/N*100)+'%';
      }));
    }
  };
  /* Transition fluide entre pages (progressive : ignorée si le navigateur ne la gère pas) */
  const cle = etat.vue + ':' + etat.cur + ':' + (etat.exam ? etat.exam.pos : ''), change = cle !== cleVue && cleVue !== null;
  cleVue = cle;
  if(change && document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(maj); else maj();
}

/* Raccourcis clavier : ← → naviguer · A/B/C répondre · F marquer · Entrée vérifier · Échap ferme le zoom */
document.addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey || document.querySelector('.zoom,.modale')) return;
  if(!['question','examQ'].includes(etat.vue)) return;

/* Une page : coordonnées depuis le coin supérieur gauche, en points (1 pt = 1/72 pouce) */
function Page(w = 595.28, h = 841.89){
  const ops = [], Y = y => (h - y).toFixed(2);
  const P = { w, h, ops,
    rect(x, y, ww, hh, fill, stroke, lw = 1){ ops.push(`${fill ? rgb(fill)+' rg ' : ''}${stroke ? rgb(stroke)+' RG '+lw+' w ' : ''}${x} ${Y(y+hh)} ${ww} ${hh} re ${fill && stroke ? 'B' : fill ? 'f' : 'S'}`); return P; },
    ligne(x1, y1, x2, y2, c, lw = 1){ ops.push(`${rgb(c)} RG ${lw} w ${x1} ${Y(y1)} m ${x2} ${Y(y2)} l S`); return P; },
    texte(x, y, s, f = 'H', z = 10, c = '#33322E', al = 'l'){ const d = larg(f,s,z); x = al==='c' ? x - d/2 : al==='r' ? x - d : x; ops.push(`BT ${rgb(c)} rg /${f} ${z} Tf ${x.toFixed(2)} ${Y(y)} Td ${pdfStr(s)} Tj ET`); return P; },
    image(x, y, ww, hh){ ops.push(`q ${ww.toFixed(2)} 0 0 ${hh.toFixed(2)} ${x} ${Y(y+hh)} cm /Im1 Do Q`); return P; },
    par(x, y, s, f, z, c, max, lead){ coupe(f,s,z,max).forEach(l => { P.texte(x, y, l, f, z, c); y += lead; }); return y; }
  };
  return P;
}

/* Assemblage du fichier PDF 1.4 (objets, table xref) */
function assemblerPDF(pages, logo, titre){
  const S = s => Uint8Array.from(s, c => c.charCodeAt(0) & 255), o = [], n = pages.length;
  const cat = a => { const r = new Uint8Array(a.reduce((m,x) => m + x.length, 0)); let p = 0; a.forEach(x => { r.set(x,p); p += x.length; }); return r; };
  const flux = (d, data) => cat([S(`<<${d}/Length ${data.length}>>\nstream\n`), data, S('\nendstream')]);
  o[1] = S('<</Type/Catalog/Pages 2 0 R>>');
  o[2] = S(`<</Type/Pages/Count ${n}/Kids[${pages.map((_,i) => (10+2*i)+' 0 R').join(' ')}]>>`);
  ['Helvetica','Helvetica-Bold','Times-Bold','Times-Italic'].forEach((f,i) => o[3+i] = S(`<</Type/Font/Subtype/Type1/BaseFont/${f}/Encoding/WinAnsiEncoding>>`));
  o[7] = flux(`/Type/XObject/Subtype/Image/Width ${logo.w}/Height ${logo.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/SMask 8 0 R${logo.z?'/Filter/FlateDecode':''}`, logo.rgb);
  o[8] = flux(`/Type/XObject/Subtype/Image/Width ${logo.w}/Height ${logo.h}/ColorSpace/DeviceGray/BitsPerComponent 8${logo.z?'/Filter/FlateDecode':''}`, logo.a);
  const res = '/Resources<</Font<</H 3 0 R/HB 4 0 R/TB 5 0 R/TI 6 0 R>>/XObject<</Im1 7 0 R>>>>';
  pages.forEach((p,i) => { o[9+2*i] = flux('', S(p.ops.join('\n'))); o[10+2*i] = S(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${p.w} ${p.h}]${res}/Contents ${9+2*i} 0 R>>`); });
  const parts = [S('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')], off = []; let len = parts[0].length;
  for(let i = 1; i < o.length; i++){ off[i] = len; const b = cat([S(`${i} 0 obj\n`), o[i], S('\nendobj\n')]); parts.push(b); len += b.length; }
  let x = `xref\n0 ${o.length}\n0000000000 65535 f \n`; for(let i = 1; i < o.length; i++) x += String(off[i]).padStart(10,'0') + ' 00000 n \n';
  parts.push(S(x + `trailer\n<</Size ${o.length}/Root 1 0 R/Info<</Title ${pdfStr(titre)}/Author ${pdfStr('Mohamed BARR')}>>>>\nstartxref\n${len}\n%%EOF`));
  return cat(parts);
}

async function exporterPDF(k){
  try{
    if(!lireProfil() && !ignorerProfil()) await profilModal('Votre profil (facultatif)');
    const exam = k==='exam', ex = etat.exam, prof = lireProfil(), logo = await chargerLogo(), now = new Date();
    const ids = exam ? ex.ordre : Object.keys(etat.verif).map(Number), rep = exam ? ex.rep : etat.rep, total = exam ? NX() : N;
    const ok = ids.filter(i => rep[i]===QUESTIONS[i].a), rep_n = ids.filter(i => rep[i]).length, pct = Math.round(ok.length/total*100);
    const arevoir = ids.filter(i => rep[i]!==QUESTIONS[i].a);
    const th = THEMES.map(t => { const a = ids.filter(i => QUESTIONS[i].t===t); return [t, a.filter(i => rep[i]===QUESTIONS[i].a).length, a.length]; }).filter(x => x[2]);
    const pages = []; let p, y;
    const nouvelle = () => { p = Page(); pages.push(p);
      p.rect(0,0,595.28,72,'#1C1C1C').rect(0,72,595.28,4,'#FE5000').image(40,14,logo.w/logo.h*44,44)
       .texte(40+logo.w/logo.h*44+14,36,'Everpure Certified FlashArray Storage Professional','HB',13,'#FFFFFF')
       .texte(40+logo.w/logo.h*44+14,54,exam ? 'Relevé de résultats · examen blanc' : 'Relevé de résultats · entraînement','H',10,'#CFCFCF'); y = 104; };
    const place = h => { if(y + h > 790) nouvelle(); };
    nouvelle();
    p.texte(40,y,'Candidat','HB',9,'#777777').texte(40,y+16,prof ? nomComplet(prof) : 'Non renseigné','HB',14,'#1C1C1C');
    if(prof && prof.fonction) p.texte(40,y+32,prof.fonction,'H',10.5,'#555555');
    p.texte(555,y,'Date','HB',9,'#777777','r').texte(555,y+16,`${frDate(now)} à ${now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`,'H',10.5,'#1C1C1C','r');
    if(exam){ const s = Math.round((ex.termine-ex.debut)/1000); p.texte(555,y+32,`Durée : ${Math.floor(s/60)} min ${pad(s%60)} s`,'H',10.5,'#555555','r'); }
    y += 60;
    p.rect(40,y,515,96,'#FFFEFA','#E2E0D8',1).texte(60,y+58,pct+' %','HB',38,'#FE5000')
     .texte(190,y+34,`Score : ${ok.length} / ${total}`,'HB',15,'#1C1C1C')
     .texte(190,y+54,`${ok.length} correcte${ok.length>1?'s':''} · ${rep_n-ok.length} incorrecte${rep_n-ok.length>1?'s':''} · ${total-rep_n} non répondue${total-rep_n>1?'s':''}`,'H',10.5,'#555555');
    if(exam){ const r = pct >= SEUIL_REUSSITE; p.rect(190,y+64,86,20,r?'#1A8F4C':'#D32F2F').texte(233,y+78,r?'RÉUSSI':'ÉCHOUÉ','HB',10,'#FFFFFF','c').texte(286,y+78,`Seuil de réussite : ${SEUIL_REUSSITE} %`,'H',9.5,'#555555'); }
    else p.texte(190,y+78,`${rep_n} question${rep_n>1?'s':''} vérifiée${rep_n>1?'s':''} sur ${N}`,'H',9.5,'#555555');
    y += 124;
    p.texte(40,y,'Résultats par thème','HB',12,'#1C1C1C'); y += 10;
    p.rect(40,y,515,20,'#F3F1EB').texte(48,y+14,'Thème','HB',9,'#555555').texte(330,y+14,'Justes','HB',9,'#555555','r').texte(380,y+14,'Total','HB',9,'#555555','r').texte(405,y+14,'Taux','HB',9,'#555555'); y += 20;
    th.forEach(([n,a,b]) => { p.texte(48,y+15,n,'H',10,'#33322E').texte(330,y+15,String(a),'H',10,'#33322E','r').texte(380,y+15,String(b),'H',10,'#33322E','r')
      .rect(405,y+8,100,8,'#E8E6DE').rect(405,y+8,Math.max(1,100*a/b),8,a/b*100>=SEUIL_REUSSITE?'#1A8F4C':'#D32F2F').texte(552,y+15,Math.round(a/b*100)+' %','H',9.5,'#33322E','r').ligne(40,y+22,555,y+22,'#ECEAE2',.5); y += 22; });
    y += 22; place(60);
    p.texte(40,y,`Questions à revoir (${arevoir.length})`,'HB',12,'#1C1C1C'); y += 8;
    if(!arevoir.length){ y += 16; p.texte(40,y,'Aucune : bravo !','H',10.5,'#1A8F4C'); }
    arevoir.forEach(i => {
      const q = QUESTIONS[i], non = !rep[i];
      const l1 = coupe('H', nu(q.q), 9.5, 515), l2 = coupe('H', `Votre réponse : ${non ? 'aucune' : rep[i] + ' – ' + nu(q.o[rep[i]])}`, 9, 515), l3 = coupe('H', `Bonne réponse : ${q.a} – ${nu(q.o[q.a])}`, 9, 515);
      const ex_ = PDF_AVEC_EXPLICATIONS ? coupe('H', nu(q.e.map(b => b[0]==='ul' ? b[1].join(' ; ') : b[1]).join(' ')), 8.5, 515) : [];
      place(24 + 12*(l1.length + l2.length + l3.length + ex_.length) + 8);
      y += 20; p.texte(40,y,`Q${q.n}`,'HB',10,'#FE5000').texte(66,y,q.t + (non ? ' · non répondue' : ''),'HB',9,'#777777');
      y += 13; l1.forEach(l => { p.texte(40,y,l,'H',9.5,'#1C1C1C'); y += 12; });
      l2.forEach(l => { p.texte(40,y,l,'H',9,'#D32F2F'); y += 12; }); l3.forEach(l => { p.texte(40,y,l,'H',9,'#1A8F4C'); y += 12; });
      ex_.forEach(l => { p.texte(40,y,l,'H',8.5,'#555555'); y += 12; });
      y -= 4; p.ligne(40,y,555,y,'#ECEAE2',.5);
    });
    pages.forEach((pg,i) => pg.ligne(40,806,555.28,806,'#DDDDDD',.5).texte(40,822,'© 2026 Mohamed BARR. Tous droits réservés.','H',8,'#777777').texte(555.28,822,`Page ${i+1} / ${pages.length}`,'H',8,'#777777','r'));
    const nom = `Resultats_FASP_${exam?'examen':'entrainement'}${prof ? '_' + slug(nomComplet(prof)) : ''}_${now.toISOString().slice(0,10)}.pdf`;
    telecharger(assemblerPDF(pages, logo, 'Relevé de résultats - Everpure FASP'), nom);
  }catch(e){ info('Impossible de générer le PDF sur ce navigateur.'); }
}

/* ---------- Certificat de réussite (examen blanc réussi) ---------- */
async function certificat(){
  try{
    let prof = lireProfil();
    if(!prof){ await profilModal('Votre nom pour le certificat'); prof = lireProfil(); if(!prof) return info('Renseignez au moins votre prénom ou votre nom pour générer le certificat.'); }
    const ex = etat.exam, j = scoreExam(), tot = NX(), pct = Math.round(j/tot*100), logo = await chargerLogo(), W = 841.89, H = 595.28, cx = W/2;
    const date = frDate(new Date(ex.termine)), p = Page(W, H), nom = nomComplet(prof);
    let z = 40; while(larg('TB', nom, z) > W - 200 && z > 18) z -= 2;
    p.rect(0,0,W,H,'#FFFEFA').rect(22,22,W-44,H-44,null,'#FE5000',5).rect(34,34,W-68,H-68,null,'#1C1C1C',1)
     .image(cx-31, 56, 62, 62*logo.h/logo.w)
     .texte(cx,158,'CERTIFICAT DE RÉUSSITE','TB',34,'#1C1C1C','c').ligne(cx-70,176,cx+70,176,'#FE5000',2)
     .texte(cx,210,'Everpure Certified FlashArray Storage Professional','HB',21,'#FE5000','c')
     .texte(cx,246,'Ce document est décerné à','TI',14,'#6B6B6B','c')
     .texte(cx,296,nom,'TB',z,'#1C1C1C','c').ligne(cx-larg('TB',nom,z)/2-14,306,cx+larg('TB',nom,z)/2+14,306,'#1C1C1C',.8);
    let y = 330; if(prof.fonction){ p.texte(cx,y,prof.fonction,'H',13,'#555555','c'); y += 14; }
    y += 30; coupe('H', `pour avoir réussi l’examen blanc de certification (${tot} questions) avec un score de ${pct} % (${j} / ${tot}), au-dessus du seuil de réussite de ${SEUIL_REUSSITE} %.`, 13, 560).forEach(l => { p.texte(cx,y,l,'H',13,'#33322E','c'); y += 19; });
    p.texte(cx,y+22,`Date de réussite : ${date}`,'HB',15,'#1C1C1C','c')
     .ligne(110,488,300,488,'#1C1C1C',.8).texte(205,504,'Mohamed BARR','TI',12,'#1C1C1C','c').texte(205,518,'Auteur du QCM','H',8.5,'#777777','c')
     .texte(W-205,504,`Examen blanc : ${tot} questions`,'H',10,'#555555','c')
     .texte(cx,542,'Document délivré à titre d’entraînement : il ne constitue pas la certification officielle Everpure.','TI',10,'#777777','c')
     .texte(cx,556,'© 2026 Mohamed BARR. Tous droits réservés.','H',8.5,'#777777','c');
    telecharger(assemblerPDF([p], logo, 'Certificat de réussite - Everpure FASP'), `Certificat_FASP_${slug(nom)}_${new Date(ex.termine).toISOString().slice(0,10)}.pdf`);
  }catch(e){ info('Impossible de générer le certificat sur ce navigateur.'); }
}
async function partager(txt){
  const url = location.href.split('#')[0];
  if(!/^https?:/.test(location.protocol)) return info('Cette copie est ouverte en local : publiez-la (lien claude.ai, GitHub Pages, Netlify…) pour obtenir un lien à partager.');
  try{ if(navigator.share) return await navigator.share({title:document.title, text:txt||'QCM FASP Everpure', url}); }catch(e){ if(e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(url); info('Lien copié dans le presse-papiers.'); }catch(e){ info(url); }
}
const partagerBtn = t => el('button',{class:'btn',onclick:()=>partager(t()),text:'🔗 Partager'});
document.getElementById('btnShare').addEventListener('click', () => partager());
let invite = null; const btnInst = document.getElementById('btnInstall');
addEventListener('beforeinstallprompt', e => { e.preventDefault(); invite = e; });
const aideInstall = () => {
  const ua = navigator.userAgent, ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints > 1);
  if(matchMedia('(display-mode: standalone)').matches || navigator.standalone) return 'L’application est déjà installée : vous l’utilisez en mode application.';
  if(!/^https:/.test(location.protocol) && location.hostname !== 'localhost') return 'L’installation nécessite une adresse sécurisée (https://). Hébergez ce dossier (GitHub Pages, Netlify, Cloudflare Pages…), puis ouvrez le lien.';
  if(ios) return 'Sur iPhone / iPad (Safari) : touchez le bouton Partager, puis « Sur l’écran d’accueil ».';
  if(/Firefox/.test(ua)) return /Android/.test(ua) ? 'Firefox Android : menu ⋮ puis « Installer ».' : 'Firefox pour ordinateur ne sait pas installer les applications web. Ouvrez ce lien dans Chrome ou Edge (menu ⋮ puis « Installer »).';
  if(/Edg\//.test(ua)) return 'Edge : menu … puis « Applications » → « Installer ce site en tant qu’application ».';
  if(/Chrome|Chromium/.test(ua)) return 'Chrome : menu ⋮ puis « Installer l’application » (ou l’icône ⊕ dans la barre d’adresse). Si l’option n’apparaît pas, rechargez la page une fois.';
  if(/Safari/.test(ua)) return 'Safari (Mac) : menu Fichier puis « Ajouter au Dock ».';
  return 'Utilisez le menu de votre navigateur : « Installer l’application » ou « Ajouter à l’écran d’accueil ».';
};
btnInst.addEventListener('click', async () => { if(!invite) return info(aideInstall()); invite.prompt(); await invite.userChoice; invite = null; });
document.getElementById('btnProfil').addEventListener('click', () => profilModal());
document.getElementById('btnDemarrer').addEventListener('click', () => vers('sommaire'));
if('serviceWorker' in navigator && /^https?:/.test(location.protocol))     // hors ligne : nécessite sw.js à côté de la page
  addEventListener('load', () => navigator.serviceWorker.register('sw.js?page='+encodeURIComponent(location.pathname)).catch(()=>{}));

/* ============================================================
   DÉMARRAGE : thème clair/sombre, protections, copyright
   ============================================================ */
function appliquerTheme(th){ document.documentElement.dataset.theme = th; try{ localStorage.setItem('fasp_theme2', th); }catch(e){} }
let themeMem = null; try{ themeMem = localStorage.getItem('fasp_theme2'); }catch(e){}
if(themeMem) document.documentElement.dataset.theme = themeMem;     // sinon : thème clair (défaut)
const estSombre = () => document.documentElement.dataset.theme === 'dark';
const TAILLES = ['normal','grand','petit'];
function appliquerTaille(t){ document.documentElement.dataset.taille = t; try{ localStorage.setItem('fasp_taille', t); }catch(e){} document.getElementById('btnTaille').title = 'Taille du texte : ' + t; }
let tailleMem = null; try{ tailleMem = localStorage.getItem('fasp_taille'); }catch(e){}
appliquerTaille(TAILLES.includes(tailleMem) ? tailleMem : 'normal');
document.getElementById('btnTaille').addEventListener('click', () => appliquerTaille(TAILLES[(TAILLES.indexOf(document.documentElement.dataset.taille)+1) % TAILLES.length]));
document.getElementById('btnTheme').addEventListener('click', () => appliquerTheme(estSombre() ? 'light' : 'dark'));
activerProtections();
garantirCopyright();
new MutationObserver(garantirCopyright).observe(document.documentElement, {childList:true, subtree:true});
if(etat.vue==='sommaire') etat.vue = 'apropos';   // l'ouverture du fichier affiche toujours la page 1 (À propos)
tick();                       // termine l'examen si le temps s'est écoulé pendant l'absence
rendre();
setInterval(tick, 1000);
</script>
